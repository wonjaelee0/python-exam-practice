id: rules
short: 공통
title: elice 채점 규칙 · Python 3.6 · 유형별 요령
order: 0
summary: 시험장에서 점수를 잃는 형식 실수, 3.6에서 안 되는 문법, 문제 유형별 푸는 순서
body: |
  ## elice 채점 방식

  | 항목 | 내용 |
  |---|---|
  | 비교 방식 | 출력 전체를 **공백 한 칸까지** 그대로 비교한다. 출력 끝의 줄바꿈만 무시 |
  | `input("이름: ")` | 프롬프트 `이름: `도 출력에 들어가고, 채점할 때는 그 뒤에 줄이 바뀐다. 입력한 값은 출력에 나타나지 않는다 |
  | 실행 환경 | **Python 3.6** — 최신 문법 일부가 오류가 난다 (아래 표) |
  | 시험 중 결과 | Submit해도 점수·틀린 테스트를 보여 주지 않는다 → 스스로 경계값을 넣어 Run으로 확인 |

  > ⚠️ 프롬프트 문자열은 지문과 **글자 하나까지** 같아야 한다. `"이름:"`(공백 없음)과 `"이름: "`은 다른 출력이다.

  ## 제출 규칙 5가지

  1. `:` 뒤에는 한 칸 띄운다 — `print("합계: " + str(total))`
  2. `,` 뒤에는 한 칸 띄운다 — `1, 2, 3`
  3. 영어 문장은 대문자로 시작한다 — `Hello, world!`
  4. 문장부호(`.`, `!`, `?`) 앞에는 공백을 두지 않는다
  5. 난수를 쓰면 `random.seed(1)`처럼 지시된 시드를 먼저 정한다

  > ⚠️ `print("합계:", total)`은 쉼표 때문에 자동으로 공백 한 칸이 들어가 `합계: 10`이 된다. `print("합계: ", total)`은 공백이 **두 칸**이 된다.

  ## Python 3.6에서 안 되는 문법

  | 쓰면 안 되는 것 | 나온 버전 | 3.6에서 쓰는 방법 |
  |---|---|---|
  | `f"{x=}"` | 3.8 | `f"x={x}"` |
  | `:=` (바다코끼리 연산자) | 3.8 | 대입을 따로 한 줄로 |
  | f-string 안에 바깥과 같은 따옴표 `f"{d["a"]}"` | 3.12 | `f"{d['a']}"` |
  | `match` / `case` | 3.10 | `if` / `elif` |
  | `s.removeprefix()`, 딕셔너리 합치기 `d1 \| d2` | 3.9 | 슬라이싱, `d1.update(d2)` |
  | `math.prod()` | 3.8 | 반복문으로 곱하기 |

  f-string 자체(`f"{x}"`, `f"{x:.2f}"`)는 3.6부터 되므로 써도 된다.

  ## 유형별 요령

  | 유형 | 요령 |
  |---|---|
  | 출력 예측 | 변수 표를 그려 한 줄씩 값을 갱신한다. `print`의 `sep`·`end`, 줄바꿈 개수, 따옴표가 출력되는지(리스트 안의 문자열은 따옴표가 보임)를 마지막에 확인 |
  | 코드 빈칸 | 빈칸 **아래**에서 그 값이 어떻게 쓰이는지 먼저 본다 (반환되는가, 반복되는가, 자료형이 무엇인가) |
  | O/X | "항상", "반드시", "모든" 같은 말이 있으면 반례를 하나 떠올려 본다 |
  | 단답형 | 메서드·함수 이름은 철자와 대소문자까지 정확히 (`True`, `append`, `items`) |
  | 서술형 | ① 정의 ② 차이점 ③ 짧은 코드 예 ④ 결과 순서로 쓰면 채점 포인트를 놓치지 않는다 |

  ## 코딩 문제 Submit 직전 체크리스트

  - 프롬프트·출력 문장을 지문과 한 글자씩 비교했다
  - 예시 입력으로 Run해서 예시 출력과 같은지 확인했다
  - 경계값(0, 빈 입력, 최솟값·최댓값, 같은 값)을 직접 넣어 봤다
  - 정수가 나와야 할 곳에 `3.0`처럼 실수가 나오지 않는다 (`/` 대신 `//`)
  - 마지막에 불필요한 디버깅용 `print`를 지웠다
