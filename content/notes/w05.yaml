id: w05
short: 5주차
title: 리스트와 튜플
order: 5
summary: 인덱싱·슬라이싱 규칙, 메서드가 무엇을 반환하는지, 할당과 복사, 리스트 표현식, 2차원 리스트
quiz: w05
units: [b05]
body: |
  ## 리스트 · 튜플 한눈에

  | | 리스트 `list` | 튜플 `tuple` |
  |---|---|---|
  | 만들기 | `[1, 2]`, `[]`, `list(range(3))` | `(1, 2)`, `()`, `tuple([1, 2])` |
  | 요소 하나 | `[5]` | **`(5,)`** — `(5)`는 그냥 정수 5 |
  | 변경 | 가능 (mutable) | **불가** — `t[0] = 1`은 TypeError |
  | 공통 | 순서 있음, 인덱싱·슬라이싱·`in`·`len`·`for` | |

  ## 인덱싱과 슬라이싱 (`a = [10, 20, 30, 40, 50]`)

  | 코드 | 결과 | 메모 |
  |---|---|---|
  | `a[0]`, `a[-1]` | `10`, `50` | 음수는 뒤에서부터 |
  | `a[1:3]` | `[20, 30]` | 끝 인덱스 **미포함** |
  | `a[:2]`, `a[3:]` | `[10, 20]`, `[40, 50]` | 생략하면 처음/끝 |
  | `a[::2]` | `[10, 30, 50]` | step |
  | `a[::-1]` | `[50, 40, 30, 20, 10]` | 뒤집기 |
  | `a[9]` | **IndexError** | 인덱싱은 범위 밖이면 오류 |
  | `a[2:9]` | `[30, 40, 50]` | 슬라이싱은 범위 밖이어도 오류 없음 |

  ## 리스트 메서드 — 무엇을 돌려주나

  | 메서드 | 하는 일 | 반환 |
  |---|---|---|
  | `append(x)` | 끝에 x **하나** 추가 | None |
  | `extend(리스트)` | 끝에 요소들을 **하나씩** 추가 | None |
  | `insert(i, x)` | i번 자리에 끼워 넣기 | None |
  | `remove(x)` | 처음 나오는 x 하나 삭제 (없으면 ValueError) | None |
  | `pop()` / `pop(i)` | 마지막 / i번 요소를 꺼냄 | **꺼낸 값** |
  | `index(x)` | x의 첫 위치 (없으면 ValueError) | **위치** |
  | `count(x)` | x의 개수 | **개수** |
  | `sort()` / `reverse()` | 원래 리스트를 정렬 / 뒤집음 | None |
  | `sorted(a)` (함수) | 정렬된 **새 리스트**, a는 그대로 | **새 리스트** |

  > ⚠️ `a = a.sort()`라고 쓰면 a는 **None**이 된다. `a.sort()`만 쓰거나 `b = sorted(a)`.
  >
  > ⚠️ `a.append([4, 5])`는 `[…, [4, 5]]`(요소 1개 추가), `a.extend([4, 5])`는 `[…, 4, 5]`.

  ## 할당과 복사

  ```python
  a = [1, 2, 3]
  b = a           # 같은 리스트에 이름만 하나 더 → b를 바꾸면 a도 바뀜
  c = a.copy()    # 새 리스트 (a[:], list(a)도 같음) → c를 바꿔도 a는 그대로
  ```

  2차원 리스트를 완전히 따로 복사하려면 `import copy` 후 `copy.deepcopy(a)`. `a.copy()`는 안쪽 리스트를 함께 쓴다.

  > ⚠️ `m = [[0] * 3] * 3`은 **같은 행 하나를 세 번** 넣은 것이라 `m[0][0] = 1`을 하면 세 행이 모두 바뀐다. `[[0] * 3 for _ in range(3)]`로 만든다.

  ## 리스트 표현식과 map

  ```python
  nums = [1, 2, 3, 4, 5, 6]
  [x * 2 for x in nums]              # [2, 4, 6, 8, 10, 12]
  [x for x in nums if x % 2 == 0]    # [2, 4, 6]  — 조건은 for 뒤에
  list(map(int, ['1', '2']))         # [1, 2]     — map 결과는 list()로 감싸야 리스트
  ```

  ## 2차원 리스트

  - `m[행][열]` — `m = [[1, 2, 3], [4, 5, 6]]`에서 `m[1][2]`는 6
  - 전체 순회: `for row in m:` 안에서 `for v in row:`
  - 행 수 `len(m)`, 열 수 `len(m[0])`
