body: |
  ## 딕셔너리 `{키: 값}`

  - 키는 **바뀌지 않는 값**만: 문자열·숫자·튜플 O, 리스트 X (TypeError)
  - 같은 키를 두 번 쓰면 **나중 값만** 남는다: `{'a': 1, 'a': 2}` → `{'a': 2}`
  - `in`은 **키**를 검사한다: `'a' in d`
  - 넣은 순서대로 꺼내진다

  | 코드 | 동작 |
  |---|---|
  | `d['a']` | 값 읽기 — 키가 없으면 **KeyError** |
  | `d.get('a')`, `d.get('a', 0)` | 키가 없으면 `None` / 기본값 (오류 없음) |
  | `d['a'] = 5` | 있으면 수정, 없으면 추가 |
  | `d.update({'a': 1, 'b': 2})` | 여러 개 한꺼번에 추가·수정 |
  | `d.setdefault('a', 0)` | 키가 **없을 때만** 0을 넣고, 그 키의 값을 돌려줌 |
  | `d.pop('a')`, `del d['a']` | 삭제 (`pop`은 값을 돌려줌) |
  | `d.keys()`, `d.values()`, `d.items()` | 키들, 값들, (키, 값) 쌍들 |

  ```python
  counts = {}
  for w in ['사과', '배', '사과']:
      counts[w] = counts.get(w, 0) + 1     # {'사과': 2, '배': 1}
  for name, n in counts.items():
      print(name, n)
  ```

  ## 집합 `set`

  - **중복 없음, 순서 없음** → 인덱싱 `s[0]` 불가 (TypeError)
  - 빈 집합은 `set()` — `{}`는 빈 **딕셔너리**
  - 리스트 중복 제거: `set(a)` (순서는 보장 안 됨 → 필요하면 `sorted()`)

  | 연산 (`s = {1, 2, 3}`, `t = {3, 4}`) | 기호 | 메서드 | 결과 |
  |---|---|---|---|
  | 합집합 | `s \| t` | `union` | `{1, 2, 3, 4}` |
  | 교집합 | `s & t` | `intersection` | `{3}` |
  | 차집합 | `s - t` | `difference` | `{1, 2}` |
  | 대칭차집합 | `s ^ t` | `symmetric_difference` | `{1, 2, 4}` |

  | 메서드 | 동작 |
  |---|---|
  | `add(x)` | 요소 하나 추가 |
  | `update([x, y])` | 여러 개 추가 |
  | `remove(x)` | 삭제 — 없으면 **KeyError** |
  | `discard(x)` | 삭제 — 없어도 **오류 없음** |

  ## 문자열 메서드

  문자열은 **바뀌지 않는다**. 메서드는 새 문자열을 돌려줄 뿐이므로 결과를 변수에 다시 담아야 한다 (`s = s.upper()`).

  | 메서드 | 예 | 결과 |
  |---|---|---|
  | `upper()`, `lower()` | `'Hi'.upper()` | `'HI'` |
  | `replace(a, b)` | `'a-b'.replace('-', '+')` | `'a+b'` |
  | `split(구분자)` | `'a,b,,c'.split(',')` | `['a', 'b', '', 'c']` |
  | `split()` (인자 없음) | `' a  b '.split()` | `['a', 'b']` (공백 여러 개도 하나로) |
  | `'구분자'.join(리스트)` | `'-'.join(['a', 'b'])` | `'a-b'` |
  | `strip()`, `lstrip()`, `rstrip()` | `'  hi '.strip()` | `'hi'` |
  | `find(x)` | `'banana'.find('n')` | `2` (없으면 **-1**) |
  | `index(x)` | `'banana'.index('z')` | **ValueError** |
  | `count(x)` | `'banana'.count('a')` | `3` |

  > ⚠️ `join`은 **문자열 리스트**만 이을 수 있다. 숫자 리스트는 `' '.join(map(str, nums))`.
