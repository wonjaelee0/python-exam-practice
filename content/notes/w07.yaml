id: w07
short: 7주차
title: 함수
order: 7
summary: 정의와 호출, 매개변수와 인자, return과 None, 여러 값 반환은 튜플, 리스트를 넘기면 원본이 바뀐다
quiz: w07
units: [b07]
body: |
  ## 정의와 호출

  ```python
  def add(a, b):        # a, b: 매개변수(parameter)
      return a + b

  result = add(3, 4)    # 3, 4: 인자(argument) → result는 7
  ```

  - `def`만 하면 실행되지 않는다. **호출**해야 실행된다
  - 호출보다 정의가 **먼저** 있어야 한다 (아니면 NameError)
  - 매개변수 개수와 인자 개수가 다르면 **TypeError**
  - 함수 안에서 다른 함수를 호출할 수 있다

  ## return

  | 상황 | 결과 |
  |---|---|
  | `return 값` | 값을 돌려주고 **즉시 함수 종료** (아래 코드는 실행 안 됨) |
  | `return`이 없음 / `return`만 있음 | **None**을 돌려줌 |
  | `return a, b` | 튜플 `(a, b)` 하나를 돌려줌 → `x, y = f()`로 나눠 받기 |

  ```python
  def judge(score):
      if score >= 60:
          return 'Pass'      # 여기서 끝
      return 'Fail'
  ```

  ## print와 return

  | | `print` | `return` |
  |---|---|---|
  | 하는 일 | 화면에 **보여 줌** | 값을 호출한 곳에 **돌려줌** |
  | 결과를 변수에 저장 | 불가 (함수 결과는 None) | 가능 |

  > ⚠️ 출력만 하는 함수를 `print(f())`로 부르면 함수 안의 출력 다음 줄에 **`None`** 이 한 번 더 찍힌다.

  ## 리스트·딕셔너리를 인자로 넘길 때

  ```python
  def add_one(x):
      x.append(1)

  a = []
  add_one(a)
  print(a)     # [1] — 함수 안의 x와 a가 같은 리스트
  ```

  리스트·딕셔너리는 함수 안에서 **고치면 바깥에도 반영**된다. 새 리스트·딕셔너리를 만들어 `return`으로 돌려줄 수도 있다.

  ## 자주 쓰는 내장 함수

  | 함수 | 예 | 결과 |
  |---|---|---|
  | `abs` | `abs(-7)` | `7` |
  | `max`, `min` | `max(3, 7, 2)`, `min([3, 7, 2])` | `7`, `2` |
  | `sum` | `sum([1, 2, 3])` | `6` |
  | `len` | `len('hello')`, `len({'a': 1})` | `5`, `1` |
  | `round` | `round(3.14159, 2)` | `3.14` |
  | `sorted` | `sorted([3, 1, 2], reverse=True)` | `[3, 2, 1]` |
  | 형변환 | `int('10')`, `str(100)`, `list('ab')` | `10`, `'100'`, `['a', 'b']` |

  > ⚠️ `round(2.5)`는 **2**, `round(3.5)`는 **4** — 정확히 .5일 때는 짝수 쪽으로 반올림한다.
