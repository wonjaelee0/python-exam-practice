title: Python 소개 · 개발 환경 · Colab · 마크다운
order: 1
summary: 귀도 반 로섬·1991·PSF, 개발 환경 3분류, Colab 단축키, 마크다운 문법 한 장 정리
quiz: w01
body: |
  > 컴퓨터 개요 부분은 시험 범위에서 빠졌다는 공지 기준으로, Python 소개부터 정리했다.

  ## Python 기본 사실

  | 항목 | 내용 |
  |---|---|
  | 만든 사람 | 귀도 반 로섬 (Guido van Rossum, 네덜란드) |
  | 처음 공개 | **1991년** |
  | 관리 | **PSF** (Python Software Foundation), 오픈소스·무료 |
  | 이름 유래 | 영국 코미디 프로그램 《Monty Python's Flying Circus》 — **뱀이 아니다** |
  | 특징 | 쉽고 읽기 좋은 문법, 작성 후 바로 실행·확인, 풍부한 라이브러리, 객체 지향 + 절차적·함수형 지원, Windows·macOS·Linux에서 실행 |

  ## 활용 분야와 대표 도구

  | 분야 | 도구 |
  |---|---|
  | 수치 계산(배열·행렬) | NumPy |
  | 데이터 처리·분석 | pandas |
  | 시각화 | Matplotlib, Seaborn |
  | 머신러닝 / 딥러닝 | scikit-learn / PyTorch, TensorFlow |
  | 웹 데이터 수집·자동화 | requests, BeautifulSoup |
  | 웹·API 개발 | Django, Flask, FastAPI |
  | 과학·공학 계산 | NumPy, SciPy, SymPy |

  데이터 분석 흐름: 수집 → 전처리 → 분석 → 시각화 → 머신러닝/AI를 **한 언어로** 모두 할 수 있다는 것이 Python의 강점이다.

  ## 개발 환경 3가지

  | 구분 | 예 |
  |---|---|
  | 로컬 (내 PC에 설치) | Python IDLE, Jupyter Notebook, VSCode, PyCharm |
  | 온라인 (브라우저, 설치 없음) | Google Colab, Replit, Kaggle Notebooks |
  | 특수 목적 | Anaconda(데이터 과학), Django·Flask(웹) |

  ## Google Colab

  - 구글의 **클라우드** 파이썬 실행 환경. 설치 없이 브라우저에서 쓰고, 구글 계정이 필요하다
  - Jupyter Notebook 형식: **코드 셀**(파이썬) + **텍스트 셀**(마크다운)
  - 무료 GPU·TPU 제공
  - 단축키

  | 단축키 | 동작 |
  |---|---|
  | `Shift + Enter` | 실행하고 **다음 셀로 이동** |
  | `Ctrl + Enter` | 실행하고 **현재 셀에 머무름** |

  ## 마크다운 문법

  | 하고 싶은 것 | 쓰는 법 |
  |---|---|
  | 제목 | `#` ~ `######` (1~6개, **많을수록 작아짐**) |
  | 굵게 | `**글자**` 또는 `__글자__` |
  | 기울임 | `*글자*` 또는 `_글자_` |
  | 취소선 | `~~글자~~` |
  | 순서 없는 목록 | `*`, `+`, `-` 중 아무거나 |
  | 순서 있는 목록 | `1.` `2.` … (적은 숫자와 상관없이 차례로 번호가 매겨짐) |
  | 링크 | `[보일 글자](주소)` |
  | 이미지 | `![설명](주소)` — 링크 앞에 `!` |
  | 수식 | `$E = mc^2$`(문장 속), `$$ … $$`(한 줄 전체) |
  | 인용구 | 줄 앞에 `>` |
  | 구분선 | `---`, `***`, `___` |

  > ⚠️ 자주 헷갈리는 것: `#`이 많을수록 제목이 **작아진다** · 이미지는 `!`로 시작 · 머무르는 실행은 `Ctrl + Enter`
