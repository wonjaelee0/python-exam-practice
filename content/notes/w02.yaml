title: 기본 문법 · 자료형 · 연산 · 변수와 입력
order: 2
summary: print의 sep·end, 연산자 결과 자료형과 우선순위, 형변환 함정, input은 항상 문자열
quiz: w02
units: [b02]
body: |
  ## 기본 문법

  - 주석은 `#`부터 줄 끝까지. 실행 결과에 영향이 없다
  - 들여쓰기는 **문법**이다. 블록(if·for·def 아래)은 같은 칸만큼 들여쓰고, 권장은 공백 4칸(PEP 8). 맞지 않으면 `IndentationError`
  - `print(a, b)`는 값 사이에 공백 한 칸, 끝에 줄바꿈을 넣는다

  | 쓰는 법 | 출력 |
  |---|---|
  | `print(1, 2, 3)` | `1 2 3` |
  | `print(1, 2, 3, sep='-')` | `1-2-3` |
  | `print('a', end=''); print('b')` | `ab` |
  | `print('a' + 'b')` | `ab` (문자열 연결은 공백 없음) |

  ## 자료형

  | 자료형 | 예 | 확인 |
  |---|---|---|
  | `int` | `3`, `-7` | `type(3)` → `<class 'int'>` |
  | `float` | `3.0`, `0.1` | 소수점이 있으면 값이 정수여도 float |
  | `str` | `'hi'`, `"3"` | 따옴표 안의 숫자는 문자열 |
  | `bool` | `True`, `False` | 첫 글자 대문자 |

  > ⚠️ 실수는 근사값(부동소수점)이라 `0.1 + 0.2 == 0.3`은 **False**. 비교할 때는 `abs(a - b) < 1e-9`나 `round(a, 2) == b`를 쓴다.

  ## 산술 연산자와 결과 자료형

  | 연산 | 의미 | `7`, `2`일 때 | `-7`, `2`일 때 |
  |---|---|---|---|
  | `/` | 나눗셈 (항상 float) | `3.5` | `-3.5` |
  | `//` | 몫 (아래로 내림) | `3` | **`-4`** |
  | `%` | 나머지 | `1` | **`1`** |
  | `**` | 거듭제곱 | `49` | `49` |
  | `divmod(a, b)` | `(몫, 나머지)` | `(3, 1)` | `(-4, 1)` |

  - `6 / 2`도 `3.0` (float). 정수가 필요하면 `//`
  - int와 float를 섞으면 결과는 float: `3 + 1.0` → `4.0`

  ## 연산자 우선순위 (높은 것부터)

  `**` → 부호 `-` → `*` `/` `//` `%` → `+` `-` → 비교(`<`, `==` …) → `not` → `and` → `or`

  > ⚠️ `-2 ** 2`는 `-(2 ** 2)` = **-4**. `2 ** 3 ** 2`는 오른쪽부터 계산해 `2 ** 9` = **512**. 헷갈리면 괄호를 친다.

  ## 형변환

  | 코드 | 결과 |
  |---|---|
  | `int('7')`, `int(' 7 ')` | `7` (앞뒤 공백은 괜찮음) |
  | `int(3.7)` | `3` — 반올림이 아니라 **버림** |
  | `int('3.7')` | **ValueError** → `int(float('3.7'))` |
  | `float('3')` | `3.0` |
  | `str(5) + '개'` | `'5개'` |
  | `'3' + 3` | **TypeError** (문자열과 숫자는 바로 못 더함) |
  | `'ab' * 3` | `'ababab'` |

  ## 변수와 입력

  - 변수 이름: 영문자·숫자·`_`만, **숫자로 시작 불가**, 예약어(`if`, `for`, `True` …) 불가, 대소문자 구분(`num` ≠ `NUM`)
  - `input()`은 무엇을 입력하든 **문자열(str)** 을 돌려준다 → 계산하려면 `int()`·`float()`로 바꾼다
  - 한 줄에 여러 개: `a, b = map(int, input().split())`

  ```python
  minutes = int(input())        # 135
  print(minutes // 60, '시간', minutes % 60, '분')   # 2 시간 15 분
  ```

  ## f-string

  | 코드 | 결과 (`x = 3.14159`, `n = 7`) |
  |---|---|
  | `f'{x:.2f}'` | `3.14` |
  | `f'{n}개'` | `7개` |
  | `f'{n * 2}'` | `14` (중괄호 안에 식도 가능) |
