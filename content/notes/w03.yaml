id: w03
short: 3주차
title: 조건문 · bool · 비교·논리 연산자
order: 3
summary: False가 되는 값, 비교 연쇄, not > and > or, elif는 첫 참 하나만, random 함수 4개
quiz: w03
units: [b03]
body: |
  ## bool과 '거짓'으로 취급되는 값

  `False`, `0`, `0.0`, `''`(빈 문자열), `[]`, `()`, `{}`, `set()`, `None` → 조건에서 **거짓**

  나머지는 모두 참. 특히 `'0'`, `' '`(공백 한 칸), `'False'`, `[0]`은 **참**이다.

  ## 비교 연산자

  `==` 같다 · `!=` 다르다 · `<` `>` `<=` `>=` → 결과는 `True` / `False`

  - 비교를 이어 쓸 수 있다: `10 < x < 20` = `10 < x and x < 20`
  - 문자열도 비교 가능 (사전 순서, 대소문자 구분): `'apple' < 'banana'` → True, `'Z' < 'a'` → True (대문자가 앞)

  > ⚠️ `=`는 대입, `==`는 비교. `if x = 10:`은 **SyntaxError**.

  ## 논리 연산자

  | 연산 | 참이 되는 경우 |
  |---|---|
  | `A and B` | 둘 다 참 |
  | `A or B` | 하나라도 참 |
  | `not A` | A가 거짓 |

  우선순위: **`not` → `and` → `or`**. 예: `True or False and False` → `True or False` → `True`

  > ⚠️ `if x == 1 or 2:`는 `(x == 1) or 2`라서 **항상 참**(2는 참). 올바른 코드는 `if x == 1 or x == 2:`

  ## if · elif · else

  ```python
  score = 85
  if score >= 90:
      grade = 'A'
  elif score >= 80:      # 위가 거짓일 때만 검사
      grade = 'B'
  else:                  # 조건식을 쓰지 않음
      grade = 'F'
  ```

  - 위에서부터 검사해 **처음 참인 블록 하나만** 실행하고 나머지는 건너뛴다 → 범위 조건은 큰 기준부터
  - `elif`는 여러 개 가능, `else`는 맨 끝에 하나만. 둘 다 앞에 `if`가 있어야 한다
  - 조건 뒤 콜론 `:` 필수, 블록은 들여쓰기

  | 구조 | 언제 쓰나 |
  |---|---|
  | `if-elif-else` 하나 | 여러 경우 중 **하나만** 고를 때 (학점, 요금 구간) |
  | 독립된 `if` 여러 개 | 해당하는 것을 **모두** 처리할 때 (이용 가능한 시설 모두 출력) |
  | 중첩 `if` | 바깥 조건이 참일 때만 안쪽을 따질 때. else가 없으면 `and`로 합칠 수 있음 |

  ## random 모듈 (`import random`)

  | 함수 | 결과 |
  |---|---|
  | `random.random()` | 0 이상 **1 미만** 실수 |
  | `random.randint(a, b)` | a 이상 **b 이하** 정수 (양 끝 포함) |
  | `random.choice(리스트)` | 리스트에서 무작위로 하나 |
  | `random.seed(n)` | 난수 순서 고정 → 매번 같은 결과 (채점 문제에서 요구) |

  > ⚠️ `range(a, b)`는 b를 포함하지 않지만 `randint(a, b)`는 b를 **포함**한다.
