# 채점·실행 설정 (관찰 근거: docs/PLAN.md 1.3~1.4)
grading:
  prompt_newline: true        # 채점 시 input 프롬프트 뒤 줄바꿈, 입력값은 출력 안 함 (elice와 동일)
  ignore_final_newlines: true # 출력 끝의 줄바꿈만 무시, 나머지는 공백까지 정확히 비교
  score: per_test             # 점수 = 100 × 통과 테스트 / 전체 테스트

limits:
  time_ms: 3000               # 브라우저 채점 시 테스트 하나의 시간 제한
  build_timeout_s: 5          # 빌드 때 정답 코드 실행 제한

run:
  limit_sec: 120              # Run(대화형) 최대 실행 시간 — elice의 Remaining 카운트다운과 비슷하게

site:
  title: Python 시험 연습장
  exam_date: "2026-10-20"
