    - .append
    - .append()
    difficulty: 1
    explanation: '`a.append(4)` → 맨 뒤에 4가 추가됩니다.'

  - id: w05-40
    type: short
    prompt: 리스트의 **지정한 위치**에 요소를 끼워 넣는 메서드 이름을 쓰시오.
    answer:
    - insert
    - insert()
    - .insert
    - .insert()
    difficulty: 1
    verify: |
      a = [1, 2]
      a.insert(0, 'x')
      assert a == ['x', 1, 2]
    explanation: '`a.insert(0, ''x'')`는 맨 앞에 넣습니다.'

  - id: w05-41
