id: w05
short: 5주차
title: 리스트와 튜플
order: 5
summary: 리스트·튜플의 특징, 인덱싱, 리스트 메서드, in, 할당과 복사, 슬라이싱, 리스트 표현식·map, 2차원 리스트
items:
  - id: w05-01
    type: ox
    prompt: 리스트는 순서가 있고, 만든 뒤에도 요소를 수정·추가·삭제할 수 있는(mutable) 자료형이다.
    answer: "O"
    explanation: 리스트는 순서가 있어 인덱스로 접근할 수 있고, 변경 가능합니다. 여러 자료형을 섞어 저장할 수도 있습니다.

