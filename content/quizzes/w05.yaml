    prompt: 리스트에서 특정 값이 **몇 번** 나오는지 세는 메서드 이름을 쓰시오.
    answer:
    - count
    - count()
    - .count
    - .count()
    difficulty: 1
    verify: |
      assert [1, 2, 1].count(1) == 2
    explanation: '`[1, 2, 1].count(1)`은 2.'

  - id: w05-42
    type: short
    prompt: '`a.append([4, 5])`와 달리 `[4, 5]`의 **요소들을 하나씩** 리스트 끝에 이어 붙이는 메서드 이름을 쓰시오.'
