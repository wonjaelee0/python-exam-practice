id: w05
short: 5주차
title: 리스트와 튜플
order: 5
summary: 리스트·튜플의 특징, 인덱싱, 리스트 메서드, in, 할당과 복사, 슬라이싱, 리스트 표현식·map, 2차원 리스트
items:
  - id: w05-01
    type: ox
    prompt: 리스트는 순서가 있고, 만든 뒤에도 요소를 수정·추가·삭제할 수 있는(mutable) 자료형이다.
    answer: "O"
    explanation: 리스트는 순서가 있어 인덱스로 접근할 수 있고, 변경 가능합니다. 여러 자료형을 섞어 저장할 수도 있습니다.

  - id: w05-02
    type: ox
    prompt: 튜플은 만든 뒤에도 `t[0] = 10`처럼 요소를 바꿀 수 있다.
    answer: "X"
    explanation: 튜플은 '읽기 전용 리스트'로, 요소를 변경·추가·삭제할 수 없습니다.

  - id: w05-03
    type: predict
    error: true
    code: |
      t = (1, 2, 3)
      t[0] = 10
    explanation: 튜플 요소를 바꾸려 하면 `TypeError`가 납니다. 실수로 값이 바뀌는 것을 막아 줍니다.

  - id: w05-04
    type: predict
    difficulty: 2
    code: |
      print(type((1)))
      print(type((1,)))
    explanation: 요소가 한 개인 튜플은 `(값,)`처럼 **쉼표**를 붙여야 합니다. `(1)`은 그냥 정수 1입니다.

  - id: w05-05
    type: predict
    code: |
      print(list(range(0, 10, 3)))
      print(tuple(range(2, 11, 2)))
    explanation: "`list()`·`tuple()`로 range 객체를 리스트·튜플로 바꿀 수 있습니다."

  - id: w05-06
    type: predict
    code: |
      a = [38, 21, 53, 62, 19]
      print(a[0], a[-1], a[2])
    explanation: 인덱스는 0부터 시작하고, `-1`은 마지막 요소입니다.

  - id: w05-07
    type: predict
    error: true
    code: |
      a = [1, 2, 3]
      print(a[3])
    explanation: 요소가 3개면 인덱스는 0~2입니다. 범위를 벗어나면 `IndexError`.

  - id: w05-08
    type: predict
    difficulty: 2
    code: |
      a = [10, 20]
      b = [10, 20]
      a.append([30, 40])
      b.extend([30, 40])
      print(a)
      print(b)
      print(len(a), len(b))
    explanation: "`append`는 리스트 **자체를 요소 하나로** 추가하고, `extend`는 요소들을 **하나씩 풀어서** 추가합니다."

  - id: w05-09
    type: predict
    code: |
