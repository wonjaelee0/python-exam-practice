      print(stu[1][0], stu[2][1])
      print(len(stu))
    explanation: "2차원 리스트는 `리스트[행][열]`로 접근합니다. `len()`은 행(안쪽 리스트)의 개수입니다."

  - id: w05-27
    type: predict
    difficulty: 3
    code: |
      a = [[10, 20], [30, 40]]
      b = a.copy()
      b[0][0] = 500
      print(a)
    explanation: "`copy()`는 바깥 리스트만 복사하고 안쪽 리스트는 공유합니다(얕은 복사). 2차원 리스트를 완전히 복사하려면 `copy.deepcopy()`."

  - id: w05-28
    type: mc
    prompt: 2차원 리스트 `a`를 **완전히 독립적으로** 복사하는 방법은?
    choices: ["`b = a`", "`b = a.copy()`", "`b = a[:]`", "`import copy` 후 `b = copy.deepcopy(a)`"]
    answer: 4
    difficulty: 2
    verify: |
      import copy
      a = [[1, 2], [3, 4]]
      b = copy.deepcopy(a)
      b[0][0] = 99
      assert a[0][0] == 1
      c = a.copy()
      c[0][0] = 77
      assert a[0][0] == 77
    explanation: "`copy()`와 `[:]`는 얕은 복사라 안쪽 리스트를 공유합니다. 깊은 복사는 `copy.deepcopy()`."

