    type: predict
    error: true
    code: |
      a = [10, 20, 30]
      a.remove(40)
    explanation: 없는 값을 `remove`하면 `ValueError`. 먼저 `if 40 in a:`로 확인하세요.

  - id: w05-13
    type: predict
    code: |
      a = [10, 20, 30, 15, 20, 40]
      print(a.index(20), a.count(20))
    explanation: "`index(x)`는 x가 **처음** 나오는 인덱스, `count(x)`는 x의 개수입니다."

  - id: w05-14
    type: predict
    difficulty: 2
    code: |
      a = [3, 1, 2]
      b = sorted(a)
      print(a, b)
      a.sort(reverse=True)
      print(a)
    explanation: "`sorted(a)`는 정렬된 **새 리스트**를 돌려주고 a는 그대로입니다. `a.sort()`는 a 자체를 정렬합니다. `reverse=True`면 내림차순."

  - id: w05-15
    type: predict
    difficulty: 3
    code: |
      a = [3, 1, 2]
      print(a.sort())
      print(a)
    explanation: "`sort()`는 리스트를 직접 바꾸고 `None`을 돌려줍니다. 그래서 `print(a.sort())`는 None을 출력합니다."

  - id: w05-16
    type: ox
    prompt: "`sorted(a)`를 실행하면 원래 리스트 a가 정렬된 상태로 바뀐다."
    answer: "X"
    verify: |
      a = [3, 1, 2]
      b = sorted(a)
      assert a == [3, 1, 2] and b == [1, 2, 3]
    explanation: "`sorted()`는 원본을 그대로 두고 정렬된 새 리스트를 반환합니다. 원본을 바꾸는 것은 `a.sort()`."

