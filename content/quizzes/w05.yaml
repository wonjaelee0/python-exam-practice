  - id: w05-35
    type: mc
    prompt: 다음 중 **빈 리스트**를 만드는 코드가 **아닌** 것은?
    choices: ["`a = []`", "`a = list()`", "`a = ()`", "`a = list(range(0))`"]
    answer: 3
    verify: |
      assert [] == list() == list(range(0))
      assert isinstance((), tuple)
    explanation: "`()`는 빈 **튜플**입니다."

  - id: w05-36
    type: mc
    prompt: 다음 리스트 메서드 중 **값을 돌려주는(반환하는)** 것은?
    choices: ["`append(x)`", "`sort()`", "`pop()`", "`reverse()`"]
    answer: 3
    difficulty: 2
    verify: |
      a = [1, 2, 3]
      assert a.append(4) is None and a.sort() is None and a.reverse() is None
      assert a.pop() == 1
    explanation: "`pop()`은 삭제한 요소를 돌려줍니다. `append`, `sort`, `reverse`는 리스트를 직접 바꾸고 `None`을 돌려줍니다."

  - id: w05-37
    type: essay
    prompt: 리스트와 튜플의 공통점과 차이점을 서술하시오.
    answer: |
      둘 다 여러 값을 순서대로 저장하는 시퀀스 자료형이라 인덱싱·슬라이싱·in·len·for 반복을 쓸 수 있다.
      리스트는 `[ ]`로 만들고 요소를 수정·추가·삭제할 수 있는(mutable) 반면, 튜플은 `( )`로 만들며 만든 뒤 변경할 수 없다(immutable).
      그래서 튜플은 바뀌면 안 되는 값을 실수로 바꾸는 것을 막을 때 쓰고, 요소가 하나인 튜플은 `(값,)`처럼 쉼표를 붙인다.
    points:
      - "공통점: 순서가 있는 시퀀스 (인덱싱, 슬라이싱, 반복)"
      - "리스트: [ ], 변경 가능 (append, remove 등)"
      - "튜플: ( ), 변경 불가 (요소 수정 시 TypeError)"
      - 요소 1개 튜플은 (값,)

  - id: w05-38
    type: essay
    prompt: "`b = a`와 `b = a.copy()`의 차이를, `b[0] = 99`를 실행했을 때 a가 어떻게 되는지와 함께 설명하시오."
    answer: |
      `b = a`는 리스트를 복사하지 않고 같은 리스트를 가리키는 이름만 하나 더 만든다(`a is b`가 True). 그래서 `b[0] = 99`를 하면 a도 함께 바뀐다.
      `b = a.copy()`는 요소를 복사한 새 리스트를 만들어 a와 b가 서로 다른 리스트가 되므로, b를 바꿔도 a는 그대로다.
      단, 2차원 리스트는 copy()로도 안쪽 리스트가 공유되므로 copy.deepcopy()를 써야 한다.
    points:
      - "b = a: 같은 리스트 (a is b → True), b를 바꾸면 a도 바뀜"
      - "b = a.copy(): 새 리스트, a는 그대로"
      - 2차원 리스트는 deepcopy 필요
