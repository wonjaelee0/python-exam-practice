  - id: w04-46
    type: essay
    prompt: while 문에서 무한 루프가 생기는 경우와, 무한 루프를 끝내는 방법을 설명하시오.
    answer: |
      조건식이 계속 참으로 남으면 무한 루프가 된다. 반복 안에서 조건에 쓰인 변수를 바꾸지 않거나, `while True:`처럼 항상 참인 조건을 쓴 경우다.
      끝내려면 반복 안에서 변수를 바꿔(`i += 1`) 조건이 언젠가 거짓이 되게 하거나, 원하는 상황에서 `break`로 반복을 빠져나간다.
    points:
    - 조건이 계속 참이면 무한 루프
    - 조건 변수를 갱신하지 않는 실수 / while True
    - 변수 갱신 또는 break로 종료
    difficulty: 1
