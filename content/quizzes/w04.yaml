  - id: w04-32
    type: essay
    prompt: "`break`와 `continue`의 차이를 설명하시오."
    answer: |
      `break`는 반복문을 완전히 중단하고 반복문 다음 코드로 빠져나간다.
      `continue`는 반복문은 유지한 채 이번 반복의 남은 코드만 건너뛰고 다음 반복으로 넘어간다.
    points:
      - break는 반복문 전체를 끝낸다
      - continue는 이번 반복의 나머지만 건너뛴다
      - for와 while에서 똑같이 동작한다

  - id: w04-33
    type: essay
    prompt: for 반복문과 while 반복문은 각각 어떤 경우에 주로 사용하는지 예를 들어 설명하시오.
    answer: |
      for는 반복 횟수가 정해져 있거나 시퀀스의 요소를 차례로 처리할 때 쓴다 (예 — 1부터 100까지의 합, 리스트의 모든 요소 출력).
      while은 반복 횟수가 정해지지 않고 조건이 참인 동안 반복할 때 쓴다 (예 — 3이 나올 때까지 주사위 던지기, '종료'가 입력될 때까지 입력받기).
    points:
      - "for: 횟수가 정해진 반복, range·시퀀스"
      - "while: 조건이 참인 동안, 횟수를 모를 때"
      - while은 변화식이 없으면 무한 루프에 주의

