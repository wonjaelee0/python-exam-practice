id: w02
short: 2주차
title: 기본 문법 · 자료형 · 연산 · 변수와 입력
order: 2
summary: 주석·들여쓰기·print, 자료형과 type(), 부동소수점, f-string, 산술 연산자, 형변환, 변수 규칙, input()과 map()
items:
  - id: w02-01
    type: mc
    prompt: 파이썬에서 한 줄 주석을 시작하는 기호는?
    choices: ["`//`", "`#`", "`/*`", "`--`"]
    answer: 2
    explanation: "`#` 뒤의 내용은 주석으로, 인터프리터가 실행하지 않습니다. 코드 뒤에 `# 설명`처럼 붙일 수도 있습니다."

  - id: w02-02
    type: ox
    prompt: 주석은 인터프리터가 처리하지 않으므로 프로그램의 실행 결과에 영향을 주지 않는다.
    answer: "O"
    explanation: 주석은 코드 설명이나 특정 코드를 잠시 실행하지 않게 할 때 씁니다. 여러 줄은 블록을 지정한 뒤 `Ctrl + /`로 한 번에 주석 처리할 수 있습니다.

  - id: w02-03
    type: ox
    prompt: 파이썬에서 들여쓰기는 코드를 보기 좋게 하기 위한 것일 뿐, 문법은 아니다.
    answer: "X"
    explanation: 파이썬은 **들여쓰기로 코드 블록을 구분**하므로 들여쓰기 자체가 문법입니다. `if` 다음 줄을 들여쓰지 않으면 오류가 납니다.

  - id: w02-04
    type: mc
    prompt: |
      다음 코드를 실행하면 어떻게 되는가?
      ```python
      a = 5
      if a == 10:
          print('a 값은')
        print('10 입니다.')
      ```
    choices: ["`a 값은`만 출력된다", "`10 입니다.`만 출력된다", "아무것도 출력되지 않는다", "들여쓰기가 맞지 않아 오류가 나고 실행되지 않는다"]
    answer: 4
    difficulty: 2
    verify: |
      ok = False
      try:
          compile("a = 5\nif a == 10:\n    print('a')\n  print('b')\n", "t", "exec")
      except IndentationError:
          ok = True
      assert ok
    explanation: 같은 블록의 줄은 들여쓰기 칸 수가 같아야 합니다. 들여쓰기가 어긋나면 `IndentationError`가 나서 프로그램 전체가 실행되지 않습니다.

  - id: w02-05
    type: short
    prompt: 파이썬 코딩 스타일 가이드(PEP 8)에서 권장하는 들여쓰기는 공백 몇 칸인가? (숫자만)
    answer: ["4", "4칸"]
    explanation: 공백 1칸, 2칸, 탭도 가능하지만 PEP 8은 **공백 4칸**을 권장합니다.

  - id: w02-06
    type: predict
    code: |
      name = "Alice"
      age = 20
      print("Name:", name, "Age:", age)
    explanation: "`print()`에 쉼표로 여러 값을 넘기면 값 사이에 **공백이 자동으로 한 칸씩** 들어갑니다."

  - id: w02-07
    type: predict
    code: |
      print(type(10))
      print(type(3.14))
      print(type("Python"))
      print(type(True))
    explanation: "`type()`은 자료형을 알려 줍니다. 정수 `int`, 실수 `float`, 문자열 `str`, 불리언 `bool`."

  - id: w02-08
    type: predict
    difficulty: 2
    code: |
      print(0.1 + 0.2)
      print(0.1 + 0.2 == 0.3)
    explanation: |
      `0.1`은 이진수로 정확히 나타낼 수 없는 무한소수라서 컴퓨터는 근삿값으로 저장합니다(부동소수점).
      그래서 `0.1 + 0.2`는 `0.30000000000000004`가 되고, `0.3`과 같지 않다고 판단합니다.

  - id: w02-09
    type: mc
    prompt: 실수를 컴퓨터에서 근사하여 표현할 때, 소수점의 위치를 고정하지 않고 가수와 지수로 나누어 저장하는 방식은?
    choices: ["고정소수점 방식", "부동소수점 방식", "2의 보수 방식", "아스키 코드 방식"]
    answer: 2
    explanation: 부동소수점(floating point) 방식입니다. 64비트 중 부호 1비트, 지수 11비트, 가수 52비트로 이루어집니다.

  - id: w02-10
    type: mc
    prompt: "`x = 0.1 + 0.2`, `y = 0.3`일 때 두 값이 '사실상 같은지' 판단하는 방법으로 가장 알맞은 것은?"
    choices: ["`x == y`", "`math.fabs(x - y) < 1e-9`", "`x is y`", "`int(x) == int(y)`"]
    answer: 2
    difficulty: 2
    verify: |
      import math
      x = 0.1 + 0.2
      y = 0.3
      assert not (x == y)
      assert math.fabs(x - y) < 1e-9
    explanation: 실수 연산에는 작은 오차가 있으므로 두 값의 **차이의 절댓값이 아주 작은지**로 비교합니다. `int()`로 자르면 0.3과 0.9도 같다고 나와 버립니다.

  - id: w02-11
    type: predict
    code: |
      name = "Mina"
      age = 21
      print(f"{name}은(는) 내년에 {age + 1}살입니다.")
    explanation: f-string의 `{ }` 안에는 변수뿐 아니라 `age + 1` 같은 **식**도 쓸 수 있습니다.

  - id: w02-12
    type: predict
    code: |
      print(7 / 2, 7 // 2, 7 % 2, 7 ** 2)
    explanation: "`/` 나눗셈(항상 실수), `//` 몫(버림 나눗셈), `%` 나머지, `**` 거듭제곱."

  - id: w02-13
    type: predict
    code: |
      print(4 / 2)
      print(4 // 2)
    explanation: "`/`의 결과는 나누어떨어져도 항상 실수(`2.0`)입니다. `//`는 정수끼리면 정수(`2`)입니다."

  - id: w02-14
    type: predict
    difficulty: 2
    code: |
      print(5.5 // 2)
      print(4.5 // 2.1)
    explanation: 버림 나눗셈 `//`에 실수가 섞이면 결과도 **실수**(`2.0`)입니다. 눈에 잘 띄지 않는 버그가 될 수 있으니 기억해 두세요.

  - id: w02-15
    type: predict
    code: |
      print('10' + '20')
      print('ab' * 3)
    explanation: 문자열의 `+`는 이어 붙이기, `*`는 반복입니다. `'10' + '20'`은 `30`이 아니라 `1020`입니다.

  - id: w02-16
    type: predict
    error: true
    code: |
      print('10' + 20)
    explanation: 문자열과 정수는 `+`로 더할 수 없어 `TypeError`가 납니다. `int('10') + 20` 또는 `'10' + str(20)`처럼 형을 맞춰야 합니다.

  - id: w02-17
    type: predict
    code: |
      print(int(4.9))
      print(float(5))
      print(str(5) + '0')
    explanation: "`int()`는 소수점 아래를 **버립니다**(반올림 아님). `float(5)`는 `5.0`, `str(5) + '0'`은 문자열 `50`입니다."

  - id: w02-18
    type: predict
    error: true
    difficulty: 2
    code: |
      print(int('4.5'))
    explanation: 소수점이 있는 **문자열**은 `int()`로 바로 바꿀 수 없어 `ValueError`가 납니다. `int(float('4.5'))`처럼 두 단계로 바꿉니다.

  - id: w02-19
    type: predict
    code: |
      print(divmod(100, 3))
      print(100 // 3, 100 % 3)
    explanation: "`divmod(a, b)`는 몫과 나머지를 튜플 `(몫, 나머지)`로 한 번에 돌려줍니다."

  - id: w02-20
    type: predict
    code: |
      print(35 + 1 * 20)
      print((35 + 1) * 20)
    explanation: 곱셈이 덧셈보다 먼저 계산됩니다. 덧셈을 먼저 하려면 소괄호 `( )`로 묶습니다.

  - id: w02-21
    type: predict
    difficulty: 3
    code: |
      print(2 ** 3 ** 2)
      print((2 ** 3) ** 2)
    explanation: "`**`는 **오른쪽부터** 계산합니다. `2 ** 3 ** 2`는 `2 ** 9 = 512`입니다. 헷갈리면 괄호로 순서를 분명히 하세요."

  - id: w02-22
    type: mc
    prompt: 다음 중 변수 이름으로 **사용할 수 없는** 것은?
    choices: ["`_num`", "`sumNum`", "`12month`", "`sum_num`"]
    answer: 3
    verify: |
      for good in ["_num = 1", "sumNum = 1", "sum_num = 1"]:
          compile(good, "t", "exec")
      ok = False
      try:
          compile("12month = 1", "t", "exec")
      except SyntaxError:
          ok = True
      assert ok
    explanation: 변수 이름은 영문자나 `_`로 시작해야 하며 **숫자로 시작할 수 없습니다**. `@`, 공백, 키워드(`if`, `for` 등)도 쓸 수 없습니다.

  - id: w02-23
    type: mc
    prompt: 다음 중 변수 이름으로 **사용할 수 있는** 것은?
    choices: ["`for`", "`my-name`", "`@mail`", "`NUM`"]
    answer: 4
    verify: |
      compile("NUM = 1", "t", "exec")
      for bad in ["for = 1", "my-name = 1", "@mail = 1"]:
          ok = False
          try:
              compile(bad, "t", "exec")
          except SyntaxError:
              ok = True
          assert ok, bad
    explanation: "`for`는 키워드, `-`와 `@`는 쓸 수 없는 문자입니다. 대문자만으로 된 `NUM`은 사용할 수 있습니다."

  - id: w02-24
    type: ox
    prompt: 파이썬 변수 이름은 대소문자를 구분하므로 `num`과 `NUM`은 서로 다른 변수이다.
    answer: "O"
    verify: |
      num = 1
      NUM = 2
      assert num != NUM
    explanation: 대소문자를 구분하므로 `num`, `Num`, `NUM`은 모두 다른 변수입니다.

  - id: w02-25
    type: predict
    code: |
      a, b, c = 1, 2, 3
      x = y = z = 0
      print(a + b + c, x, y, z)
    explanation: "`변수1, 변수2 = 값1, 값2`로 여러 변수를 한 번에 만들고, `x = y = z = 0`으로 같은 값을 한 번에 넣을 수 있습니다."

  - id: w02-26
    type: predict
    code: |
      a = 10
      a *= 20
      a -= 50
      a //= 3
      print(a)
    explanation: "복합 할당 연산자: `a *= 20`은 `a = a * 20`. 10 → 200 → 150 → 50."

  - id: w02-27
    type: predict
    error: true
    code: |
      d += 10
      print(d)
    explanation: "`d += 10`은 `d = d + 10`이므로 `d`에 먼저 값이 있어야 합니다. 만든 적 없는 변수를 쓰면 `NameError`."

  - id: w02-28
    type: ox
    prompt: "`input()` 함수는 사용자가 숫자를 입력하면 정수(int)로 돌려준다."
    answer: "X"
    explanation: "`input()`은 무엇을 입력하든 **문자열(str)**로 돌려줍니다. 계산에 쓰려면 `int()`나 `float()`로 바꿔야 합니다."

  - id: w02-29
    type: mc
    prompt: "`x = input()` 실행 후 사용자가 `25`를 입력했을 때 `print(type(x))`의 결과는?"
    choices: ["`<class 'int'>`", "`<class 'str'>`", "`<class 'float'>`", "오류가 난다"]
    answer: 2
    explanation: "`input()`의 결과는 항상 문자열입니다."

  - id: w02-30
    type: blank
    prompt: "정수 두 개를 입력받아 합을 출력하도록 빈칸을 채우시오. (입력 예: 10, 20)"
    code: |
      n1 = _____(input())
      n2 = _____(input())
      print(n1 + n2)
    blanks: [["int"], ["int"]]
    stdin: "10\n20\n"
    explanation: "`int()`로 바꾸지 않으면 문자열끼리 이어 붙여 `1020`이 출력됩니다."

  - id: w02-31
    type: blank
    prompt: "한 줄에 공백으로 구분된 정수 두 개를 입력받아 곱을 출력하도록 빈칸을 채우시오. (입력 예: `6 7`)"
    code: |
      a, b = _____(int, input().split())
      print(a * b)
    blanks: [["map"]]
    stdin: "6 7\n"
    difficulty: 2
    explanation: "`input().split()`은 `['6', '7']`처럼 문자열 리스트를 만들고, `map(int, ...)`이 각각을 정수로 바꿉니다."

  - id: w02-32
    type: predict
    difficulty: 2
    code: |
      c, d = "10 20".split()
      print(c + d)
      print(type(c))
    explanation: "`split()`은 문자열을 나눈 **문자열** 리스트를 돌려줍니다. 그래서 `c + d`는 `1020`입니다."

  - id: w02-33
    type: predict
    difficulty: 2
    code: |
      print(0o37, 0x7A, 4.24e2)
    explanation: "`0o`는 8진수(3×8+7=31), `0x`는 16진수(7×16+10=122), `e2`는 ×10²인 지수 표현이며 결과는 실수입니다."

  - id: w02-34
    type: mc
    prompt: 다음 중 자료형이 **다른** 하나는?
    choices: ["`3.0`", "`1e3`", "`10`", "`0.5`"]
    answer: 3
    verify: |
      assert type(3.0) is float and type(1e3) is float and type(0.5) is float
      assert type(10) is int
    explanation: "`10`만 정수(int)이고 나머지는 실수(float)입니다. `1e3`은 `1000.0`입니다."

  - id: w02-35
    type: mc
    prompt: 문자열을 만드는 방법으로 **틀린** 것은?
    choices: ["`\"Hello\"`", "`'Hello'`", "`'''Hello'''`", "`<Hello>`"]
    answer: 4
    verify: |
      assert "Hello" == 'Hello' == '''Hello''' == """Hello"""
    explanation: 문자열은 큰따옴표, 작은따옴표, 따옴표 세 개(`'''`, `"""`)로 감싸 만듭니다.

  - id: w02-36
    type: essay
    prompt: "`input()`으로 받은 값으로 계산할 때 주의할 점과 해결 방법을 서술하시오."
    answer: |
      `input()`은 입력값을 항상 문자열로 돌려주므로 그대로 `+` 하면 숫자 덧셈이 아니라 문자열 이어 붙이기가 된다.
      계산하려면 `int(input())`, `float(input())`처럼 형변환을 해야 하고,
      한 줄에 여러 값을 받을 때는 `map(int, input().split())`을 쓴다.
    points:
      - input()은 문자열(str)을 돌려준다
      - "int() / float()로 형변환이 필요하다"
      - "문자열끼리 + 하면 이어 붙여진다 (예: '10' + '20' → '1020')"
      - 여러 값은 split()과 map()으로 받는다

  - id: w02-37
    type: essay
    prompt: "`0.1 + 0.2 == 0.3`의 결과가 `False`인 이유와, 실수를 비교할 때의 올바른 방법을 서술하시오."
    answer: |
      실수는 부동소수점 방식으로 저장되는데, 0.1 같은 십진 소수는 이진수로 정확히 나타낼 수 없는 무한소수라서 근삿값으로 저장된다.
      그래서 연산 결과에 아주 작은 오차가 생겨 `0.30000000000000004`가 된다.
      실수는 `==` 대신 두 수의 차이의 절댓값이 충분히 작은지(`math.fabs(x - y) < 1e-9`)로 비교한다.
    points:
      - 부동소수점 근사 (이진수 무한소수)
      - 연산 시 작은 오차 발생
      - 차이의 절댓값이 아주 작은지로 비교

  # ---- 보강 문항 (2026-10-16): 단답형·O/X·코드 빈칸·객관식 위주 ----

  - id: w02-38
    type: short
    prompt: '나눗셈의 **몫**(소수점 아래를 버린 값, 예: 7을 2로 나눈 몫 3)을 구하는 연산자 기호를 쓰시오.'
    answer:
    - //
    difficulty: 1
    verify: |
      assert 7 // 2 == 3
    explanation: '`7 // 2`는 3, `7 / 2`는 3.5입니다.'

  - id: w02-39
    type: short
    prompt: '거듭제곱(예: 2의 10제곱)을 계산하는 연산자 기호를 쓰시오.'
    answer:
    - '**'
    difficulty: 1
    verify: |
      assert 2 ** 10 == 1024
    explanation: '`2 ** 10`은 1024입니다. `^`는 거듭제곱이 아닙니다.'

  - id: w02-40
    type: short
    prompt: 몫과 나머지를 한 번에 튜플로 돌려주는 내장 함수 이름을 쓰시오.
    answer:
    - divmod
    - divmod()
    difficulty: 1
    verify: |
      assert divmod(17, 5) == (3, 2)
    explanation: '`divmod(17, 5)`는 `(3, 2)`입니다.'

  - id: w02-41
    type: short
    prompt: '`print()`에서 출력 끝에 붙는 문자(기본값은 줄바꿈)를 바꾸는 매개변수 이름을 쓰시오.'
    answer:
    - end
    - end=
    difficulty: 1
    verify: |
      print('a', end='')
      print('b')
    explanation: '`print(''a'', end='''')`처럼 쓰면 줄을 바꾸지 않습니다.'

  - id: w02-42
    type: short
    prompt: '`print(1, 2, 3, sep=''-'')`에서처럼 여러 값 **사이**에 넣을 문자열을 정하는 매개변수 이름을 쓰시오.'
    answer:
    - sep
    - sep=
    difficulty: 1
    verify: |
      print(1, 2, 3, sep='-')
    explanation: '`print(1, 2, 3, sep=''-'')`는 `1-2-3`을 출력합니다. 기본값은 공백 한 칸입니다.'

  - id: w02-43
    type: ox
    prompt: '`type(3.0)`의 결과는 `<class ''int''>`이다.'
    answer: X
    difficulty: 1
    verify: |
      assert type(3.0) is float
    explanation: 소수점이 있으면 값이 정수와 같아도 float입니다. `<class 'float'>`.

  - id: w02-44
    type: ox
