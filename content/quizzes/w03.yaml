id: w03
short: 3주차
title: 조건문 · bool · 비교·논리 연산자
order: 3
summary: False로 평가되는 값, 비교·논리 연산자와 우선순위, if-else, if-elif-else, 중첩 if, random 모듈
items:
  - id: w03-01
    type: mc
    prompt: 다음 중 `bool()`로 바꾸었을 때 **True**가 되는 것은?
    choices: ["`0`", "`''` (빈 문자열)", "`'False'`", "`[]` (빈 리스트)", "`None`"]
    answer: 3
    difficulty: 2
    verify: |
      assert bool('False') is True
      assert not bool(0) and not bool('') and not bool([]) and not bool(None)
    explanation: False로 평가되는 값은 `False, 0, 0.0, ''(빈 문자열), [], {}(빈 자료구조), None`입니다. `'False'`는 글자가 있는 문자열이라 True입니다.

  - id: w03-02
    type: predict
    difficulty: 2
    code: |
      print(bool(0), bool(0.0), bool('0'), bool(' '))
    explanation: 숫자 0과 0.0은 False지만, 문자열 `'0'`과 공백 한 칸 `' '`은 **빈 문자열이 아니므로** True입니다.

  - id: w03-03
    type: predict
    code: |
      print(5 == 10, 5 != 10, 10 >= 5, 3 < 3)
    explanation: 비교 연산의 결과는 bool(True/False)입니다. `3 < 3`은 '미만'이라 False.

  - id: w03-04
    type: predict
    code: |
      print('python' == 'Python')
      print('apple' > 'banana')
    explanation: 문자열 비교는 대소문자를 구분하고, 크기는 사전 순서로 비교합니다. `'apple'`은 `'banana'`보다 앞이므로 `>`는 False.

  - id: w03-05
    type: ox
    prompt: 문자열끼리도 `<`, `>`로 크기를 비교할 수 있다.
    answer: "O"
    verify: |
      assert 'apple' < 'banana'
      assert 'b' > 'a'
    explanation: 문자열은 사전 순서(문자 코드 순서)로 비교됩니다.

  - id: w03-06
    type: predict
    code: |
      a = 5
      b = 10
      c = -5
      print(a > 0 and b > 0)
      print(a > 0 or c > 0)
      print(not (a > 0))
    explanation: "`and`는 둘 다 참일 때, `or`는 하나라도 참일 때 True, `not`은 참/거짓을 뒤집습니다."

  - id: w03-07
    type: mc
    prompt: 논리 연산자의 우선순위를 **높은 것부터** 바르게 나열한 것은?
    choices: ["and > or > not", "not > and > or", "or > and > not", "not > or > and"]
    answer: 2
    verify: |
      assert (not True or False and not False) == ((not True) or (False and (not False)))
      assert (True or False and False) is True
    explanation: "`not` → `and` → `or` 순서로 계산합니다. 헷갈릴 때는 소괄호로 순서를 분명히 합니다."

  - id: w03-08
    type: predict
    difficulty: 2
    code: |
      print(not True or False and not False)
    explanation: "`not`부터: `False or False and True` → `and`: `False or False` → `False`."

  - id: w03-09
    type: predict
    difficulty: 2
    code: |
      print(True or False and False)
      print((True or False) and False)
    explanation: "`and`가 `or`보다 먼저 계산되어 첫 줄은 `True or (False and False)` = True. 괄호를 치면 순서가 바뀌어 False."

  - id: w03-10
    type: blank
    prompt: "놀이기구 조건: 키는 110cm 이상이고 몸무게는 120kg 미만이어야 탈 수 있다. 빈칸을 채우시오."
    code: |
      height = 115
      weight = 130
      print(height >= 110 _____ weight < 120)
    blanks: [["and"]]
    explanation: 두 조건을 **모두** 만족해야 하므로 `and`. 몸무게 조건이 거짓이라 결과는 False입니다.

  - id: w03-11
    type: blank
    prompt: "키가 130cm 이상 195cm 이하인지 확인하는 조건식을 완성하시오."
    code: |
      height = 200
      print(height >= 130 _____ height <= 195)
    blanks: [["and"]]
    explanation: "범위 조건은 `and`로 묶습니다. 파이썬은 `130 <= height <= 195`처럼 이어서 쓸 수도 있습니다."

  - id: w03-12
    type: mc
    prompt: "`if` 문에서 조건식 뒤에 반드시 붙여야 하는 기호는?"
    choices: ["`;`", "`:`", "`{`", "`->`"]
    answer: 2
    explanation: "`if 조건식:`처럼 콜론을 붙이고, 다음 줄부터 들여쓰기로 실행할 블록을 씁니다. `elif`, `else`, `for`, `while`, `def`도 같습니다."

  - id: w03-13
    type: predict
    code: |
      x = 5
      if x == 10:
          print('x에 들어있는 숫자는', end=' ')
          print('10입니다.')
      print('끝')
    explanation: 조건이 거짓이면 들여쓰기된 블록 전체를 건너뜁니다. 들여쓰기가 없는 `print('끝')`만 실행됩니다.

  - id: w03-14
    type: predict
    code: |
      x = 10
      if x == 10:
          print('x에 들어있는 숫자는', end=' ')
          print('10입니다.')
    explanation: "`end=' '`로 줄바꿈 대신 공백을 출력했으므로 두 print의 내용이 한 줄에 이어집니다."

  - id: w03-15
    type: predict
    difficulty: 2
    code: |
      score = 95
      if score >= 70:
          grade = 'C'
      elif score >= 80:
          grade = 'B'
      elif score >= 90:
          grade = 'A'
      else:
          grade = 'F'
      print(grade)
    explanation: if-elif-else는 **위에서부터 처음 참인 조건 하나만** 실행합니다. 95는 첫 조건 `score >= 70`에서 이미 참이라 C가 됩니다. 범위가 겹치면 큰 기준부터 검사해야 합니다.

  - id: w03-16
    type: predict
    code: |
      score = 85
      if score >= 90:
          grade = 'A'
      elif score >= 80:
          grade = 'B'
      elif score >= 70:
          grade = 'C'
      else:
          grade = 'F'
      print(f"당신의 학점은 {grade}입니다.")
    explanation: elif를 쓰면 앞 조건이 거짓일 때만 다음 조건을 보므로 `score >= 80`만 써도 '80 이상 90 미만'이 됩니다.

  - id: w03-17
    type: ox
    prompt: if-elif-else 문에서 참인 조건이 여러 개여도, 가장 먼저 참이 된 조건의 블록 **하나만** 실행된다.
    answer: "O"
    explanation: 한 조건이 참이면 나머지 elif와 else는 검사하지 않습니다.

  - id: w03-18
    type: ox
    prompt: "`else`는 하나의 if 문 안에서 여러 번 사용할 수 있다."
    answer: "X"
    explanation: "`if`와 `else`는 한 번씩만 쓸 수 있고, `elif`만 여러 번 쓸 수 있습니다."

  - id: w03-19
    type: predict
    code: |
      num = -3
      if num > 0:
          print('양수')
      else:
          if num == 0:
              print('0')
          else:
              print('음수')
    explanation: 중첩 if문은 바깥 조건의 결과에 따라 안쪽 조건을 다시 검사합니다.

  - id: w03-20
    type: predict
    difficulty: 2
    code: |
      height = 160
      age = 16
      print("이용 가능한 시설:")
      if height >= 120:
          print("워터슬라이드")
      if height >= 150 and age >= 15:
          print("성인풀")
          if age >= 18:
              print("다이빙풀")
    explanation: 서로 독립된 if 문은 각각 검사됩니다. 성인풀 조건은 만족하지만 18세 미만이라 다이빙풀은 출력되지 않습니다.

  - id: w03-21
    type: mc
    prompt: 키와 나이에 따라 **이용 가능한 시설을 모두** 출력해야 할 때, if-elif-else 하나보다 독립된 if(또는 중첩 if)가 알맞은 이유는?
    choices: ["if-elif-else는 조건 중 **하나만** 실행되기 때문", "if-elif-else는 and를 쓸 수 없기 때문", "if-elif-else는 비교 연산자를 쓸 수 없기 때문", "독립된 if가 항상 더 빠르기 때문"]
    answer: 1
    difficulty: 2
    explanation: if-elif-else는 배타적인 조건 중 하나만 실행하므로, 여러 결과를 동시에 출력하려면 조건마다 따로 if를 쓰는 편이 간결합니다.

  - id: w03-22
    type: mc
    prompt: |
      다음 코드의 문제점은?
      ```python
      x = 10
      if x = 10:
          print('같다')
      ```
    choices: ["`같다`가 출력된다", "아무것도 출력되지 않는다", "`=`는 대입이라 조건식에 쓸 수 없어 문법 오류(SyntaxError)가 난다", "`x`가 정의되지 않아 오류가 난다"]
    answer: 3
    verify: |
      ok = False
      try:
          compile("x = 10\nif x = 10:\n    print(1)\n", "t", "exec")
      except SyntaxError:
          ok = True
      assert ok
    explanation: 같은지 비교는 `==`입니다. `=`는 값을 넣는(대입) 기호라 조건식에 쓰면 문법 오류입니다.

  - id: w03-23
    type: mc
    prompt: "`random.randint(1, 6)`이 돌려줄 수 있는 값은?"
    choices: ["0 이상 5 이하의 정수", "1 이상 5 이하의 정수", "1 이상 6 이하의 정수", "0 이상 1 미만의 실수"]
    answer: 3
    verify: |
      import random
      random.seed(1)
      vals = set(random.randint(1, 6) for _ in range(3000))
      assert vals == {1, 2, 3, 4, 5, 6}
    explanation: "`randint(start, stop)`은 **양 끝을 모두 포함**하는 정수 난수입니다. (`range`와 다르니 주의)"

  - id: w03-24
    type: mc
    prompt: "`random.random()`이 돌려주는 값은?"
    choices: ["0 이상 1 이하의 정수", "0 이상 1 미만의 실수", "1 이상 6 이하의 정수", "-1 이상 1 이하의 실수"]
    answer: 2
    verify: |
      import random
      random.seed(1)
      xs = [random.random() for _ in range(2000)]
      assert all(0 <= x < 1 for x in xs) and isinstance(xs[0], float)
    explanation: "`random()`은 0 이상 1 미만의 실수 난수입니다. 쓰기 전에 `import random`이 필요합니다."

  - id: w03-25
    type: predict
    difficulty: 2
    code: |
      import random
      random.seed(1)
      a = random.randint(1, 6)
      b = random.randint(1, 6)
      random.seed(1)
      c = random.randint(1, 6)
      print(a == c, a, b, c)
    explanation: "`random.seed(1)`로 시드를 고정하면 같은 순서의 난수가 다시 나옵니다. 그래서 elice 제출 규칙에서 `random.seed(1)`을 쓰라고 합니다."

  - id: w03-26
    type: blank
    prompt: 정수가 짝수인지 홀수인지 출력하도록 빈칸을 채우시오.
    code: |
      num = 7
      if num _____ 2 == 0:
          print(f"{num}: 짝수")
      _____:
          print(f"{num}: 홀수")
    blanks: [["%"], ["else"]]
    explanation: 2로 나눈 나머지가 0이면 짝수입니다. 나머지 경우는 `else:`로 처리합니다.

  - id: w03-27
    type: blank
    prompt: 90점 이상 A, 80점 이상 B, 70점 이상 C, 나머지 F가 되도록 빈칸을 채우시오.
    code: |
      score = 78
      if score >= 90:
          grade = 'A'
      _____ score >= 80:
          grade = 'B'
      elif score >= _____:
          grade = 'C'
      else:
          grade = 'F'
      print(grade)
    blanks: [["elif"], ["70"]]
    explanation: 앞 조건이 거짓일 때만 elif를 검사하므로 '80 이상 90 미만'을 `score >= 80`만으로 표현할 수 있습니다.

  - id: w03-28
    type: predict
    code: |
      dice1 = 3
      dice2 = 3
      total = dice1 + dice2
      if total == 7 or total == 11:
          print("대박! 승리")
      if total % 2 == 0:
          print("짝수입니다")
      else:
          print("홀수입니다")
      if dice1 == dice2:
          print("더블입니다!")
    explanation: 서로 독립된 if 문 세 개라 각각 검사됩니다. 합 6은 7·11이 아니고 짝수이며, 두 눈이 같으므로 더블입니다.

  - id: w03-29
    type: short
    prompt: 두 조건이 **모두** 참일 때만 True가 되는 논리 연산자를 쓰시오.
    answer: ["and"]
    explanation: "`and`는 둘 다 참일 때 True, `or`는 하나라도 참이면 True입니다."

  - id: w03-30
    type: ox
    prompt: 숫자 `a`에 대해 `not (a > 0)`은 `a <= 0`과 항상 같은 결과를 낸다.
    answer: "O"
    verify: |
      for a in [-5, -1, 0, 1, 7, 0.5, -0.5]:
          assert (not (a > 0)) == (a <= 0)
    explanation: "'0보다 크다'의 반대는 '0보다 작거나 같다'입니다."

  - id: w03-31
    type: essay
    prompt: if-elif-else 구조와 중첩 if문의 차이점, 그리고 각각 어떤 상황에 알맞은지 서술하시오.
    answer: |
      if-elif-else는 서로 배타적인 조건을 위에서부터 차례로 검사해 처음 참인 조건 하나만 실행한다. 조건이 명확히 나뉘고 한 번에 하나만 참일 때(학점 계산 등) 간결하다.
      중첩 if문은 바깥 조건이 참일 때만 안쪽 조건을 추가로 검사한다. 조건이 여러 단계로 세분화되거나, 특정 조건에서만 추가 검사가 필요할 때(성인풀 조건을 만족한 사람 중 18세 이상만 다이빙풀) 알맞다.
    points:
      - if-elif-else는 처음 참인 조건 하나만 실행 (배타적 조건)
      - 중첩 if는 바깥 조건이 참일 때만 안쪽 조건 검사
      - "if-elif-else 예: 학점처럼 한 결과만 나올 때"
      - "중첩 if 예: 단계별 조건, 추가 검사가 필요할 때"

  - id: w03-32
    type: essay
    prompt: "`=`와 `==`의 차이를 설명하시오."
    answer: |
      `=`는 오른쪽 값을 왼쪽 변수에 넣는 **대입** 연산자이고, `==`는 두 값이 같은지 **비교**해 True/False를 돌려주는 비교 연산자이다.
      조건식에는 `==`를 써야 하며, `if x = 10:`처럼 쓰면 문법 오류가 난다.
    points:
      - "= 는 대입"
      - "== 는 같은지 비교 (결과 True/False)"
      - 조건식에는 == 를 쓴다
