  - id: w07-33
    type: essay
    prompt: 함수에서 `print`와 `return`의 차이를 설명하시오.
    answer: |
      `print`는 값을 화면에 출력할 뿐 호출한 곳으로 값을 돌려주지 않는다. 그래서 print만 하는 함수의 결과를 변수에 받으면 None이 된다.
      `return`은 계산한 값을 호출한 곳으로 돌려주고 그 즉시 함수를 끝낸다. 돌려받은 값은 변수에 저장하거나 다른 계산에 다시 쓸 수 있다.
    points:
      - "print: 화면 출력만, 반환값 없음 (None)"
      - "return: 값을 호출한 곳으로 돌려줌"
      - return을 만나면 함수가 즉시 종료
      - return값은 다른 계산에 재사용 가능

  - id: w07-34
    type: essay
    prompt: 함수를 사용하면 좋은 점을 두 가지 이상 서술하시오.
    answer: |
      같은 작업을 함수로 만들어 두면 반복되는 코드를 줄이고 여러 곳에서 재사용할 수 있다.
      코드의 용도를 함수 단위로 나눌 수 있어 읽기 쉽고, 한 곳만 고치면 되므로 실수를 줄일 수 있다.
      또 인자만 바꿔 같은 코드로 다른 결과를 얻을 수 있다.
    points:
      - 반복되는 코드를 줄이고 재사용성을 높인다
      - 코드의 용도를 구분할 수 있다 (가독성)
      - 실수를 줄인다 (한 곳만 수정)

