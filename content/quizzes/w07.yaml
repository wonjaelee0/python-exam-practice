id: w07
short: 7주차
title: 함수
order: 7
summary: def·호출, 매개변수와 인자, return(조기 종료·None), 여러 값 반환, 유용한 내장 함수, 리스트·딕셔너리를 받고 돌려주는 함수
items:
  - id: w07-01
    type: mc
    prompt: 파이썬에서 함수를 **정의**할 때 쓰는 키워드는?
    choices: ["`function`", "`def`", "`func`", "`define`"]
    answer: 2
    explanation: "`def 함수이름(매개변수):`로 정의하고, 다음 줄부터 들여쓰기로 함수 내용을 씁니다."

  - id: w07-02
    type: ox
    prompt: 함수는 정의(def)만 해도 그 안의 코드가 바로 실행된다.
    answer: "X"
    explanation: 정의는 '만들어 두기'일 뿐입니다. `함수이름()`으로 **호출**해야 실행됩니다.

  - id: w07-03
    type: predict
    code: |
      def my_print():
          print("안녕하세요")

      print("시작")
      my_print()
      my_print()
    explanation: 함수는 호출할 때마다 실행됩니다. 두 번 호출했으므로 두 번 출력됩니다.

  - id: w07-04
    type: mc
    prompt: "`my_print('홍길동')`처럼 함수를 호출할 때 괄호 안에 넣어 **전달하는 값**을 무엇이라 하는가?"
    choices: ["매개변수(parameter)", "인자(argument)", "반환값(return value)", "키워드(keyword)"]
    answer: 2
    explanation: 호출할 때 넘기는 값은 **인자**, 함수 정의에서 그 값을 받는 변수(`def my_print(name):`의 name)는 **매개변수**입니다.

  - id: w07-05
    type: short
    prompt: "`def add(a, b):`에서 `a`, `b`처럼 함수가 외부로부터 값을 전달받는 변수를 무엇이라 하는가?"
    answer: ["매개변수", "parameter", "파라미터", "매개 변수"]
    ignore_case: true
    explanation: 함수 정의의 괄호 안 변수가 매개변수입니다. 2개 이상이면 콤마로 나열합니다.

  - id: w07-06
    type: predict
    code: |
      def add(a, b):
          print(a + b)

      add(10, 20)
      add(10.0, 20.0)
      add('hello, ', 'python')
    explanation: 같은 함수라도 인자의 자료형에 따라 `+`의 동작(덧셈, 실수 덧셈, 문자열 이어 붙이기)이 달라집니다.

  - id: w07-07
    type: predict
    code: |
      def add(a, b):
          return a + b

      result = add(10, 20)
      print(result * 2)
    explanation: "`return`은 계산 결과를 호출한 곳으로 돌려줍니다. 돌려받은 값은 다른 계산에 다시 쓸 수 있습니다."

  - id: w07-08
    type: predict
    difficulty: 2
    code: |
      def add(a, b):
          print(a + b)

      x = add(1, 2)
      print(x)
    explanation: "`print`만 하고 `return`이 없는 함수는 **None**을 돌려줍니다. 화면에 3이 찍힌 뒤 x는 None입니다."

  - id: w07-09
    type: predict
    difficulty: 2
    code: |
      def check_even(n):
          if n % 2 == 0:
              return "짝수입니다."
          print("홀수 처리 중")

