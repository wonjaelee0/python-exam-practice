      print(check_even(5))
    explanation: "`return`을 만나면 함수가 즉시 끝납니다. 5는 return을 만나지 않고 끝나므로 None을 돌려줍니다."

  - id: w07-10
    type: predict
    code: |
      def add_sub(a, b):
          return a + b, a - b

      res = add_sub(10, 20)
      print(res, type(res))
      x, y = add_sub(10, 20)
      print(x, y)
    explanation: 값 여러 개를 콤마로 반환하면 **튜플** 하나로 반환됩니다. 변수 여러 개로 받으면 언패킹됩니다.

  - id: w07-11
    type: ox
    prompt: "함수에서 `return a, b`로 두 값을 반환하면 리스트 `[a, b]`가 반환된다."
    answer: "X"
    verify: |
      def f():
          return 1, 2
      assert f() == (1, 2) and isinstance(f(), tuple)
    explanation: 리스트가 아니라 튜플 `(a, b)`가 반환됩니다.

  - id: w07-12
    type: mc
    prompt: "`return` 문이 없는 함수를 호출하면 무엇이 반환되는가?"
