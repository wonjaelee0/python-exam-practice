  - id: w07-47
    type: essay
    prompt: 함수가 `return a, b`처럼 여러 값을 반환할 때 어떤 형태로 반환되고, 호출한 쪽에서 어떻게 받아 쓰는지 설명하시오.
    answer: |
      `return a, b`는 두 값을 묶은 **튜플** `(a, b)` 하나를 반환한다.
      호출한 쪽에서는 `x, y = f()`처럼 변수 여러 개로 나눠 받을 수 있고(언패킹), `r = f()`로 받으면 튜플이므로 `r[0]`, `r[1]`로 꺼낸다.
      나눠 받을 때는 변수 개수와 반환값 개수가 같아야 한다.
    points:
    - 튜플로 반환
    - x, y = f() 언패킹
    - 변수 개수가 맞아야 함 / 인덱스로도 접근 가능
    difficulty: 2
