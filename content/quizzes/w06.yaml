id: w06
short: 6주차
title: 딕셔너리 · 집합 · 문자열 메서드
order: 6
summary: 딕셔너리 키 규칙과 메서드(get·update·setdefault·pop·items), 집합의 특징과 연산·메서드, 문자열 메서드(replace·split·join·strip·find)
items:
  - id: w06-01
    type: ox
    prompt: 하나의 딕셔너리에서 같은 키를 중복해서 사용할 수 없다.
    answer: "O"
    explanation: 키는 고유합니다. 같은 키로 다시 넣으면 새 키가 생기지 않고 값이 바뀝니다.

  - id: w06-02
    type: mc
    prompt: 다음 중 딕셔너리의 **키로 사용할 수 없는** 것은?
    choices: ["정수 `1`", "문자열 `'a'`", "튜플 `(1, 2)`", "리스트 `[1, 2]`"]
    answer: 4
    verify: |
      d = {1: 'x', 'a': 'y', (1, 2): 'z'}
      ok = False
      try:
          d[[1, 2]] = 'w'
      except TypeError:
          ok = True
      assert ok
    explanation: 키는 변경할 수 없는(immutable) 타입만 됩니다. 리스트, 집합, 딕셔너리는 키로 쓸 수 없습니다.

  - id: w06-03
    type: predict
    code: |
      d = {'a': 1, 'a': 2, 'b': 3}
      print(d)
      print(len(d))
    explanation: 같은 키가 두 번 나오면 나중 값이 남습니다. 키는 'a', 'b' 두 개뿐입니다.

  - id: w06-04
    type: predict
    error: true
    code: |
      order = {'americano': 5, 'latte': 3}
      print(order['mocha'])
    explanation: 없는 키를 `[ ]`로 읽으면 `KeyError`가 납니다.

  - id: w06-05
    type: predict
    code: |
      order = {'americano': 5}
      print(order.get('mocha'))
      print(order.get('mocha', 0))
      print(order.get('americano'))
    explanation: "`get(키)`는 키가 없으면 오류 대신 `None`을, `get(키, 기본값)`은 기본값을 돌려줍니다."

  - id: w06-06
    type: predict
    code: |
      d = {'a': 1, 'b': 2}
      print('a' in d)
      print(1 in d)
    explanation: 딕셔너리에 대한 `in`은 **키**에 있는지 확인합니다. 1은 값이지 키가 아닙니다.

  - id: w06-07
    type: predict
    code: |
      order = {'americano': 5, 'latte': 3}
      order['americano'] = 2
      order['mocha'] = 1
      del order['latte']
      print(order)
    explanation: "`딕셔너리[키] = 값`은 키가 있으면 수정, 없으면 추가합니다. `del 딕셔너리[키]`로 삭제합니다."

  - id: w06-08
    type: predict
    code: |
      print(dict(a=1, b=2))
      print(dict([('x', 10), ('y', 20)]))
      print(dict(zip(['k1', 'k2'], [5, 6])))
    explanation: "`dict()`는 `키=값`, (키, 값) 쌍의 리스트, `zip(키 리스트, 값 리스트)`로 딕셔너리를 만듭니다."

  - id: w06-09
    type: predict
    code: |
      keys = ['a', 'b', 'c']
      print(dict.fromkeys(keys))
      print(dict.fromkeys(keys, 100))
    explanation: "`dict.fromkeys(키 리스트)`는 값이 모두 None, 값을 지정하면 그 값으로 채운 딕셔너리를 만듭니다."

  - id: w06-10
    type: predict
    difficulty: 2
    code: |
      d = {'Canada': '토론토'}
      d.setdefault('Canada', '오타와')
      print(d)
      d.update(Canada='오타와')
      print(d)
      d.setdefault('America', '워싱턴D.C.')
      print(len(d))
    explanation: "`setdefault`는 키가 없을 때만 추가하고 **이미 있는 값은 바꾸지 않습니다**. `update`는 추가와 수정이 모두 됩니다."

  - id: w06-11
    type: predict
    difficulty: 2
    code: |
      d = {'a': 1, 'b': 2, 'c': 3}
      print(d.pop('a'))
      print(d.popitem())
      print(d)
    explanation: "`pop(키)`는 삭제한 **값**을, `popitem()`은 마지막 키-값 쌍을 **튜플**로 돌려줍니다."

  - id: w06-12
    type: predict
    code: |
      x = {'a': 10, 'b': 20}
      for key, value in x.items():
          print(key, value)
      for key in x:
          print(key, end=' ')
    explanation: "`items()`는 키-값 쌍을 함께 꺼내고, 딕셔너리를 그대로 반복하면 **키**만 꺼냅니다."

  - id: w06-13
    type: predict
    code: |
      maria = {'kor': 94, 'eng': 91, 'math': 89, 'sci': 83}
      print(sum(maria.values()) / len(maria))
      print(list(maria.keys()))
    explanation: "`values()`는 값들, `keys()`는 키들을 가져옵니다. `len(딕셔너리)`는 키의 개수입니다."

  - id: w06-14
    type: ox
    prompt: 딕셔너리는 키-값을 추가한 순서대로 저장되고, for 문으로 그 순서대로 꺼낼 수 있다.
    answer: "O"
    verify: |
      d = {}
      for k in ['z', 'a', 'm']:
          d[k] = 1
      assert list(d) == ['z', 'a', 'm']
    explanation: 강의 내용처럼 딕셔너리는 넣은 순서를 기억합니다(파이썬 3.7부터 보장, 시험장 3.6에서도 같게 동작).

  - id: w06-15
    type: ox
    prompt: 집합(set)은 중복된 값을 허용하지 않고, 요소의 순서가 없다.
    answer: "O"
    explanation: 집합은 중복이 없고 순서가 없어서 인덱스로 요소에 접근할 수 없습니다.

  - id: w06-16
    type: predict
    code: |
      fruits = {'orange', 'orange', 'cherry'}
      print(len(fruits))
    explanation: 중복된 'orange'는 하나만 남습니다.

  - id: w06-17
    type: predict
    error: true
    code: |
      s = {1, 2, 3}
      print(s[0])
    explanation: 집합은 순서가 없어 인덱싱을 지원하지 않습니다(`TypeError`).

  - id: w06-18
    type: predict
    difficulty: 2
    code: |
      print(type({}))
      print(type(set()))
    explanation: "`{}`는 빈 **딕셔너리**입니다. 빈 집합은 `set()`으로 만들어야 합니다."

  - id: w06-19
    type: predict
    code: |
      print(sorted(set('apple')))
      print(len(set('banana')))
    explanation: "`set(문자열)`은 글자들의 집합을 만듭니다. 중복 글자는 하나만 남습니다. 집합은 순서가 없어 `sorted()`로 정렬해 출력했습니다."

  - id: w06-20
    type: predict
    code: |
      a = {1, 2, 3, 4}
      b = {3, 4, 5, 6}
      print(sorted(a | b))
      print(sorted(a & b))
      print(sorted(a - b))
      print(sorted(a ^ b))
    explanation: "`|` 합집합, `&` 교집합, `-` 차집합, `^` 대칭차집합(한쪽에만 있는 요소)."

  - id: w06-21
    type: predict
    difficulty: 2
    code: |
      a = {1, 2}
      b = {1, 2, 3}
      print(a <= b, a < b, b <= b, b < b)
      print(a == {2, 1})
    explanation: "`<=`는 부분집합, `<`는 진부분집합(같으면 False). 집합은 순서가 없으므로 `{1, 2} == {2, 1}`은 True."

  - id: w06-22
    type: predict
    code: |
      s = {1, 2, 3}
      s.add(4)
      s.discard(10)
      s.remove(1)
      print(sorted(s))
    explanation: "`add`로 추가, `discard`는 없는 값이어도 그냥 넘어가고, `remove`는 있는 값을 삭제합니다."

  - id: w06-23
    type: predict
    error: true
    code: |
      s = {1, 2}
      s.remove(10)
    explanation: "`remove(x)`는 x가 없으면 `KeyError`가 납니다. 오류 없이 지우려면 `discard(x)`."

  - id: w06-24
    type: mc
    prompt: 집합에서 **없는 값을 삭제해도 오류가 나지 않는** 메서드는?
    choices: ["`remove(x)`", "`discard(x)`", "`pop()`", "`clear()`"]
    answer: 2
    verify: |
      s = {1}
      s.discard(5)
    explanation: "`discard`는 값이 없으면 그냥 넘어갑니다. `remove`는 KeyError, 빈 집합에서 `pop()`도 오류입니다."

  - id: w06-25
    type: blank
    prompt: 1~30 중 3과 5의 공배수를 집합으로 구하도록 빈칸을 채우시오.
    code: |
      three = set()
      five = set()
      for i in range(1, 31):
          if i % 3 == 0:
              three._____(i)
          if i % 5 == 0:
              five.add(i)
      print(sorted(three _____ five))
    blanks: [["add"], ["&"]]
    explanation: "집합에 요소를 넣을 때는 `add`(리스트의 append가 아님), 공통 요소는 교집합 `&`."

  - id: w06-26
    type: predict
    code: |
      print('banana'.replace('a', 'o'))
      print('a-b-c'.replace('-', ''))
    explanation: "`replace(바꿀 문자열, 새 문자열)`은 모든 곳을 바꾼 **새 문자열**을 돌려줍니다."

  - id: w06-27
    type: predict
    code: |
      words = 'red,green,blue'.split(',')
      print(words)
      print(' / '.join(words))
    explanation: "`split(기준)`은 기준 문자열로 나눈 리스트, `'구분자'.join(리스트)`는 요소를 구분자로 이은 문자열입니다."

  - id: w06-28
    type: predict
    difficulty: 2
    code: |
      s = '  hi  '
      print(repr(s.strip()), repr(s.lstrip()), repr(s.rstrip()))
    explanation: "`strip()`은 양쪽, `lstrip()`은 왼쪽, `rstrip()`은 오른쪽의 연속된 공백만 지웁니다. (`repr`은 공백이 보이도록 따옴표로 감싸 출력)"

  - id: w06-29
    type: predict
    code: |
      s = 'python'
      print(s.find('th'), s.find('z'), s.count('o'))
    explanation: "`find`는 처음 찾은 위치(인덱스)를, 없으면 `-1`을 돌려줍니다. `count`는 나온 횟수입니다."

  - id: w06-30
    type: predict
    error: true
    code: |
      print('python'.index('z'))
    explanation: "`index`는 `find`와 같지만, 찾는 문자열이 없으면 -1 대신 `ValueError`를 냅니다."

  - id: w06-31
    type: predict
    code: |
      s = 'Hello'
      print(s.upper(), s.lower())
      print(s)
    explanation: 문자열 메서드는 원본을 바꾸지 않고 새 문자열을 돌려줍니다. 원래 `s`는 그대로 'Hello'입니다.

  - id: w06-32
    type: ox
    prompt: "`s.upper()`를 실행하면 변수 `s`에 들어 있는 문자열 자체가 대문자로 바뀐다."
    answer: "X"
    verify: |
      s = 'abc'
      t = s.upper()
      assert s == 'abc' and t == 'ABC'
    explanation: 문자열은 변경할 수 없으므로 `s = s.upper()`처럼 결과를 다시 대입해야 합니다.

  - id: w06-33
    type: predict
    difficulty: 2
    code: |
      table = str.maketrans('ab', 'AB')
      print('abcab'.translate(table))
    explanation: "`str.maketrans('바꿀문자', '새문자')`로 변환 표를 만들고 `translate(표)`로 글자를 한꺼번에 바꿉니다."

  - id: w06-34
    type: blank
    prompt: "\"상품명,수량\" 형식의 주문을 정리해 상품별 총 수량을 구하도록 빈칸을 채우시오."
    code: |
      orders = ["  Apple,3 ", "banana, 2", "APPLE, 4"]
      result = {}
      for order in orders:
          product, quantity = order._____(',')
          product = product.strip()._____()
          quantity = int(quantity.strip())
          if product in result:
              result[product] += quantity
          else:
              result[product] = quantity
      print(result)
    blanks: [["split"], ["lower"]]
    difficulty: 2
    explanation: 쉼표로 나눈 뒤 공백을 지우고 소문자로 통일해야 'Apple'과 'APPLE'이 같은 상품으로 합쳐집니다.

  - id: w06-35
    type: mc
    prompt: "`import string` 후 `string.digits`의 값은?"
    choices: ["`'0123456789'`", "`'abcdefghijklmnopqrstuvwxyz'`", "`'!\"#$%&'`로 시작하는 문장 부호", "`' \\t\\n'` 같은 공백 문자"]
    answer: 1
    verify: |
      import string
      assert string.digits == '0123456789'
    explanation: "`string.digits`는 숫자, `ascii_lowercase`는 소문자, `ascii_uppercase`는 대문자, `punctuation`은 문장 부호입니다."

  - id: w06-36
    type: short
    prompt: 리스트 `['a', 'b', 'c']`를 `'a-b-c'`처럼 하나의 문자열로 이을 때 쓰는 문자열 메서드 이름을 쓰시오.
    answer: ["join", "join()"]
    explanation: "`'-'.join(['a', 'b', 'c'])` → `'a-b-c'`. 구분자 문자열에서 호출한다는 점에 주의하세요."

  - id: w06-37
    type: essay
    prompt: 딕셔너리에서 `d[키]`와 `d.get(키)`로 값을 읽을 때의 차이를 설명하시오.
    answer: |
      둘 다 키에 해당하는 값을 돌려주지만, 키가 없을 때 동작이 다르다.
      `d[키]`는 키가 없으면 KeyError가 나서 프로그램이 멈추고, `d.get(키)`는 오류 없이 None을 돌려주며 `d.get(키, 기본값)`처럼 기본값을 지정할 수 있다.
      그래서 없는 키가 올 수 있으면 get이나 `in` 검사를 쓴다.
    points:
      - 키가 있으면 둘 다 값을 돌려준다
      - "d[키]: 없으면 KeyError"
      - "get: 없으면 None 또는 기본값"

  - id: w06-38
    type: essay
    prompt: 리스트, 딕셔너리, 집합을 각각 어떤 상황에 쓰면 좋은지 예를 들어 설명하시오.
    answer: |
      리스트는 순서가 중요하고 중복이 있을 수 있는 값들을 저장할 때(예 — 입력한 점수 목록) 쓴다.
      딕셔너리는 이름표(키)로 값을 찾아야 할 때(예 — 메뉴별 가격, 단어별 등장 횟수) 쓴다.
      집합은 중복을 없애거나 교집합·합집합 같은 집합 연산이 필요할 때(예 — 출석한 사람 수 세기, 공통 수강생 찾기) 쓴다.
    points:
      - "리스트: 순서·중복 있는 데이터, 인덱스로 접근"
      - "딕셔너리: 키로 값을 찾기, 키는 중복 불가"
      - "집합: 중복 제거, 집합 연산, 순서 없음"
