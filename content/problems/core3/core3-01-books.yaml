tests:
  - stdin: "데미안\n헤르만 헤세\n수레바퀴 아래서\n헤르만 헤세\n"
    public: true
  - stdin: "코스모스\n칼 세이건\n이기적 유전자\n리처드 도킨스\n"
  - stdin: "같은 책\n저자A\n같은 책\n저자B\n"
    note: 제목이 같아도 저자가 다름
  - stdin: "A\nX\nB\nY\n"
hints:
  - "`__init__`에서 `self.title = title`처럼 전달받은 값을 객체의 속성에 저장합니다."
  - "객체를 만들 때는 `Book(t1, a1)`처럼 self를 빼고 나머지 값만 넘깁니다."
explanation: |
  클래스는 '틀', 객체는 그 틀로 만든 각각의 데이터입니다. 같은 클래스로 만든 두 객체는 속성을 따로 가집니다.
