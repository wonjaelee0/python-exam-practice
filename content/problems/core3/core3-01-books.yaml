id: core3-01-books
title: "[3주차 도전1] 두 권의 책 객체"
unit: core3
difficulty: 1
tags: [core.w3, class.init, class.attr]
statement: |
  > 컴퓨팅 핵심 3주차 도전문제 1(두 사람의 동아리 회원증)과 같은 유형입니다.

  책 한 권을 `Book` 객체 하나로 표현하려고 한다. 같은 클래스로 서로 다른 객체 두 개를 만들고, 객체에 저장된 속성을 읽어 출력하시오.

  | 항목 | 역할 |
  |---|---|
  | `Book(title, author)` | 제목과 저자를 받아 책 객체를 만든다 |
  | `title` 속성 | 책 제목 |
  | `author` 속성 | 저자 |

  - 입력 프롬프트: `첫 번째 책 제목: `, `첫 번째 책 저자: `, `두 번째 책 제목: `, `두 번째 책 저자: `
  - 출력: `《데미안》 - 헤르만 헤세` 형식으로 두 줄, 마지막 줄에 두 책의 저자가 같으면 `같은 저자의 책입니다.`, 다르면 `다른 저자의 책입니다.`
  - 제목과 저자에는 공백이 들어갈 수 있다.
starter: |
  class Book:
      def __init__(self, title, author):
          pass
solution: |
  class Book:
      def __init__(self, title, author):
          self.title = title
          self.author = author


  t1 = input("첫 번째 책 제목: ")
  a1 = input("첫 번째 책 저자: ")
  t2 = input("두 번째 책 제목: ")
  a2 = input("두 번째 책 저자: ")
  book1 = Book(t1, a1)
  book2 = Book(t2, a2)
  print(f"《{book1.title}》 - {book1.author}")
  print(f"《{book2.title}》 - {book2.author}")
  if book1.author == book2.author:
      print("같은 저자의 책입니다.")
  else:
      print("다른 저자의 책입니다.")
alt_solutions:
  - |
    class Book:
        def __init__(self, title, author):
            self.title = title
            self.author = author


    books = []
    for order in ["첫 번째", "두 번째"]:
        title = input(order + " 책 제목: ")
        author = input(order + " 책 저자: ")
        books.append(Book(title, author))
    for b in books:
        print("《" + b.title + "》 - " + b.author)
    print("같은 저자의 책입니다." if books[0].author == books[1].author else "다른 저자의 책입니다.")
mutants:
  - name: 제목과 저자를 바꿔 저장
    code: |
      class Book:
          def __init__(self, title, author):
              self.title = author
              self.author = title


      t1 = input("첫 번째 책 제목: ")
      a1 = input("첫 번째 책 저자: ")
      t2 = input("두 번째 책 제목: ")
      a2 = input("두 번째 책 저자: ")
      book1 = Book(t1, a1)
      book2 = Book(t2, a2)
      print(f"《{book1.title}》 - {book1.author}")
      print(f"《{book2.title}》 - {book2.author}")
      if book1.author == book2.author:
          print("같은 저자의 책입니다.")
      else:
          print("다른 저자의 책입니다.")
  - name: 제목으로 같은 저자인지 판단
    code: |
      class Book:
          def __init__(self, title, author):
              self.title = title
