solution: |
  class TransitCard:
      def __init__(self, name, balance):
          self.name = name
          self.__balance = balance

      def get_balance(self):
          return self.__balance

      def pay(self, amount):
          if 1 <= amount <= self.__balance:
              self.__balance -= amount
              return True
          return False


  class CommuteCard(TransitCard):
      def commute(self, fare, days):
          return self.pay(fare * 2 * days)


  name = input("이름: ")
  balance = int(input("처음 잔액: "))
  fare, days = map(int, input("편도 요금과 일수(공백 구분): ").split())
  card = CommuteCard(name, balance)
  if card.commute(fare, days):
      print(f"{card.name}: {days}일 왕복 결제 성공")
  else:
      print(f"{card.name}: {days}일 왕복 결제 실패")
  print(f"잔액: {card.get_balance()}원")
alt_solutions:
  - |
    class TransitCard:
        def __init__(self, name, balance):
            self.name = name
            self.__balance = balance

        def get_balance(self):
            return self.__balance

        def pay(self, amount):
            if 1 <= amount <= self.__balance:
                self.__balance -= amount
                return True
            return False


    class CommuteCard(TransitCard):
        def commute(self, fare, days):
            need = fare * 2 * days
            ok = self.pay(need)
            return ok


    card = CommuteCard(input("이름: "), int(input("처음 잔액: ")))
    parts = input("편도 요금과 일수(공백 구분): ").split()
    days = int(parts[1])
    word = "성공" if card.commute(int(parts[0]), days) else "실패"
    print(card.name + ": " + str(days) + "일 왕복 결제 " + word)
    print("잔액: " + str(card.get_balance()) + "원")
