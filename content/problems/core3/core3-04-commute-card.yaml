id: core3-04-commute-card
title: "[3주차 도전4] 상속으로 왕복 정기권 결제 더하기"
unit: core3
difficulty: 3
tags: [core.w3, class.inherit, class.method]
statement: |
  > 컴퓨팅 핵심 3주차 도전문제 4(상속으로 보고서 인쇄 기능 더하기)와 같은 유형입니다.

  잔액을 관리하는 `TransitCard`(완성 코드 제공)를 **상속**받는 `CommuteCard`를 만들고, 여러 날의 왕복 요금을 한 번에 결제하는 메서드를 추가하시오.

  | 항목 | 역할 |
  |---|---|
  | `CommuteCard(TransitCard)` | 부모의 `__init__`, `get_balance()`, `pay()`를 그대로 물려받는다 |
  | `commute(fare, days)` | 필요한 금액(`편도 요금 × 2 × 일수`)을 구해 물려받은 `pay()`에 **한 번** 전달하고, 그 반환값을 그대로 반환 |

  - 잔액이 모자라면 일부만 결제하지 않고 요청 전체가 실패한다. 성공 여부와 잔액 처리는 부모의 `pay()`가 담당한다.
  - 자식 클래스는 `__balance`를 직접 읽거나 바꾸지 않는다.
  - 입력 프롬프트: `이름: `, `처음 잔액: `, `편도 요금과 일수(공백 구분): `
  - 출력: 첫 줄 `민지: 5일 왕복 결제 성공` 또는 `민지: 5일 왕복 결제 실패`, 둘째 줄 `잔액: 3000원`
  - 조건: 처음 잔액은 0 이상, 요금과 일수는 1 이상의 정수이다. 잔액을 정확히 모두 쓰는 경우도 성공이다.
starter: |
