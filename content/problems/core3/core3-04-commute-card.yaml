hints:
  - "자식 클래스 선언은 `class CommuteCard(TransitCard):`. 부모의 메서드는 `self.pay(금액)`으로 부릅니다."
  - "필요한 전체 금액을 먼저 계산해 `pay()`를 **한 번만** 호출해야 일부만 결제되는 일이 없습니다."
explanation: |
  상속을 쓰면 잔액 확인·차감 규칙을 다시 쓰지 않고 부모의 `pay()`를 재사용합니다. 자식 객체의 `self`가 곧 부모 기능을 가진 객체이므로 별도의 부모 객체를 만들 필요가 없습니다.
