  - name: 하루씩 결제해 일부만 결제됨
    code: |
      class TransitCard:
          def __init__(self, name, balance):
              self.name = name
              self.__balance = balance

          def get_balance(self):
              return self.__balance

          def pay(self, amount):
              if 1 <= amount <= self.__balance:
                  self.__balance -= amount
                  return True
              return False


      class CommuteCard(TransitCard):
          def commute(self, fare, days):
              ok = True
              for _ in range(days):
                  if not self.pay(fare * 2):
                      ok = False
              return ok


      name = input("이름: ")
      balance = int(input("처음 잔액: "))
      fare, days = map(int, input("편도 요금과 일수(공백 구분): ").split())
      card = CommuteCard(name, balance)
      if card.commute(fare, days):
          print(f"{card.name}: {days}일 왕복 결제 성공")
      else:
          print(f"{card.name}: {days}일 왕복 결제 실패")
      print(f"잔액: {card.get_balance()}원")
