tests:
- stdin: "1234\n6\n열기 1111\n열기 1234\n열기 0000\n변경 1234 5678\n열기 1234\n열기 5678\n"
  public: true
- stdin: "0000\n5\n열기 1\n열기 2\n열기 3\n열기 0000\n변경 0000 1111\n"
  note: 세 번 틀려 잠김
- stdin: "4321\n5\n열기 1\n열기 2\n열기 4321\n열기 3\n열기 4321\n"
  note: 성공하면 연속 실패가 초기화
- stdin: "9999\n4\n변경 9999 12a4\n변경 9999 123\n변경 1111 2222\n변경 9999 0007\n"
hints:
- 연속 실패는 `open()`이 성공할 때 0으로 되돌립니다.
- 잠김 여부는 매번 `__fails`를 직접 보지 말고 `is_locked()`를 통해 확인하세요.
explanation: |
  객체가 '상태'(연속 실패 횟수)를 기억하고, 그 상태에 따라 같은 메서드가 다르게 동작합니다. 상태를 바꾸는 규칙(실패 시 +1, 성공 시 0)을 클래스 안에 모아 두면 바깥 코드가 규칙을 어길 수 없습니다.
