hints:
  - "`self.__balance`처럼 이름 앞에 밑줄 두 개를 붙인 속성은 클래스 안에서만 다루는 값이라는 표시입니다."
  - "`pay()`의 반환값(True/False)을 if 조건에 써서 성공·실패를 출력합니다. 잔액은 `get_balance()`로 확인합니다."
explanation: |
  객체는 메서드가 끝난 뒤에도 바뀐 상태를 기억합니다. 그래서 카드 객체를 반복문 앞에서 **한 번만** 만들어야 잔액이 이어집니다.
  '잔액 이하'는 잔액과 같은 금액도 포함하므로 `amount <= self.__balance`입니다.
