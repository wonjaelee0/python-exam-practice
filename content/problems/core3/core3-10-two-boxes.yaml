hints:
- '`a = SnackBox(...)`, `b = SnackBox(...)`처럼 생성을 두 번 해야 서로 다른 객체가 됩니다.'
- 옮기기는 `if 출발.take(n):` 안에서만 도착 상자에 `put`합니다.
explanation: |
  같은 클래스로 만든 객체라도 생성(`SnackBox(...)`)을 따로 하면 각자 자기 `__stock`을 가집니다. `b = a`는 새 객체를 만들지 않고 같은 객체에 이름만 하나 더 붙이므로, 한쪽을 바꾸면 다른 쪽도 바뀐 것처럼 보입니다.
