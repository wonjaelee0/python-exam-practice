id: core3-10-two-boxes
title: '[3주차 응용5] 두 간식 상자 사이 옮기기'
unit: core3
difficulty: 4
tags:
- core.w3
- class.encapsulation
- object.identity
statement: |
  > 컴퓨팅 핵심 3주차 추가문제 1(간식 꾸러미 나누기)을 응용한 문제입니다.

  같은 `SnackBox` 클래스로 **서로 다른 상자 객체 두 개**(A, B)를 만들고, 꺼내기·채우기·옮기기 요청을 처리하시오.

  | 메서드 | 역할 |
  |---|---|
  | `SnackBox(stock)` | 처음 개수를 `__stock`에 저장 |
  | `get_stock()` | 현재 개수 반환 |
  | `take(count)` | 1 이상이고 남은 개수 이하일 때만 빼고 `True`, 아니면 `False` |
  | `put(count)` | 1 이상일 때만 더하고 `True`, 아니면 `False` |

  명령 (첫 줄에 명령 수, 다음 줄부터 한 줄씩):

  - `꺼내기 A 3`, `채우기 B 5`: 해당 상자에 `take` / `put`
  - `옮기기 A B 4`: A에서 `take(4)`가 **성공했을 때만** B에 `put(4)`. 옮기기의 성공 여부는 `take`의 결과이다.
  - 명령마다 `옮기기 성공 | A: 3개, B: 9개`처럼 명령 이름, 성공/실패, 두 상자의 개수를 출력한다.

  - 입력 프롬프트: `A 상자 처음 개수: `, `B 상자 처음 개수: `, `명령 수: `, 명령마다 `명령: `
  - 조건: 옮기기의 두 상자는 서로 다르다. 개수는 정수이다(0 이하일 수 있음).
starter: |
  class SnackBox:
      def __init__(self, stock):
          self.__stock = stock

      def get_stock(self):
          pass

      def take(self, count):
          pass

      def put(self, count):
          pass
solution: |
  class SnackBox:
      def __init__(self, stock):
          self.__stock = stock

      def get_stock(self):
          return self.__stock

      def take(self, count):
          if 1 <= count <= self.__stock:
              self.__stock -= count
              return True
          return False

      def put(self, count):
          if count >= 1:
              self.__stock += count
              return True
          return False


  a = SnackBox(int(input("A 상자 처음 개수: ")))
  b = SnackBox(int(input("B 상자 처음 개수: ")))
  boxes = {"A": a, "B": b}
  n = int(input("명령 수: "))
  for _ in range(n):
      parts = input("명령: ").split()
      cmd = parts[0]
      if cmd == "꺼내기":
          ok = boxes[parts[1]].take(int(parts[2]))
      elif cmd == "채우기":
          ok = boxes[parts[1]].put(int(parts[2]))
      else:
          count = int(parts[3])
          ok = boxes[parts[1]].take(count)
          if ok:
              boxes[parts[2]].put(count)
      result = "성공" if ok else "실패"
      print(f"{cmd} {result} | A: {a.get_stock()}개, B: {b.get_stock()}개")
alt_solutions:
- |
  class SnackBox:
      def __init__(self, stock):
          self.__stock = stock

      def get_stock(self):
          return self.__stock

      def take(self, count):
          if count < 1 or count > self.__stock:
              return False
          self.__stock = self.__stock - count
          return True

      def put(self, count):
          if count < 1:
              return False
          self.__stock = self.__stock + count
          return True


  boxes = {}
  boxes["A"] = SnackBox(int(input("A 상자 처음 개수: ")))
  boxes["B"] = SnackBox(int(input("B 상자 처음 개수: ")))
  n = int(input("명령 수: "))
  for _ in range(n):
      p = input("명령: ").split()
      if p[0] == "옮기기":
          ok = boxes[p[1]].take(int(p[3])) and boxes[p[2]].put(int(p[3]))
      elif p[0] == "꺼내기":
          ok = boxes[p[1]].take(int(p[2]))
      else:
          ok = boxes[p[1]].put(int(p[2]))
      print(p[0], "성공" if ok else "실패", "| A: " + str(boxes["A"].get_stock()) + "개, B: " + str(boxes["B"].get_stock()) + "개")
