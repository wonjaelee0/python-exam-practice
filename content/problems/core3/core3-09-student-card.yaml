tests:
- stdin: "민지\n10000\n3\n일반 1250\n학생 1250\n학생 9000\n"
  public: true
- stdin: "a\n1000\n2\n학생 1250\n학생 1\n"
- stdin: "b\n800\n2\n일반 1000\n학생 1001\n"
  note: 800원을 정확히 사용
- stdin: "c\n0\n1\n일반 1\n"
hints:
- 자식 메서드에서 `self.pay(...)`로 부모의 기능을 씁니다. `self`는 지금의 학생 카드 객체입니다.
- '`return`을 빠뜨리면 메서드는 `None`을 반환합니다.'
explanation: |
  상속을 쓰면 잔액 검사·차감 규칙(`pay`)을 다시 쓰지 않고 할인 계산만 더할 수 있습니다. 자식은 부모의 비공개 속성 `__balance`를 직접 건드리지 않고 물려받은 메서드로만 다룹니다.
