hints:
- '131m 단위 올림: `(extra + 130) // 131`'
- '`total()` 안에서 `self.fare()`를 호출하면 같은 계산을 두 번 쓰지 않아도 됩니다.'
explanation: |
  한 메서드가 같은 객체의 다른 메서드를 `self.메서드()`로 불러 쓸 수 있습니다. 계산 규칙을 메서드로 나눠 두면 요금 규칙이 바뀌어도 한 곳만 고치면 됩니다.
