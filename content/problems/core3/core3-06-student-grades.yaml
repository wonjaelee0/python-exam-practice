- stdin: "1\n만점 100\n"
- stdin: "3\nx 0\nx 95\ny 79\n"
hints:
- '`if-elif`는 위에서부터 처음 참인 곳 하나만 실행되므로, 높은 기준부터 검사합니다.'
explanation: |
  객체를 리스트에 담아 두면 반복문으로 각 객체의 속성(`s.name`)과 메서드(`s.grade()`)를 차례로 사용할 수 있습니다.
  `elif` 사슬은 위에서부터 검사하므로 70점 조건을 먼저 두면 90점도 `C`가 됩니다.
