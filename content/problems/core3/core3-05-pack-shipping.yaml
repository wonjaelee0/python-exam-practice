                  self.__stock -= count
                  return True
              return False


      class PackWarehouse(Warehouse):
          def ship_packs(self, per_pack, packs):
              if packs <= 0:
                  return False
              return self.take(per_pack * packs)


      item = input("물품 이름: ")
      stock = int(input("처음 재고: "))
      per_pack = int(input("팩당 개수: "))
      requests = list(map(int, input("요청별 팩 수(공백 구분): ").split()))
      box = PackWarehouse(item, stock)
      shipped = 0
      for packs in requests:
          result = "성공" if box.ship_packs(per_pack, packs) else "실패"
          shipped += per_pack * packs
          print(f"{packs}팩 출고 {result} | 남은 {box.item}: {box.get_stock()}개")
