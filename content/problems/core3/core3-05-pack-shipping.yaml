tests:
  - stdin: "마스크\n24\n3\n3 5 2\n"
    public: true
  - stdin: "물티슈\n10\n4\n3 0 -1 2\n"
    note: 0 이하 팩 수는 실패
  - stdin: "건전지\n12\n6\n2\n"
    note: 재고를 정확히 모두 출고
  - stdin: "컵\n0\n1\n1 1\n"
hints:
  - "부모 클래스에 재고 확인·차감 규칙을 두고, 자식 메서드는 필요한 개수만 계산해 `self.take()`를 한 번 호출합니다."
  - "상자 객체는 반복문 앞에서 한 번만 만들어야 재고가 요청 사이에 이어집니다."
explanation: |
  상태 관리(캡슐화)와 상속을 함께 쓰는 문제입니다. '전부 아니면 실패'라는 규칙은 필요한 총량을 계산해 한 번에 요청하면 자연스럽게 지켜집니다.
