tests:
- stdin: "95\nN\n"
  public: true
- stdin: "30\nN\n"
- stdin: "31\nY\n"
- stdin: "400\nY\n"
- stdin: "1440\nN\n"
- stdin: "200\nN\n"
hints:
- 올림 나눗셈은 `(x + 9) // 10`처럼 쓸 수 있습니다.
- 규칙을 적힌 순서(최대 요금 → 경차 할인)대로 적용하세요.
explanation: |
  조건 적용 순서가 바뀌면 결과가 달라집니다. 400분 경차는 18500원 → 최대 15000원 → 절반 7500원이지만, 할인을 먼저 하면 9250원이 됩니다.
