hints:
- '`몫 = 금액 // 동전`, `남은 금액 = 금액 % 동전`을 큰 동전부터 반복합니다. 출력은 `if count > 0:` 안에서만 합니다.'
explanation: |
  반복문으로 동전 목록을 차례로 처리하면서 남은 금액을 `%`로 갱신하는 것이 핵심입니다. 갱신을 빠뜨리면 같은 금액을 동전마다 다시 나누게 됩니다.
