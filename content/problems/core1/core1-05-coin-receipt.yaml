id: core1-05-coin-receipt
title: '[1주차 응용1] 필요한 동전만 적는 거스름돈 영수증'
unit: core1
difficulty: 2
tags:
- core.w1
- arith.divmod
- loop.for
statement: |
  > 컴퓨팅 핵심 1주차 도전문제 1(거스름돈 영수증)을 응용한 문제입니다.

  거스름돈을 500원, 100원, 50원, 10원 동전으로 **큰 단위부터** 준비한다. 이번 영수증에는 **실제로 쓰는 동전만** 적고, 마지막에 동전 개수의 합을 적는다.

  - 입력 프롬프트: `거스름돈 금액을 입력하세요: `
  - 출력: 개수가 1개 이상인 동전만 큰 단위부터 `500원 동전: 19개` 형식으로 출력하고, 마지막 줄에 `동전 합계: 24개`
  - 금액이 0이면 `거스름돈이 없습니다.` 한 줄만 출력한다.
  - 조건: 금액은 0 이상 10,000 미만이며 10원 단위이다.
starter: |
  amount = int(input("거스름돈 금액을 입력하세요: "))
solution: |
  amount = int(input("거스름돈 금액을 입력하세요: "))
  if amount == 0:
      print("거스름돈이 없습니다.")
  else:
      total = 0
      for coin in [500, 100, 50, 10]:
          count = amount // coin
          amount = amount % coin
          if count > 0:
              print(f"{coin}원 동전: {count}개")
              total += count
      print(f"동전 합계: {total}개")
alt_solutions:
- |
  amount = int(input("거스름돈 금액을 입력하세요: "))
  coins = (500, 100, 50, 10)
  used = 0
  if amount > 0:
      for c in coins:
          if amount >= c:
              print(str(c) + "원 동전: " + str(amount // c) + "개")
              used = used + amount // c
              amount -= amount // c * c
      print("동전 합계: " + str(used) + "개")
  else:
      print("거스름돈이 없습니다.")
