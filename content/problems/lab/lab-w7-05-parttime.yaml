id: lab-w7-05-parttime
title: "[7주차 2번] 직무별 아르바이트 급여 함수"
unit: lab
difficulty: 2
tags: [lab.w7, func.return, cond.if-elif]
statement: |
  > 엘리스 7주차 실습 2번(직책별 보수 salary 함수)과 같은 유형입니다.

  직무, 시급, 일한 시간을 받아 급여를 계산해 **반환**하는 함수 `pay(position, rate, hours)`를 만드시오.
  하루 **8시간을 넘게** 일하면 넘은 시간에 대해 직무별 배율의 시급을 준다 (barista 1.5 / cashier 1.3 / cook 1.7).

  - 8시간 이하: `시급 * 시간`
  - 8시간 초과: 자동 채점을 위해 `시급 * 8 + 시급 * 배율 * (시간 - 8)` 순서로 계산한다.
  - 직무는 barista, cashier, cook만 입력된다.
  - 입력 프롬프트: `Enter a position: `, `Enter rate: `, `Enter hour: `
  - 출력: `The pay is: 110000.0` (8시간 이하는 정수 그대로, 예: `The pay is: 96000`)
starter: |
  def pay(position, rate, hours):
      pass
solution: |
  def pay(position, rate, hours):
      if position == "barista":
          ratio = 1.5
      elif position == "cashier":
          ratio = 1.3
      else:
          ratio = 1.7
      if hours > 8:
          return rate * 8 + rate * ratio * (hours - 8)
      return rate * hours


  position = input("Enter a position: ")
  rate = int(input("Enter rate: "))
  hours = int(input("Enter hour: "))
  print("The pay is:", pay(position, rate, hours))
alt_solutions:
  - |
    RATIOS = {"barista": 1.5, "cashier": 1.3, "cook": 1.7}


    def pay(position, rate, hours):
        if hours <= 8:
            return rate * hours
        return rate * 8 + rate * RATIOS[position] * (hours - 8)


    position = input("Enter a position: ")
    rate = int(input("Enter rate: "))
    hours = int(input("Enter hour: "))
    result = pay(position, rate, hours)
    print(f"The pay is: {result}")
mutants:
  - name: 모든 시간에 배율을 적용
    code: |
      def pay(position, rate, hours):
          if position == "barista":
              ratio = 1.5
          elif position == "cashier":
              ratio = 1.3
          else:
              ratio = 1.7
          if hours > 8:
              return rate * ratio * hours
          return rate * hours


      position = input("Enter a position: ")
      rate = int(input("Enter rate: "))
      hours = int(input("Enter hour: "))
      print("The pay is:", pay(position, rate, hours))
  - name: 정확히 8시간도 초과 근무로 계산
    code: |
      def pay(position, rate, hours):
          if position == "barista":
              ratio = 1.5
          elif position == "cashier":
              ratio = 1.3
          else:
              ratio = 1.7
          if hours >= 8:
              return rate * 8 + rate * ratio * (hours - 8)
          return rate * hours


      position = input("Enter a position: ")
      rate = int(input("Enter rate: "))
      hours = int(input("Enter hour: "))
      print("The pay is:", pay(position, rate, hours))
tests:
  - stdin: "barista\n10000\n10\n"
    public: true
  - stdin: "cook\n12000\n8\n"
    public: true
  - stdin: "cashier\n9860\n12\n"
  - stdin: "cook\n10000\n9\n"
  - stdin: "barista\n9000\n8\n"
    note: 정확히 8시간
  - stdin: "barista\n15000\n0\n"
hints:
  - "배율은 직무에 따라 `if-elif-else`로 정하고, 초과 시간이 있을 때만 배율을 씁니다."
explanation: |
  '8시간을 넘게'는 8을 포함하지 않으므로 `hours > 8`입니다. 실수(배율)를 곱한 경우에만 결과가 `110000.0`처럼 실수로 출력되는 점도 지문의 예와 맞춰야 합니다.
