id: lab-w3-01-int-report
title: "[3주차 사전1~3] 정수 판별 리포트"
unit: lab
difficulty: 1
tags: [lab.w3, cond.if-elif, op.modulo]
statement: |
  > 엘리스 3주차 실습 사전문제 1~3(통과 여부, 홀짝, 양수·음수·0 판별)을 묶은 유형입니다.

  정수 하나를 입력받아 다음 세 줄을 출력하시오.

  1. 양수이면 `양수입니다.`, 음수이면 `음수입니다.`, 0이면 `0입니다.`
  2. 짝수이면 `짝수입니다.`, 홀수이면 `홀수입니다.`
  3. 5의 배수이면 `5의 배수입니다.`, 아니면 `5의 배수가 아닙니다.` (0도 5의 배수이다)

  - 입력 프롬프트: `정수를 입력하세요: `
starter: |
  n = int(input("정수를 입력하세요: "))
solution: |
  n = int(input("정수를 입력하세요: "))
  if n > 0:
      print("양수입니다.")
  elif n < 0:
      print("음수입니다.")
  else:
      print("0입니다.")
  if n % 2 == 0:
      print("짝수입니다.")
  else:
      print("홀수입니다.")
  if n % 5 == 0:
      print("5의 배수입니다.")
  else:
      print("5의 배수가 아닙니다.")
alt_solutions:
  - |
    n = int(input("정수를 입력하세요: "))
    if n == 0:
        sign = "0입니다."
    elif n > 0:
        sign = "양수입니다."
    else:
        sign = "음수입니다."
    print(sign)
    print("짝수입니다." if n % 2 == 0 else "홀수입니다.")
    print("5의 배수입니다." if n % 5 == 0 else "5의 배수가 아닙니다.")
mutants:
  - name: 0을 양수로 판단
    code: |
      n = int(input("정수를 입력하세요: "))
      if n >= 0:
          print("양수입니다.")
      else:
          print("음수입니다.")
      if n % 2 == 0:
          print("짝수입니다.")
      else:
          print("홀수입니다.")
      if n % 5 == 0:
          print("5의 배수입니다.")
      else:
          print("5의 배수가 아닙니다.")
  - name: 0을 5의 배수에서 뺌
    code: |
      n = int(input("정수를 입력하세요: "))
      if n > 0:
          print("양수입니다.")
      elif n < 0:
          print("음수입니다.")
      else:
          print("0입니다.")
      if n % 2 == 0:
          print("짝수입니다.")
      else:
          print("홀수입니다.")
      if n % 5 == 0 and n != 0:
          print("5의 배수입니다.")
      else:
          print("5의 배수가 아닙니다.")
tests:
  - stdin: "15\n"
    public: true
  - stdin: "-8\n"
  - stdin: "0\n"
  - stdin: "7\n"
  - stdin: "-25\n"
hints:
  - "세 경우(양수·음수·0)는 `if` / `elif` / `else`로 나눕니다."
explanation: |
  판별이 서로 독립적인 세 가지이므로 `if` 블록 세 개를 따로 씁니다. 하나의 `if-elif`로 묶으면 첫 조건만 출력되는 실수가 생깁니다.
