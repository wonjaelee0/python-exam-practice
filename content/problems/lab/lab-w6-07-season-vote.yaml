          if s in votes:
              votes[s] += 1
          else:
              print("잘못 입력했습니다")
      print()
      for season in votes:
          print(season, votes[season])
      if sum(votes.values()) == 0:
          print("투표가 없습니다")
      else:
          best = "봄"
          for season in votes:
              if votes[season] >= votes[best]:
                  best = season
          print(f"가장 인기 있는 계절: {best}")
tests:
  - stdin: "여름\n봄\n여름\n장마\n겨울\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 투표 없음
  - stdin: "가을\n가을\n봄\n봄\n종료\n"
    note: 봄과 가을이 동점
  - stdin: "겨울\nwinter\n종료\n"
hints:
  - "계절 4개를 0으로 미리 넣은 딕셔너리를 만들면 순서도 지켜지고 0표도 출력됩니다."
explanation: |
  센티넬 반복 + 딕셔너리 카운트의 기본형입니다. 처음부터 모든 키를 0으로 넣어 두면 '없는 키' 처리와 출력 순서 문제가 한 번에 해결됩니다.
