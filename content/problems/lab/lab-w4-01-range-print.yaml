tests:
  - stdin: "10\n"
    public: true
  - stdin: "1\n"
  - stdin: "4\n"
  - stdin: "15\n"
hints:
  - "홀수만 고르려면 `range(1, n + 1, 2)`처럼 간격을 2로 줍니다."
  - "줄 끝 공백 없이 이으려면 `\" \".join(문자열 리스트)`를 쓰거나, 끝에 붙은 공백을 `strip()`으로 지웁니다."
explanation: |
  `print(i, end=" ")`로 출력하면 줄 끝에 공백이 남습니다. 출력 형식이 '줄 끝 공백 없음'이면 `join`을 쓰는 것이 안전합니다.
