tests:
  - stdin: "100\n"
    public: true
  - stdin: "300\n"
    note: 기준과 같은 값
  - stdin: "1000\n"
    note: 해당 없음
  - stdin: "20\n"
hints:
  - "딕셔너리의 값이 리스트이므로, 계절 반복 안에 값 반복이 들어가는 중첩 반복입니다."
explanation: |
  `{키: 리스트}` 구조에서는 `for season in rain:` → `for v in rain[season]:`처럼 두 단계로 꺼냅니다. 조건에 맞는 값만 새 리스트에 모으는 '필터' 패턴도 함께 연습합니다.
