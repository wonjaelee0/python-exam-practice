tests:
  - stdin: "soccer\nTennis, baseball, SOCCER\nswimming,tennis\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 응답 없음
  - stdin: "a, b,\nB\n종료\n"
    note: 빈 항목 무시
  - stdin: "yoga\nYoga \n종료\n"
hints:
  - "`line.split(\",\")`로 나눈 뒤 각 항목에 `strip().lower()`를 하면 `,`와 `, `를 모두 처리할 수 있습니다."
explanation: |
  한 줄에 값이 여러 개인 센티넬 입력입니다. 바깥은 `while`(줄 단위), 안쪽은 `for`(항목 단위) 반복이 됩니다.
