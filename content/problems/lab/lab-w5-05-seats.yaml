tests:
  - stdin: "20\n"
    public: true
  - stdin: "4\n"
  - stdin: "12\n"
  - stdin: "40\n"
hints:
  - "`range(1, n + 1, 2)`는 1, 3, 5, … 홀수만 만듭니다. 절반 위치는 `len(seats) // 2`."
explanation: |
  리스트에는 문자열과 정수가 섞여 있을 수 있고, 출력하면 문자열에만 따옴표가 붙습니다. 슬라이싱 `[:k]`, `[k:]`는 겹치지 않게 리스트를 둘로 나눕니다.
