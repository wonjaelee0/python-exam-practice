id: lab-w5-07-vowel-star
title: "[5주차 5번] 모음을 *로 바꾸기"
unit: lab
difficulty: 2
tags: [lab.w5, str.iterate, str.build]
statement: |
  > 엘리스 5주차 실습 5번(소문자 모음 제거)과 같은 유형입니다.

  문장을 입력받아 모음(a, e, i, o, u — **대소문자 모두**)을 `*`로 바꾼 새 문자열과, 바꾼 글자 수를 출력하시오.
  원래 문장을 고치지 말고 새 문자열을 만들어 보자 (`for ch in 문자열` 또는 `for i in range(len(문자열))`).

  - 입력 프롬프트: `Input String: `
  - 출력: `Result: Th* b*rd w*tch*d th* c*rr*t.`, `Replaced: 7`
starter: |
  s = input("Input String: ")
  result = ""
solution: |
  s = input("Input String: ")
  result = ""
  count = 0
  for ch in s:
      if ch in "aeiouAEIOU":
          result += "*"
          count += 1
      else:
          result += ch
  print("Result:", result)
  print("Replaced:", count)
alt_solutions:
  - |
    s = input("Input String: ")
    result = ""
    count = 0
    for i in range(len(s)):
        if s[i].lower() in ["a", "e", "i", "o", "u"]:
            result = result + "*"
            count = count + 1
        else:
            result = result + s[i]
    print("Result: " + result)
    print("Replaced: " + str(count))
mutants:
  - name: 소문자 모음만 바꿈
    code: |
      s = input("Input String: ")
      result = ""
      count = 0
      for ch in s:
          if ch in "aeiou":
              result += "*"
              count += 1
          else:
              result += ch
      print("Result:", result)
      print("Replaced:", count)
  - name: 모음을 지워 버림
    code: |
      s = input("Input String: ")
      result = ""
      count = 0
      for ch in s:
          if ch in "aeiouAEIOU":
              count += 1
          else:
              result += ch
      print("Result:", result)
      print("Replaced:", count)
tests:
  - stdin: "The bird watched the carrot.\n"
    public: true
  - stdin: "AEIOU aeiou\n"
  - stdin: "Rhythm\n"
    note: 모음 없음
  - stdin: "Python Is Fun!\n"
hints:
  - "`if ch in \"aeiouAEIOU\":`처럼 문자열에 대한 `in`으로 모음인지 확인할 수 있습니다."
explanation: |
  문자열은 바꿀 수 없으므로(immutable) 새 문자열에 한 글자씩 이어 붙여 만듭니다. 대문자 모음도 바꿔야 하는지 지문을 꼭 확인하세요.
