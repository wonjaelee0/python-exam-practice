    public: true
  - stdin: "검색 Butter\n삭제 Butter\n정렬 내림\n종료\n"
    note: 없는 곡
  - stdin: "종료\n"
  - stdin: "춤추기\n추가 ETA\n삽입 0 Attention\n종료\n"
hints:
  - "`line.split(\" \", 1)`은 첫 공백에서 한 번만 나눠 `['추가', 'Super Shy']`를 만듭니다. 곡 이름의 공백이 보존됩니다."
  - "`remove`와 `index`는 없는 값에 쓰면 오류가 나므로 먼저 `in`으로 확인하세요."
explanation: |
  5주차 사전문제의 리스트 연산(append, insert, index, remove, sort)을 명령 처리 반복문 하나에 모았습니다. 명령을 잘라 해석하는 부분과 리스트를 바꾸는 부분을 나눠 생각하면 쉽습니다.
