hints:
  - "`random.seed(1)` 덕분에 매번 같은 주사위가 나옵니다. 합이 홀수인지는 `total % 2 == 1`."
explanation: |
  `random`을 쓰는 문제는 seed를 고정해야 채점할 수 있습니다 (제출 규칙 5번). seed가 같아도 `randint`를 **호출하는 횟수와 순서**가 다르면 결과가 달라지니, 지문이 말한 대로 두 번 호출하세요.
