id: lab-w7-08-lucky-func
title: "[7주차 5번] 행운 번호 코드를 함수로 (빈칸)"
unit: lab
difficulty: 3
tags: [lab.w7, func.refactor, random.seed]
format: fill
statement: |
  > 엘리스 7주차 실습 5번(로또 코드 함수화)과 같은 유형의 **코드 빈칸 채우기**입니다.

  5주차 행운 번호 맞히기 코드를 세 함수로 나눴다. 빈칸 `_____`을 채우시오. `random.seed(1)`은 지우지 말 것.

  - `draw_lucky(count, limit)`: 1~limit 사이의 서로 다른 수 count개를 뽑아 리스트로 반환 (`randint`를 반복 호출, 이미 뽑은 수면 건너뜀)
  - `get_user(count)`: `Enter a number between 1-20: `로 count번 입력받아 리스트로 반환
  - `print_result(user, lucky)`: 결과 출력 (O/X 줄 끝에 공백 하나 있음)

  ```
  =====Result=====
  3 O 7 X 9 O 12 X
  ================
  User number: [3, 7, 9, 12]
  Lucky number: [5, 19, 3, 9]
  Correct: 2
  ```
