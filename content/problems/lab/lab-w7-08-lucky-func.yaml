solution: |
  import random
  random.seed(1)


  def draw_lucky(count, limit):
      lucky = []
      while len(lucky) < count:
          n = random.randint(1, limit)
          if n not in lucky:
              lucky.append(n)
      return lucky


  def get_user(count):
      user = []
      for i in range(count):
          user.append(int(input("Enter a number between 1-20: ")))
      return user


  def print_result(user, lucky):
      correct = 0
      print("=====Result=====")
      for u in user:
          if u in lucky:
              print(u, "O", end=" ")
              correct += 1
          else:
              print(u, "X", end=" ")
      print()
      print("================")
      print("User number:", user)
      print("Lucky number:", lucky)
      print("Correct:", correct)


  lucky = draw_lucky(4, 20)
  user = get_user(4)
  print_result(user, lucky)
alt_solutions:
  - |
    import random
    random.seed(1)


    def draw_lucky(count, limit):
        lucky = []
        while len(lucky) != count:
            n = random.randint(1, limit)
            if not n in lucky:
                lucky = lucky + [n]
        return lucky


    def get_user(count):
        return [int(input("Enter a number between 1-20: ")) for i in range(count)]


    def print_result(user, lucky):
        line = ""
        correct = 0
        for u in user:
            if u in lucky:
                line += str(u) + " O "
                correct += 1
            else:
                line += str(u) + " X "
        print("=====Result=====")
        print(line)
        print("================")
        print("User number: " + str(user))
        print("Lucky number: " + str(lucky))
        print("Correct: " + str(correct))


    lucky = draw_lucky(4, 20)
    user = get_user(4)
    print_result(user, lucky)
