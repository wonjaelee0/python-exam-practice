              break
          if len(msg) > len(longest):
              longest = msg
      print()
      print(f"입력한 메시지 수: {count}")
      if count == 0:
          print("가장 긴 메시지: 없음")
      else:
          print(f"가장 긴 메시지: {longest}")
      print("프로그램을 종료합니다.")
  - name: 길이가 같으면 나중 메시지를 고름
    code: |
      count = 0
      longest = ""
      while True:
          msg = input("메시지를 입력하세요 ('끝' 입력 시 종료): ")
          if msg == "끝":
              break
          count += 1
          if len(msg) >= len(longest):
              longest = msg
      print()
      print(f"입력한 메시지 수: {count}")
      if count == 0:
          print("가장 긴 메시지: 없음")
      else:
          print(f"가장 긴 메시지: {longest}")
      print("프로그램을 종료합니다.")
tests:
  - stdin: "안녕\n반갑습니다\n잘가\n끝\n"
    public: true
  - stdin: "끝\n"
    note: 바로 끝남
  - stdin: "aa\nbb\ncc\n끝\n"
    note: 길이가 모두 같음
  - stdin: "하나\n둘셋넷다섯\n끝\n"
hints:
  - "`while True:` 안에서 입력을 받고, `끝`이면 `break`합니다. 개수는 `break` **뒤에서** 셉니다."
explanation: |
  센티넬(끝내는 값)은 데이터가 아니므로 세거나 처리하면 안 됩니다. 입력 → 끝 검사 → 처리 순서를 지키세요.
