id: lab-w7-03-menu-price
title: "[7주차 사전3] 메뉴 가격 검색 함수"
unit: lab
difficulty: 1
tags: [lab.w7, func.dict-arg, dict.lookup]
statement: |
  > 엘리스 7주차 실습 사전문제 3(딕셔너리 값 출력 함수)과 같은 유형입니다.

  카페 메뉴 딕셔너리 `menu`(시작 코드)를 인자로 받아, **함수 안에서** 메뉴명을 입력받고 가격을 출력하는 함수 `price_search(menu)`를 정의하고 호출하시오.

  - 메뉴가 있으면 `라떼 가격은 5000원입니다.`
  - 없으면 `해당 메뉴가 없습니다.`
  - 입력 프롬프트: `메뉴명: `
starter: |
  menu = {"아메리카노": 4500, "라떼": 5000, "모카": 5500, "스무디": 6000}
solution: |
  menu = {"아메리카노": 4500, "라떼": 5000, "모카": 5500, "스무디": 6000}


  def price_search(menu):
      name = input("메뉴명: ")
      if name in menu:
          print(f"{name} 가격은 {menu[name]}원입니다.")
      else:
          print("해당 메뉴가 없습니다.")


  price_search(menu)
alt_solutions:
  - |
    menu = {"아메리카노": 4500, "라떼": 5000, "모카": 5500, "스무디": 6000}


    def price_search(table):
        name = input("메뉴명: ")
        price = table.get(name)
        if price is None:
            print("해당 메뉴가 없습니다.")
        else:
            print(name + " 가격은 " + str(price) + "원입니다.")


    price_search(menu)
mutants:
  - name: 값(가격) 안에서 메뉴를 찾음
    code: |
      menu = {"아메리카노": 4500, "라떼": 5000, "모카": 5500, "스무디": 6000}


      def price_search(menu):
          name = input("메뉴명: ")
          if name in menu.values():
              print(f"{name} 가격은 {menu[name]}원입니다.")
          else:
              print("해당 메뉴가 없습니다.")


      price_search(menu)
  - name: 없는 메뉴를 확인하지 않음
    code: |
      menu = {"아메리카노": 4500, "라떼": 5000, "모카": 5500, "스무디": 6000}


      def price_search(menu):
          name = input("메뉴명: ")
          print(f"{name} 가격은 {menu.get(name)}원입니다.")


      price_search(menu)
tests:
  - stdin: "라떼\n"
    public: true
  - stdin: "녹차\n"
    note: 없는 메뉴
  - stdin: "아메리카노\n"
  - stdin: "스무디\n"
hints:
  - "`if name in menu:`는 키(메뉴명)를 검사합니다. 함수를 정의한 뒤 `price_search(menu)`로 꼭 호출하세요."
explanation: |
  딕셔너리를 함수에 넘기면 함수 안에서 그대로 조회할 수 있습니다. `menu.get(name)`은 없는 키에 `None`을 돌려주므로 따로 확인해야 합니다.
