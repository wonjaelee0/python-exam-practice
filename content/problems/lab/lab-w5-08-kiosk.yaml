hints:
  - "반복 조건을 `while len(orders) < 3:`으로 두면 취소로 개수가 줄었을 때 자동으로 더 입력받습니다."
  - "`orders.pop()`은 마지막 항목을 꺼내 돌려줍니다. 빈 리스트에서 `pop()`하면 오류가 납니다."
explanation: |
  '취소' 기능은 목록과 금액을 **둘 다** 되돌려야 합니다. 리스트(`append`/`pop`)와 누적 변수(`+=`/`-=`)가 항상 짝을 이루는지 확인하세요.
