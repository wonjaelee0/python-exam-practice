id: lab-w7-01-bye-three
title: "[7주차 사전1] 인사 함수 세 가지 (빈칸)"
unit: lab
difficulty: 1
tags: [lab.w7, func.param, func.return]
format: fill
statement: |
  > 엘리스 7주차 실습 사전문제 1-1~1-3(환영 메시지 함수: 입출력 위치)과 같은 유형의 **코드 빈칸 채우기**입니다.

  같은 작별 인사를 세 가지 방식의 함수로 만든다. 빈칸 `_____`을 채우시오.

  1. `bye_inside()`: 입력과 출력 모두 **함수 안에서**
  2. `bye_param(name)`: 입력은 함수 밖에서 받아 **인자로 전달**, 출력은 함수 안에서
  3. `bye_return(name)`: 입력·출력 모두 함수 밖에서, 함수는 인사 문자열을 **반환(return)**

  - 입력 프롬프트: `닉네임: ` (두 번 — 1번 함수 안에서 한 번, 함수 밖에서 한 번)
  - 출력 형식: `다음에 또 만나요, 지훈님!`
starter: |
  def bye_inside():
      name = input("닉네임: ")
      print(f"다음에 또 만나요, {name}님!")


  def bye_param(_____):
      print(f"다음에 또 만나요, {name}님!")


  def bye_return(name):
      _____ f"다음에 또 만나요, {name}님!"


  bye_inside()
  nick = input("닉네임: ")
  bye_param(_____)
  print(_____(nick))
solution: |
  def bye_inside():
      name = input("닉네임: ")
      print(f"다음에 또 만나요, {name}님!")


  def bye_param(name):
      print(f"다음에 또 만나요, {name}님!")


  def bye_return(name):
      return f"다음에 또 만나요, {name}님!"


  bye_inside()
  nick = input("닉네임: ")
  bye_param(nick)
  print(bye_return(nick))
alt_solutions:
  - |
    def bye_inside():
        name = input("닉네임: ")
        print("다음에 또 만나요, " + name + "님!")


    def bye_param(name):
        print("다음에 또 만나요, " + name + "님!")


    def bye_return(name):
        message = "다음에 또 만나요, " + name + "님!"
        return message


    bye_inside()
    nick = input("닉네임: ")
    bye_param(nick)
    result = bye_return(nick)
    print(result)
mutants:
  - name: 반환 대신 함수 안에서 출력
    code: |
