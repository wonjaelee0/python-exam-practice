      def bye_return(name):
          print(f"다음에 또 만나요, {name}님!")


      bye_inside()
      nick = input("닉네임: ")
      bye_param(nick)
      print(bye_return(nick))
  - name: 매개변수 대신 글자 name을 출력
    code: |
      def bye_inside():
          name = input("닉네임: ")
          print(f"다음에 또 만나요, {name}님!")


      def bye_param(name):
          print("다음에 또 만나요, name님!")


      def bye_return(name):
          return f"다음에 또 만나요, {name}님!"


      bye_inside()
      nick = input("닉네임: ")
      bye_param(nick)
      print(bye_return(nick))
tests:
  - stdin: "지훈\n서연\n"
    public: true
  - stdin: "A\nB\n"
  - stdin: "같은이름\n같은이름\n"
  - stdin: "Kim\n이\n"
hints:
  - "함수 밖의 값을 함수 안에서 쓰려면 매개변수로 받습니다: `def bye_param(name):`, 호출은 `bye_param(nick)`."
  - "반환하는 함수의 결과는 `print(bye_return(nick))`처럼 받아서 출력합니다."
explanation: |
  세 함수의 결과는 똑같아 보이지만 '입력·출력이 어디서 일어나는가'가 다릅니다. 반환형 함수가 출력까지 해 버리면, 받는 쪽의 `print`가 `None`을 한 번 더 출력합니다.
