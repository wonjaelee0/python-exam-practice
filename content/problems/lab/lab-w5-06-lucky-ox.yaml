explanation: |
  원 문제처럼 '맨 뒤 공백'까지 정확히 맞춰야 하는 출력은, 화면에서는 같아 보여도 채점에서 틀릴 수 있습니다. 이 사이트의 결과 비교에서 '줄 끝 공백' 판정을 확인해 보세요.
