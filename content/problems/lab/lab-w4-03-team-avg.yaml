tests:
  - stdin: "2\n100\n60\n40\n90\n75\n50\n"
    public: true
  - stdin: "1\n80\n80\n80\n"
  - stdin: "3\n70\n80\n90\n90\n80\n70\n60\n60\n60\n"
    note: 1팀과 2팀이 동점
  - stdin: "2\n0\n0\n1\n0\n0\n0\n"
hints:
  - "바깥 반복은 팀, 안쪽 반복은 팀원입니다. 팀의 합계(`total = 0`)는 바깥 반복 안에서 매번 새로 시작해야 합니다."
explanation: |
  중첩 반복에서 '누적 변수를 어디서 초기화하느냐'가 가장 흔한 실수입니다. 바깥 반복 밖에서 한 번만 0으로 두면 앞 팀 점수가 다음 팀에 더해집니다.
