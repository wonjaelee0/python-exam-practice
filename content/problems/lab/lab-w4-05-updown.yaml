id: lab-w4-05-updown
title: "[4주차 2번] 기회가 정해진 업다운 게임"
unit: lab
difficulty: 3
tags: [lab.w4, loop.while-true, random.seed]
statement: |
  > 엘리스 4주차 실습 2번(숫자 맞히기 게임)과 같은 유형입니다.

  1~50 사이의 정답 `answer`가 시작 코드에서 정해진다 (`random.seed(1)` — 지우지 말 것). 기회는 5번이다.

  - 첫 줄에 `Guess a number between 1-50 (5 chances)`를 출력한다.
  - 입력 프롬프트: `Enter a number: `
  - 1~50 밖의 수이면 `Out of range!`를 출력하고, **기회를 쓰지 않고** 다시 입력받는다.
  - 정답이면 `Correct! Total number of tries: 3`을 출력하고 끝낸다 (범위 밖 입력은 시도 횟수에 넣지 않는다).
  - 틀리면 정답이 더 작을 때 `Down!`, 더 클 때 `Up!`을 출력하고, 이어서
    - 기회가 남았으면 `Chances left: 4`
    - 기회를 다 썼으면 `Game over! The answer was 9.`(정답)를 출력하고 끝낸다.
starter: |
  import random
  random.seed(1)
  answer = random.randint(1, 50)
  ##############################
solution: |
  import random
  random.seed(1)
  answer = random.randint(1, 50)
  ##############################
  print("Guess a number between 1-50 (5 chances)")
  chances = 5
  tries = 0
  while chances > 0:
      guess = int(input("Enter a number: "))
      if guess < 1 or guess > 50:
          print("Out of range!")
          continue
      tries += 1
      chances -= 1
      if guess == answer:
          print(f"Correct! Total number of tries: {tries}")
          break
      if guess > answer:
          print("Down!")
      else:
          print("Up!")
      if chances == 0:
          print(f"Game over! The answer was {answer}.")
      else:
          print(f"Chances left: {chances}")
alt_solutions:
  - |
    import random
    random.seed(1)
    answer = random.randint(1, 50)
    print("Guess a number between 1-50 (5 chances)")
    used = 0
    while True:
        guess = int(input("Enter a number: "))
        if not 1 <= guess <= 50:
            print("Out of range!")
            continue
        used += 1
        if guess == answer:
            print("Correct! Total number of tries:", used)
            break
        print("Down!" if guess > answer else "Up!")
        if used == 5:
            print("Game over! The answer was " + str(answer) + ".")
            break
        print("Chances left:", 5 - used)
