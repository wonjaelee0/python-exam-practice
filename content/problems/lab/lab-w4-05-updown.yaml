tests:
  - stdin: "25\n12\n5\n9\n"
    public: true
  - stdin: "9\n"
  - stdin: "60\n1\n2\n3\n4\n5\n"
    note: 범위 밖 입력 후 기회를 모두 씀
  - stdin: "0\n50\n9\n"
hints:
  - "`continue`는 반복문의 처음으로 돌아갑니다. 범위 밖이면 기회를 줄이기 **전에** `continue`하세요."
explanation: |
  무한 반복(`while`) + `break`(정답) + `continue`(무효 입력)를 함께 쓰는 문제입니다. 어떤 경우에 횟수를 세는지 순서를 정확히 지키는 것이 핵심입니다.
