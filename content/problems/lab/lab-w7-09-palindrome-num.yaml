hints:
  - "새 결과 = 기존 결과 × 10 + 일의 자리(`n % 10`). 그다음 `n = n // 10`으로 일의 자리를 지웁니다."
explanation: |
  4주차 '각 자리 숫자의 합'과 같은 반복 구조에서, 더하는 대신 `× 10`으로 자리를 올리며 붙이는 것만 다릅니다. 이렇게 만든 함수를 다른 함수(`is_palindrome`)에서 재사용합니다.
