id: lab-w6-04-str-methods
title: "[6주차 사전4] 문자열 메서드 모음"
unit: lab
difficulty: 1
tags: [lab.w6, str.methods]
statement: |
  > 엘리스 6주차 실습 사전문제 4(문자열 메서드 활용하기)와 같은 유형입니다.

  문자열을 입력받아 아래 다섯 줄을 출력하시오.

  - `대문자: HELLO WORLD` (`upper()`)
  - `소문자: hello world` (`lower()`)
  - `단어 첫 글자 대문자: Hello World` (`title()`)
  - `대소문자 바꾸기: hELLO wORLD` (`swapcase()`)
  - `글자 수(공백 제외): 10`
  - 입력 프롬프트: `문자열 입력: `
starter: |
  s = input("문자열 입력: ")
solution: |
  s = input("문자열 입력: ")
  print("대문자:", s.upper())
  print("소문자:", s.lower())
  print("단어 첫 글자 대문자:", s.title())
  print("대소문자 바꾸기:", s.swapcase())
  print("글자 수(공백 제외):", len(s.replace(" ", "")))
alt_solutions:
  - |
    s = input("문자열 입력: ")
    count = 0
    for ch in s:
        if ch != " ":
            count += 1
    print(f"대문자: {s.upper()}")
    print(f"소문자: {s.lower()}")
    print(f"단어 첫 글자 대문자: {s.title()}")
    print(f"대소문자 바꾸기: {s.swapcase()}")
    print(f"글자 수(공백 제외): {count}")
mutants:
  - name: title 대신 capitalize
    code: |
      s = input("문자열 입력: ")
      print("대문자:", s.upper())
      print("소문자:", s.lower())
      print("단어 첫 글자 대문자:", s.capitalize())
      print("대소문자 바꾸기:", s.swapcase())
      print("글자 수(공백 제외):", len(s.replace(" ", "")))
  - name: 공백까지 글자 수에 셈
    code: |
      s = input("문자열 입력: ")
      print("대문자:", s.upper())
      print("소문자:", s.lower())
      print("단어 첫 글자 대문자:", s.title())
      print("대소문자 바꾸기:", s.swapcase())
      print("글자 수(공백 제외):", len(s))
tests:
  - stdin: "Hello World\n"
    public: true
  - stdin: "python PROGRAMMING is Fun\n"
  - stdin: "a\n"
  - stdin: "MiXeD cAsE 123\n"
hints:
  - "`capitalize()`는 문장 첫 글자만, `title()`은 단어마다 첫 글자를 대문자로 바꿉니다."
explanation: |
  문자열 메서드는 원래 문자열을 바꾸지 않고 **새 문자열을 반환**합니다. 공백을 뺀 길이는 `replace(" ", "")`로 공백을 지운 뒤 `len()`으로 구할 수 있습니다.
