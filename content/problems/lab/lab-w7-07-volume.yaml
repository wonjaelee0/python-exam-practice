tests:
  - stdin: "원기둥\n1\n2\n정육면체\n2\n"
    public: true
  - stdin: "정육면체\n3\n직육면체\n3\n3\n3\n"
    note: 부피가 같음
  - stdin: "직육면체\n2\n3\n4\n원기둥\n1\n1\n"
  - stdin: "원기둥\n2\n3\n원기둥\n3\n1\n"
hints:
  - "함수 안에서 모양에 따라 필요한 치수만 입력받고, 계산한 부피를 `return`합니다."
explanation: |
  부피 계산을 함수로 만들면 같은 코드를 두 번 쓰지 않고 `get_volume()`을 두 번 호출하면 됩니다. 정수와 실수(원기둥)가 섞이면 출력 형식(`8`과 `6.28…`)이 달라지는 점도 확인하세요.
