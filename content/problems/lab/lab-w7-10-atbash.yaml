hints:
  - "`src_str[::-1]`은 문자열을 거꾸로 뒤집습니다. 바꿀 글자는 `dst_str[src_str.index(ch)]`."
  - "소문자는 `upper()`로 바꿔 찾은 뒤 결과를 다시 `lower()`로 돌립니다."
explanation: |
  '위치(index)를 찾아 같은 위치의 다른 글자로 바꾸는' 방식은 카이사르·아트바시 같은 치환 암호의 공통 구조입니다. 두 문자열만 바꾸면 다른 암호가 됩니다.
