id: lab-w7-10-atbash
title: "[7주차 추가2] 아트바시 암호 (거울 치환)"
unit: lab
difficulty: 3
tags: [lab.w7, str.slicing, str.index, func.return]
statement: |
  > 엘리스 7주차 실습 추가 2번(카이사르 암호: ascii_uppercase, 슬라이싱, index, 함수화)과 같은 유형입니다.

  아트바시 암호는 알파벳을 거울처럼 뒤집어 바꾸는 치환 암호이다 (A↔Z, B↔Y, C↔X, …).

  1. `string` 모듈의 `ascii_uppercase`로 `src_str`을 만들고, **슬라이싱**으로 뒤집은 `dst_str`을 만들어 아래처럼 출력한다.
  2. 문자 하나를 받아 바뀐 문자를 **반환**하는 함수 `atbash_return(ch)`를 만든다. 대문자는 대문자로, 소문자는 소문자로 바꾸고(`index()` 활용), 알파벳이 아닌 문자는 그대로 반환한다.
  3. `문장을 입력하시오: `로 문장을 입력받아 암호화한 결과를 출력한다.

  ```
  src_str = ABCDEFGHIJKLMNOPQRSTUVWXYZ
  dst_str = ZYXWVUTSRQPONMLKJIHGFEDCBA
  문장을 입력하시오:
  SVOOL, DLIOW!
  ```
starter: |
  import string
solution: |
  import string

  src_str = string.ascii_uppercase
  dst_str = src_str[::-1]
  print("src_str =", src_str)
  print("dst_str =", dst_str)


  def atbash_return(ch):
      if ch in src_str:
          return dst_str[src_str.index(ch)]
      if ch.islower() and ch.upper() in src_str:
          return dst_str[src_str.index(ch.upper())].lower()
      return ch


  text = input("문장을 입력하시오: ")
  result = ""
  for ch in text:
      result += atbash_return(ch)
  print(result)
alt_solutions:
  - |
    import string

    src_str = string.ascii_uppercase
    dst_str = src_str[::-1]
    print("src_str = " + src_str)
    print("dst_str = " + dst_str)


    def atbash_return(ch):
        upper = ch.upper()
        if len(upper) == 1 and upper in src_str:
            new = dst_str[src_str.index(upper)]
            return new if ch.isupper() else new.lower()
        return ch


    text = input("문장을 입력하시오: ")
    print("".join([atbash_return(c) for c in text]))
