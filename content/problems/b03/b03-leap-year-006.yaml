id: b03-leap-year-006
title: 윤년 판별
unit: b03
difficulty: 2
tags: [cond.logic-and-or, op.mod]
statement: |
  연도를 입력받아 윤년인지 평년인지 출력하시오.

  - 윤년: 4로 나누어떨어지면서 100으로 나누어떨어지지 않는 해, 또는 400으로 나누어떨어지는 해
  - 입력 프롬프트: `연도: `
  - 출력 형식: `2024년은 윤년입니다.` 또는 `2023년은 평년입니다.`
starter: |
  year = int(input("연도: "))
solution: |
  year = int(input("연도: "))
  if (year % 4 == 0 and year % 100 != 0) or year % 400 == 0:
      print(f"{year}년은 윤년입니다.")
  else:
      print(f"{year}년은 평년입니다.")
alt_solutions:
  - |
    year = int(input("연도: "))
    leap = False
    if year % 400 == 0:
        leap = True
    elif year % 100 == 0:
        leap = False
    elif year % 4 == 0:
        leap = True
    if leap:
        print(str(year) + "년은 윤년입니다.")
    else:
        print(str(year) + "년은 평년입니다.")
mutants:
  - name: 4의 배수만 확인
    code: |
      year = int(input("연도: "))
      if year % 4 == 0:
          print(f"{year}년은 윤년입니다.")
      else:
          print(f"{year}년은 평년입니다.")
  - name: 400 조건 누락
    code: |
      year = int(input("연도: "))
      if year % 4 == 0 and year % 100 != 0:
          print(f"{year}년은 윤년입니다.")
      else:
          print(f"{year}년은 평년입니다.")
tests:
  - stdin: "2024\n"
    public: true
  - stdin: "2023\n"
  - stdin: "1900\n"
    note: 100의 배수지만 400의 배수가 아님
  - stdin: "2000\n"
    note: 400의 배수
  - stdin: "2100\n"
  - stdin: "2400\n"
hints:
  - "`and`가 `or`보다 먼저 계산되지만, 괄호로 묶으면 읽기 쉽습니다."
  - "1900년은 평년, 2000년은 윤년입니다."
explanation: |
  `(4의 배수 and 100의 배수 아님) or 400의 배수`. 연산자 우선순위는 `not > and > or`입니다.
