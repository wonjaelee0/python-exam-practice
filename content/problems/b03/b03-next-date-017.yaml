tests:
  - stdin: "2024\n2\n28\n"
    public: true
  - stdin: "2023\n2\n28\n"
    note: 평년 2월 28일 → 3월 1일
  - stdin: "2023\n2\n29\n"
    note: 평년에는 2월 29일이 없음
  - stdin: "1900\n2\n29\n"
    note: 1900년은 평년
  - stdin: "2000\n2\n29\n"
    note: 2000년은 윤년
  - stdin: "2025\n12\n31\n"
    note: 해가 바뀜
  - stdin: "2025\n4\n31\n"
  - stdin: "2025\n13\n1\n"
  - stdin: "2025\n6\n30\n"
hints:
  - "먼저 그 달의 마지막 날(`last`)을 구하면 날짜 검사와 다음 날 계산을 모두 그 값으로 할 수 있습니다."
  - "다음 날은 '일 + 1 → 넘치면 월 + 1 → 넘치면 연 + 1' 순서로 올립니다."
explanation: |
  조건이 많을 때는 '마지막 날 구하기 → 검사 → 올림' 단계로 나누면 실수가 줄어듭니다. 경계값(2월 29일, 12월 31일, 1900·2000년)을 꼭 확인하세요.
