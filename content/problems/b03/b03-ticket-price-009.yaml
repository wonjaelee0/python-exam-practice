tests:
  - stdin: "15\n9\n"
    public: true
  - stdin: "7\n3\n"
    note: 8세 미만 무료
  - stdin: "13\n10\n"
    note: 경계 — 13세, 10명
  - stdin: "65\n1\n"
  - stdin: "64\n12\n"
  - stdin: "19\n2\n"
hints:
  - "낮은 나이부터 `if age < 8 → elif age <= 13 → …` 순서로 검사하면 각 구간의 아래쪽 조건을 다시 쓸 필요가 없습니다."
  - "'10명 이상'은 `count >= 10`입니다."
explanation: |
  구간을 나눌 때 경계값(13, 19, 64, 10명)이 어느 쪽에 속하는지가 가장 많이 틀리는 부분입니다.
