          price = 6000
      total = price * count
      print(f"1인 요금: {price}원")
      if count >= 10:
          total = total * 90 // 100
          print("단체 할인이 적용되었습니다")
      print(f"총 요금: {total}원")
  - name: 10명 초과일 때만 할인
    code: |
      age = int(input("나이: "))
      count = int(input("인원: "))
      if age < 8:
          price = 0
      elif age <= 13:
          price = 5000
