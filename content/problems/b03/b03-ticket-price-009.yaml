id: b03-ticket-price-009
title: 나이별 입장료와 단체 할인
unit: b03
difficulty: 2
tags: [cond.elif-order, cond.boundary, op.floordiv]
statement: |
  나이와 인원(같은 나이대 일행의 수)을 입력받아 1인 요금과 총 요금을 출력하시오.

  | 나이 | 1인 요금 |
  |---|---|
  | 8세 미만 | 0원 |
  | 8세 이상 13세 이하 | 5000원 |
  | 14세 이상 19세 이하 | 8000원 |
  | 20세 이상 64세 이하 | 12000원 |
  | 65세 이상 | 6000원 |

  - 인원이 10명 이상이면 총 요금에서 10% 할인한다: `총액 * 90 // 100`
  - 입력 프롬프트: `나이: `, `인원: `
  - 출력 형식
    - `1인 요금: 8000원`
    - (할인이 적용될 때만) `단체 할인이 적용되었습니다`
    - `총 요금: 72000원`
starter: |
  age = int(input("나이: "))
  count = int(input("인원: "))
solution: |
  age = int(input("나이: "))
  count = int(input("인원: "))
  if age < 8:
      price = 0
  elif age <= 13:
      price = 5000
  elif age <= 19:
      price = 8000
  elif age <= 64:
      price = 12000
  else:
      price = 6000
  total = price * count
  print(f"1인 요금: {price}원")
  if count >= 10:
      total = total * 90 // 100
      print("단체 할인이 적용되었습니다")
  print(f"총 요금: {total}원")
alt_solutions:
  - |
    age = int(input("나이: "))
    count = int(input("인원: "))
    if age >= 65:
        price = 6000
    elif age >= 20:
        price = 12000
    elif age >= 14:
        price = 8000
    elif age >= 8:
        price = 5000
    else:
        price = 0
    print("1인 요금: " + str(price) + "원")
    total = price * count
    if count >= 10:
        print("단체 할인이 적용되었습니다")
        total = total * 9 // 10
    print("총 요금: " + str(total) + "원")
mutants:
