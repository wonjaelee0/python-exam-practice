      d2 = random.randint(1, 6)
      if guess != "홀" and guess != "짝":
          print("잘못된 입력입니다.")
      else:
          total = d1 + d2
          print(f"주사위: {d1}, {d2}")
          print(f"합: {total}")
          if total % 2 == 0:
              answer = "홀"
          else:
              answer = "짝"
          if guess == answer:
              print("정답입니다!")
          else:
              print("틀렸습니다.")
  - name: 잘못된 입력 검사에 or 사용
    code: |
      import random
      random.seed(1)
      guess = input("홀 또는 짝: ")
      d1 = random.randint(1, 6)
      d2 = random.randint(1, 6)
      if guess != "홀" or guess != "짝":
          print("잘못된 입력입니다.")
      else:
          print(f"주사위: {d1}, {d2}")
tests:
  - stdin: "홀\n"
    public: true
  - stdin: "짝\n"
  - stdin: "하나\n"
    note: 홀/짝이 아닌 입력
  - stdin: "홀수\n"
    note: '정확히 "홀"이어야 한다'
hints:
  - "시드를 고정하면 매번 같은 순서로 난수가 나옵니다. 시험에서도 `random.seed(1)`은 꼭 넣으세요."
  - "'홀도 아니고 짝도 아니다'는 `guess != \"홀\" and guess != \"짝\"`입니다. `or`를 쓰면 항상 참이 돼요."
explanation: |
  `random.seed(1)` 이후의 `randint` 결과는 항상 같으므로 출력이 정해집니다.
  `A가 아니고 B도 아니다`는 `and`로 묶어야 합니다 (드모르간 법칙).
