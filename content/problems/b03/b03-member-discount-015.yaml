id: b03-member-discount-015
title: 구매 금액별 할인과 회원 추가 할인
unit: b03
difficulty: 2
tags: [cond.elif-order, op.floordiv, io.fstring]
statement: |
  구매 금액(정수)과 회원 여부를 입력받아 할인율, 할인 금액, 결제 금액을 출력하시오.

  - 할인율: 50000원 이상 10%, 30000원 이상 5%, 그 외 0%
  - 회원 여부가 `Y`이면 할인율에 2%를 더한다. (`Y`가 아니면 모두 비회원으로 본다)
  - 할인 금액 = 구매 금액 × 할인율 // 100 (정수 연산)
  - 입력 프롬프트: `구매 금액: `, `회원 여부(Y/N): `
  - 출력 형식: `할인율: 12%`, `할인 금액: 6000원`, `결제 금액: 44000원`
starter: |
  amount = int(input("구매 금액: "))
  member = input("회원 여부(Y/N): ")
solution: |
  amount = int(input("구매 금액: "))
  member = input("회원 여부(Y/N): ")
  if amount >= 50000:
      rate = 10
  elif amount >= 30000:
      rate = 5
  else:
      rate = 0
  if member == "Y":
      rate += 2
  discount = amount * rate // 100
  print(f"할인율: {rate}%")
  print(f"할인 금액: {discount}원")
  print(f"결제 금액: {amount - discount}원")
alt_solutions:
  - |
    amount = int(input("구매 금액: "))
    member = input("회원 여부(Y/N): ")
    rate = 0
    if amount >= 30000:
        rate = 5
    if amount >= 50000:
        rate = 10
    if member == "Y":
        rate = rate + 2
    discount = amount * rate // 100
    print("할인율: " + str(rate) + "%")
    print("할인 금액: " + str(discount) + "원")
    print("결제 금액: " + str(amount - discount) + "원")
mutants:
  - name: 회원 할인을 elif로 (할인 구간이면 무시)
    code: |
      amount = int(input("구매 금액: "))
      member = input("회원 여부(Y/N): ")
      if amount >= 50000:
          rate = 10
      elif amount >= 30000:
          rate = 5
      elif member == "Y":
          rate = 2
      else:
          rate = 0
      discount = amount * rate // 100
      print(f"할인율: {rate}%")
      print(f"할인 금액: {discount}원")
      print(f"결제 금액: {amount - discount}원")
  - name: 실수 나눗셈으로 할인 금액
    code: |
      amount = int(input("구매 금액: "))
      member = input("회원 여부(Y/N): ")
      if amount >= 50000:
          rate = 10
      elif amount >= 30000:
          rate = 5
      else:
          rate = 0
      if member == "Y":
          rate += 2
      discount = amount * rate / 100
      print(f"할인율: {rate}%")
      print(f"할인 금액: {discount}원")
      print(f"결제 금액: {amount - discount}원")
tests:
  - stdin: "50000\nY\n"
    public: true
  - stdin: "30000\nN\n"
  - stdin: "29999\nY\n"
    note: 회원 할인만 2%
  - stdin: "100000\nN\n"
  - stdin: "45000\ny\n"
    note: 소문자 y는 회원이 아님
  - stdin: "35000\nY\n"
    note: 5% + 회원 2% = 7%
hints:
  - "금액 구간 할인과 회원 할인은 서로 독립이므로 `if`를 따로 씁니다."
  - "`%` 기호를 출력하려면 f-string 안에 그냥 `%`를 쓰면 됩니다: `f\"할인율: {rate}%\"`"
explanation: |
  할인율을 먼저 정하고(구간별 `if-elif`), 회원이면 별도의 `if`로 더합니다. 정수 연산 `//`로 원 단위를 맞춥니다.
