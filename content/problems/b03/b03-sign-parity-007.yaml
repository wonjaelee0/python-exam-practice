id: b03-sign-parity-007
title: 양수·음수·0과 짝홀 (중첩 if)
unit: b03
difficulty: 1
tags: [cond.nested-if, cond.elif-order, op.mod]
statement: |
  정수 n을 입력받아 첫째 줄에 부호를, 0이 아니면 둘째 줄에 짝홀을 출력하시오.

  - 첫째 줄: `양수입니다`, `음수입니다`, `0입니다` 중 하나
  - 둘째 줄 (n이 0이 아닐 때만): `짝수입니다` 또는 `홀수입니다`
  - 입력 프롬프트: `정수: `
starter: |
  n = int(input("정수: "))
solution: |
  n = int(input("정수: "))
  if n > 0:
      print("양수입니다")
  elif n < 0:
      print("음수입니다")
  else:
      print("0입니다")
  if n != 0:
      if n % 2 == 0:
          print("짝수입니다")
      else:
          print("홀수입니다")
alt_solutions:
  - |
    n = int(input("정수: "))
    if n == 0:
        print("0입니다")
    else:
        if n > 0:
            print("양수입니다")
        else:
            print("음수입니다")
        if n % 2 == 1:
            print("홀수입니다")
        else:
            print("짝수입니다")
mutants:
  - name: 0을 양수로 처리
    code: |
      n = int(input("정수: "))
      if n >= 0:
          print("양수입니다")
      else:
          print("음수입니다")
      if n % 2 == 0:
          print("짝수입니다")
      else:
          print("홀수입니다")
  - name: 0일 때도 짝홀 출력
    code: |
      n = int(input("정수: "))
      if n > 0:
          print("양수입니다")
      elif n < 0:
          print("음수입니다")
      else:
          print("0입니다")
      if n % 2 == 0:
          print("짝수입니다")
      else:
          print("홀수입니다")
tests:
  - stdin: "5\n"
    public: true
  - stdin: "-4\n"
  - stdin: "0\n"
    note: 0이면 한 줄만
  - stdin: "12\n"
  - stdin: "-7\n"
hints:
  - "0인지 아닌지를 먼저 나누고, 0이 아닐 때 안쪽에서 다시 짝홀을 판단하면 중첩 if가 됩니다."
explanation: |
  조건문 안에 조건문을 넣으면(중첩 if) '앞 조건이 참일 때만' 다음 조건을 검사할 수 있습니다.
