tests:
  - stdin: "민수 지우 서연 하늘\n92 78 85 90\n85\n"
    public: true
  - stdin: "가람 나래\n10 20\n30\n"
    note: 대상자 없음
  - stdin: "솔\n50\n50\n"
  - stdin: "x y z\n0 0 0\n0\n"
hints:
  - "`zip(names, scores)`로 같은 위치끼리 묶고, `enumerate(목록, 1)`로 1부터 번호를 붙입니다."
explanation: |
  두 리스트를 인덱스로 맞추는 대신 zip으로 묶으면 실수가 줄어듭니다. `enumerate`의 두 번째 인자는 시작 번호입니다.
