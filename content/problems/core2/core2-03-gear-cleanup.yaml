tests:
  - stdin: "카메라 삼각대 조명 마이크\n5 2 2 7\n5\n"
    public: true
  - stdin: "a b c\n1 1 1\n1\n"
    note: 모두 같은 횟수
  - stdin: "드론\n9\n3\n"
    note: 해당 없음
  - stdin: "펜 공책 자 풀\n0 3 0 3\n3\n"
hints:
  - "`sorted(목록, key=lambda x: (기준1, 기준2))`로 여러 기준을 줄 수 있습니다."
  - "숫자 오름차순 + 문자열 내림차순을 함께 하려면, 숫자에 `-`를 붙인 키로 `reverse=True` 정렬하거나, 안정 정렬을 두 번(이름 역순 → 횟수 순) 하면 됩니다."
explanation: |
  문자열은 `-`를 붙일 수 없어서 '숫자는 오름차순, 문자열은 내림차순'이 까다롭습니다.
  `key=lambda x: (-x[1], x[0])`로 **전체를 뒤집어** 정렬하거나, 파이썬 정렬이 안정적이라는 점을 이용해 보조 기준부터 두 번 정렬합니다.
