hints:
- '`zip(names, stocks, sold)`로 세 리스트를 한 번에 묶을 수 있습니다.'
- 정렬 키를 튜플 `(남은 재고, 이름)`으로 주면 두 기준이 차례로 적용됩니다.
explanation: |
  여러 리스트의 같은 위치를 묶을 때는 `zip`, 번호를 붙일 때는 `enumerate(…, 1)`, 여러 기준 정렬은 튜플 키를 씁니다.
