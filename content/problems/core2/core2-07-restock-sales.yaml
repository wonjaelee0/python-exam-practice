id: core2-07-restock-sales
title: '[2주차 응용2] 판매 후 재입고 목록'
unit: core2
difficulty: 3
tags:
- core.w2
- zip
- sorted.key
- enumerate
statement: |
  > 컴퓨팅 핵심 2주차 도전문제 2(축제 매점 재입고 목록)를 응용한 문제입니다.

  상품명, 처음 재고, 판매 수량을 각각 한 줄로 입력받는다. 같은 위치끼리 묶어 **남은 재고 = 처음 재고 − 판매 수량**을 구하고,
  남은 재고가 기준 **미만**인 상품만 재입고 목록에 넣으시오.

  - 정렬: 남은 재고가 **적은 순서**, 같으면 상품명 **오름차순**
  - 입력 프롬프트: `상품명을 입력하세요: `, `재고 수량을 입력하세요: `, `판매 수량을 입력하세요: `, `재입고 기준을 입력하세요: `
  - 출력: `1. 생수: 남은 0개 (부족 4개)` 형식 (부족 = 기준 − 남은 재고). 대상이 없으면 `재입고할 상품이 없습니다.`
  - 조건: 세 줄의 개수는 같고 1개 이상이다. 상품명은 공백 없이 서로 다르며, 판매 수량은 처음 재고 이하이다.
starter: |
  names = input("상품명을 입력하세요: ").split()
  stocks = list(map(int, input("재고 수량을 입력하세요: ").split()))
  sold = list(map(int, input("판매 수량을 입력하세요: ").split()))
  limit = int(input("재입고 기준을 입력하세요: "))
solution: |
  names = input("상품명을 입력하세요: ").split()
  stocks = list(map(int, input("재고 수량을 입력하세요: ").split()))
  sold = list(map(int, input("판매 수량을 입력하세요: ").split()))
  limit = int(input("재입고 기준을 입력하세요: "))
  left = [(name, s - k) for name, s, k in zip(names, stocks, sold)]
  need = [item for item in left if item[1] < limit]
  need = sorted(need, key=lambda x: (x[1], x[0]))
  if need:
      for i, (name, remain) in enumerate(need, 1):
          print(f"{i}. {name}: 남은 {remain}개 (부족 {limit - remain}개)")
  else:
      print("재입고할 상품이 없습니다.")
alt_solutions:
- |
  names = input("상품명을 입력하세요: ").split()
  stocks = [int(x) for x in input("재고 수량을 입력하세요: ").split()]
  sold = [int(x) for x in input("판매 수량을 입력하세요: ").split()]
  limit = int(input("재입고 기준을 입력하세요: "))
  need = []
  for i in range(len(names)):
      remain = stocks[i] - sold[i]
      if remain < limit:
          need.append([remain, names[i]])
  need.sort()
  if len(need) == 0:
      print("재입고할 상품이 없습니다.")
  no = 1
  for remain, name in need:
      print(str(no) + ". " + name + ": 남은 " + str(remain) + "개 (부족 " + str(limit - remain) + "개)")
      no += 1
