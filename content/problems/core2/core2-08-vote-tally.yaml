hints:
- '`counts[title] = counts.get(title, 0) + 1`로 개수를 셉니다.'
- 표 수 내림차순 + 이름 오름차순은 키 `(-표수, 이름)`으로 한 번에 정렬할 수 있습니다.
explanation: |
  딕셔너리로 개수를 센 뒤 `items()`로 (이름, 개수) 쌍을 꺼내 거르고 정렬합니다. 숫자 키에 `-`를 붙이면 그 기준만 내림차순이 됩니다.
