explanation: |
  함수는 문제를 발견하면 `raise`로 알리고, 출력은 함수를 부른 쪽의 `try-except`가 담당합니다. 이렇게 하면 함수는 순서표 만들기에만 집중할 수 있습니다.
  팀이 0개이고 번호가 1개인 입력은 두 조건에 모두 걸리므로, 어느 검사를 먼저 하느냐에 따라 출력이 달라집니다.
