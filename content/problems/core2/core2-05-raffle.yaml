tests:
  - stdin: "하늘 바다 별\n3 9 5\n"
    public: true
  - stdin: "a b c\n2 7 2\n"
    note: 같은 번호는 입력 순서
  - stdin: "\n\n"
    note: 이름 없음
  - stdin: "a b\n1\n"
    note: 개수가 다름
  - stdin: "solo\n0\n"
hints:
  - "`sorted(..., key=lambda x: x[1], reverse=True)`는 번호 내림차순이면서, 같은 번호끼리는 원래 순서를 유지합니다 (안정 정렬)."
  - "`raise ValueError(\"메시지\")`로 예외를 만들고, `except ValueError as e:`에서 `e`를 출력하면 메시지가 나옵니다."
explanation: |
  `reverse=True`는 '정렬 후 뒤집기'와 다릅니다. 파이썬의 `reverse=True` 정렬은 같은 키를 가진 항목의 원래 순서를 그대로 둡니다.
  검사는 함수 안에서 하고, 안내 출력은 함수 밖에서 하는 구조가 원 문제의 핵심입니다.
