id: b06-word-chain-025
title: 끝말잇기 규칙 검사
unit: b06
difficulty: 4
tags: [loop.while-sentinel, str.index, list.in]
statement: |
  끝말잇기 단어를 한 줄에 하나씩 입력받으며 규칙을 검사하시오. 규칙은 아래 순서대로 검사한다.

  1. 두 글자 이상이어야 한다. → 어기면 이유 `한 글자 단어`
  2. 첫 단어가 아니면, 바로 앞 단어의 마지막 글자로 시작해야 한다. → `끝말이 이어지지 않음`
  3. 앞에서 나온 단어를 다시 쓸 수 없다. → `이미 나온 단어`

  - 규칙을 어긴 단어가 나오면 `3번째 단어 '기차'에서 탈락: 끝말이 이어지지 않음` 형식으로 출력하고 즉시 끝낸다 (더 입력받지 않는다).
  - `종료`가 입력될 때까지 모두 통과하면 `성공: 4개 단어`를 출력한다.
  - 입력 프롬프트: `단어: `
starter: |
  used = []
solution: |
  used = []
  while True:
      word = input("단어: ")
      if word == "종료":
          print(f"성공: {len(used)}개 단어")
          break
      n = len(used) + 1
      reason = ""
      if len(word) < 2:
          reason = "한 글자 단어"
      elif len(used) > 0 and word[0] != used[-1][-1]:
          reason = "끝말이 이어지지 않음"
      elif word in used:
          reason = "이미 나온 단어"
      if reason != "":
          print(f"{n}번째 단어 '{word}'에서 탈락: {reason}")
          break
      used.append(word)
alt_solutions:
  - |
    words = []
    count = 0
    while True:
        w = input("단어: ")
        if w == "종료":
            print("성공: " + str(count) + "개 단어")
            break
        count += 1
        if len(w) == 1:
            print(str(count) + "번째 단어 '" + w + "'에서 탈락: 한 글자 단어")
            break
        if count > 1 and words[count - 2][len(words[count - 2]) - 1] != w[0]:
            print(str(count) + "번째 단어 '" + w + "'에서 탈락: 끝말이 이어지지 않음")
            break
        if words.count(w) > 0:
            print(str(count) + "번째 단어 '" + w + "'에서 탈락: 이미 나온 단어")
            break
        words.append(w)
