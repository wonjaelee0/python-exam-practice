tests:
  - stdin: "사과\n과자\n자전거\n거미\n종료\n"
    public: true
  - stdin: "기차\n차표\n기차\n종료\n"
    note: 중복이면서 끝말도 안 이어짐 → 끝말 규칙을 먼저 검사
  - stdin: "종료\n"
    note: 단어 0개
  - stdin: "바나나\n나\n"
    note: 한 글자 단어
  - stdin: "토마토\n토마토\n"
    note: 끝말은 맞지만 이미 나온 단어
hints:
  - "앞 단어의 마지막 글자는 `used[-1][-1]`, 지금 단어의 첫 글자는 `word[0]`입니다."
  - "검사 순서가 출력(이유)을 바꿉니다. 지문의 순서대로 `if-elif`를 쓰세요."
explanation: |
  탈락하면 `break`로 바로 끝내야 이후 입력을 받지 않습니다. 몇 번째 단어인지는 '지금까지 통과한 단어 수 + 1'입니다.
