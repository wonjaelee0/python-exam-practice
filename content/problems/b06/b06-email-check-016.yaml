id: b06-email-check-016
title: 이메일 주소 나누기와 검사
unit: b06
difficulty: 2
tags: [str.find, str.split, str.count]
statement: |
  이메일 주소를 입력받아 아이디와 도메인으로 나누어 출력하시오.

  - 올바른 이메일의 조건: `@`가 정확히 1개이고, 아이디(`@` 앞)가 비어 있지 않으며, 도메인(`@` 뒤)에 `.`이 있다.
  - 올바르면 `아이디: user`, `도메인: example.com` 두 줄을 출력한다.
  - 올바르지 않으면 `올바르지 않은 이메일입니다` 한 줄만 출력한다.
  - 앞뒤 공백은 지우고 검사한다.
  - 입력 프롬프트: `이메일: `
starter: |
  email = input("이메일: ").strip()
solution: |
  email = input("이메일: ").strip()
  if email.count("@") != 1:
      print("올바르지 않은 이메일입니다")
  else:
      user, domain = email.split("@")
      if user == "" or domain.find(".") == -1:
          print("올바르지 않은 이메일입니다")
      else:
          print(f"아이디: {user}")
          print(f"도메인: {domain}")
alt_solutions:
  - |
    email = input("이메일: ").strip()
    at = email.find("@")
    ok = email.count("@") == 1 and at > 0 and "." in email[at + 1:]
    if ok:
        print("아이디:", email[:at])
        print("도메인:", email[at + 1:])
    else:
        print("올바르지 않은 이메일입니다")
mutants:
  - name: '@ 개수를 확인하지 않음'
    code: |
      email = input("이메일: ").strip()
      at = email.find("@")
      if at <= 0 or "." not in email[at + 1:]:
          print("올바르지 않은 이메일입니다")
      else:
          print(f"아이디: {email[:at]}")
          print(f"도메인: {email[at + 1:]}")
  - name: strip 하지 않음
    code: |
      email = input("이메일: ")
      if email.count("@") != 1:
          print("올바르지 않은 이메일입니다")
      else:
          user, domain = email.split("@")
          if user == "" or domain.find(".") == -1:
              print("올바르지 않은 이메일입니다")
          else:
              print(f"아이디: {user}")
              print(f"도메인: {domain}")
tests:
  - stdin: "user@example.com\n"
    public: true
  - stdin: "  snu.student@mail.snu.ac.kr  \n"
    note: 앞뒤 공백
  - stdin: "no-at-sign.com\n"
  - stdin: "a@b@c.com\n"
    note: '@가 두 개'
  - stdin: "@domain.com\n"
    note: 아이디가 비어 있음
  - stdin: "me@localhost\n"
    note: 도메인에 점이 없음
hints:
  - "`count(\"@\")`로 개수를 확인하고, `split(\"@\")`로 나눕니다."
  - "`find()`는 찾지 못하면 -1을 돌려줍니다. `index()`는 오류가 나요."
explanation: |
  검사 순서를 정하는 것이 중요합니다. `@`가 정확히 하나일 때만 `split`으로 두 부분을 안전하게 나눌 수 있습니다.
