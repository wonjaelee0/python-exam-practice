tests:
  - stdin: "독서\n운동, 독서\nGame,game\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 아무도 입력하지 않으면 제목 줄만
  - stdin: "  요리 ,  요리\n요리\n종료\n"
  - stdin: "Music, MUSIC, music\nart\n종료\n"
hints:
  - "한 줄을 `split(\",\")`로 나누고 각 조각에 `strip().lower()`를 적용하세요."
  - "개수는 `counts.get(취미, 0) + 1`로 셉니다."
explanation: |
  입력 반복(`종료`) + 문자열 정제(split·strip·lower) + 딕셔너리 카운트가 합쳐진, 실습 시험에 자주 나오는 형태입니다.
