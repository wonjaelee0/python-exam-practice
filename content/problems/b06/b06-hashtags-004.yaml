id: b06-hashtags-004
title: 해시태그 정리하기
unit: b06
difficulty: 3
tags: [str.clean-pipeline, str.join, list.in]
statement: |
  게시글 한 줄을 입력받아 해시태그를 정리하시오.

  - 공백으로 나눈 단어 중 `#`으로 시작하는 것만 태그로 본다.
  - 태그 맨 앞의 `#`을 떼고 모두 소문자로 바꾼다. `#`만 있어서 내용이 비는 태그는 버린다.
  - 같은 태그는 처음 나온 것만 남긴다 (순서 유지).
  - 입력 프롬프트: `게시글: `
  - 출력 형식
    - `태그: python, data, ai` (태그를 `, `로 이어 붙인다)
    - `개수: 3`
  - 태그가 하나도 없으면 `태그 없음` 한 줄만 출력한다.
starter: |
  text = input("게시글: ")
  tags = []
solution: |
  text = input("게시글: ")
  tags = []
  for word in text.split():
      if word[0] == "#":
          tag = word[1:].lower()
          if tag != "" and tag not in tags:
              tags.append(tag)
  if len(tags) == 0:
      print("태그 없음")
  else:
      print("태그: " + ", ".join(tags))
      print(f"개수: {len(tags)}")
alt_solutions:
  - |
    text = input("게시글: ")
    tags = []
    for word in text.split():
        if word.find("#") == 0 and len(word) > 1:
            t = word.replace("#", "", 1).lower()
            if t not in tags:
                tags.append(t)
    if tags:
        print("태그:", ", ".join(tags))
        print("개수:", len(tags))
    else:
        print("태그 없음")
mutants:
  - name: 소문자로 바꾸지 않음
    code: |
      text = input("게시글: ")
      tags = []
      for word in text.split():
          if word[0] == "#":
              tag = word[1:]
              if tag != "" and tag not in tags:
                  tags.append(tag)
      if len(tags) == 0:
          print("태그 없음")
      else:
          print("태그: " + ", ".join(tags))
          print(f"개수: {len(tags)}")
  - name: 쉼표 뒤 공백 없이 연결
    code: |
      text = input("게시글: ")
      tags = []
      for word in text.split():
          if word[0] == "#":
              tag = word[1:].lower()
              if tag != "" and tag not in tags:
                  tags.append(tag)
      if len(tags) == 0:
          print("태그 없음")
      else:
          print("태그: " + ",".join(tags))
          print(f"개수: {len(tags)}")
tests:
  - stdin: "오늘 #Python 공부 #DATA #python #AI\n"
    public: true
  - stdin: "태그가 없는 글\n"
    note: 태그 없음
  - stdin: "# #가 #가 #나\n"
    note: '#만 있는 단어는 버린다'
  - stdin: "#A #a #B\n"
    note: 소문자로 바꾸면 같은 태그
  - stdin: "#x\n"
hints:
  - "`word[0] == \"#\"`로 첫 글자를 확인하고, `word[1:]`로 나머지를 꺼냅니다."
  - "`\", \".join(리스트)`는 원소 사이에 `, `를 넣어 하나의 문자열로 만듭니다."
explanation: |
  문자열 정제는 '나누기(split) → 고르기 → 바꾸기(lower) → 중복 제거 → 합치기(join)' 순서로 생각하면 쉽습니다.
