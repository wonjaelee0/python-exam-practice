tests:
  - stdin: "Python is fun.\nI like cats, not dogs!\nPYTHON python everywhere?\n끝\npython\ncats\njava\n종료\n"
    public: true
  - stdin: "끝\nhello\n종료\n"
    note: 문장이 하나도 없음
  - stdin: "a b a\nb\n끝\nA\nB\n종료\n"
    note: 검색어도 소문자로 바꿔 찾고 출력
  - stdin: "Hi! hi, HI.\n끝\nhi\n종료\n"
hints:
  - "단어 → 줄 번호 **집합** 딕셔너리를 만들면 한 줄에 여러 번 나와도 번호가 한 번만 들어갑니다."
  - "입력이 두 단계(문장 → 검색어)이고 끝내는 단어가 서로 다릅니다 (`끝`, `종료`)."
explanation: |
  검색 엔진이 쓰는 '역색인'의 축소판입니다. `setdefault(단어, set()).add(번호)`로 만들고, 출력할 때 `sorted()`로 정렬합니다.
