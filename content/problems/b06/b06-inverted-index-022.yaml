id: b06-inverted-index-022
title: 단어가 나온 줄 번호 찾기 (역색인)
unit: b06
difficulty: 5
tags: [dict.set-values, loop.while-sentinel, str.clean-pipeline]
statement: |
  문장을 한 줄에 하나씩 `끝`이 입력될 때까지 입력받는다. 첫 문장이 1번 줄이다.
  각 문장은 `,.!?`를 지우고 소문자로 바꾼 뒤 공백으로 나눠 단어로 본다.

  그다음 검색어를 `종료`가 입력될 때까지 입력받아, 검색어(소문자로 바꾼 것)가 나온 줄 번호를 출력하시오.

  - 입력 프롬프트: 문장은 `문장: `, 검색어는 `검색: `
  - 출력 형식: `python: [1, 3]` (오름차순, 한 줄에 여러 번 나와도 한 번만), 없으면 `python: 없음`
  - 출력할 때 검색어는 소문자로 바꾼 형태로 쓴다.
starter: |
  index = {}
  line_no = 0
solution: |
  index = {}
  line_no = 0
  while True:
      line = input("문장: ")
      if line == "끝":
          break
      line_no += 1
      for mark in ",.!?":
          line = line.replace(mark, "")
      for w in line.lower().split():
          index.setdefault(w, set()).add(line_no)
  while True:
      q = input("검색: ")
      if q == "종료":
          break
      key = q.lower()
      if key in index:
          print(f"{key}: {sorted(index[key])}")
      else:
          print(f"{key}: 없음")
alt_solutions:
  - |
    lines = []
    s = input("문장: ")
    while s != "끝":
        for mark in ",.!?":
            s = s.replace(mark, "")
        lines.append(s.lower().split())
        s = input("문장: ")
    q = input("검색: ")
    while q != "종료":
        key = q.lower()
        found = []
        for i in range(len(lines)):
            if key in lines[i]:
                found.append(i + 1)
        if found:
            print(key + ":", found)
        else:
            print(key + ": 없음")
        q = input("검색: ")
