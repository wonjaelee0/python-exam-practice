tests:
  - stdin: "Python is fun, Python is easy. I love Python!\n"
    public: true
  - stdin: "Hello hello HELLO\n"
    note: 대소문자를 합쳐서 센다
  - stdin: "a b c\n"
    note: 모두 한 번 → 먼저 나온 a
  - stdin: "Is it ok? It is, it is.\n"
hints:
  - "`for mark in \",.!?\":` 로 문장부호를 하나씩 `replace(mark, \"\")` 하세요."
  - "`counts[w] = counts.get(w, 0) + 1`로 개수를 셉니다."
explanation: |
  문자열 정제(지우기 → 소문자 → 나누기) 후 딕셔너리로 셉니다. 딕셔너리는 넣은 순서를 기억하므로 처음 나온 순서로 출력됩니다.
