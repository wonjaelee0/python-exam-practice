tests:
  - stdin: "6\n"
    public: true
  - stdin: "1\n"
    note: 처음부터 1
  - stdin: "27\n"
    note: 아주 길어지는 수
  - stdin: "19\n"
    note: 18과 19가 모두 20단계 → 작은 수 18
  - stdin: "100\n"
hints:
  - "수열은 리스트에 모아 두면 `\" -> \".join(...)`, `max()`, 길이로 단계 수를 쉽게 구할 수 있습니다."
  - "'가장 긴 수'는 1부터 n까지 하나씩 단계 수를 세는 이중 반복문입니다."
explanation: |
  `x // 2`를 써야 정수가 유지됩니다(`/`는 실수). 단계 수는 '바꾼 횟수'이므로 수열 길이 − 1입니다.
