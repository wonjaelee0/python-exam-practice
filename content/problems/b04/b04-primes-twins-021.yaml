tests:
  - stdin: "10\n20\n"
    public: true
  - stdin: "24\n28\n"
    note: 소수가 없음
  - stdin: "2\n10\n"
    note: (3, 5)와 (5, 7)
  - stdin: "20\n50\n"
    note: 25, 49 같은 제곱수 주의
  - stdin: "2\n2\n"
  - stdin: "1990\n2000\n"
hints:
  - "n이 소수인지는 2부터 √n까지(`d * d <= n`) 나누어떨어지는지 보면 됩니다. 나누어떨어지면 `break`."
  - "쌍둥이 소수는 연속한 두 소수의 차가 2인 경우입니다."
explanation: |
  `d * d <= n`까지만 검사해도 충분합니다 (약수는 짝을 이루므로). `<`로 쓰면 25 = 5 × 5 같은 제곱수를 놓칩니다.
