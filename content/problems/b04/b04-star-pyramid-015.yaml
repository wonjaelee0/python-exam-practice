id: b04-star-pyramid-015
title: 별 피라미드
unit: b04
difficulty: 3
tags: [loop.nested, str.repeat]
statement: |
  1 이상의 정수 n을 입력받아 n줄짜리 별 피라미드를 출력하시오.

  - i번째 줄(i = 1, …, n): 공백 `n - i`개 다음에 별 `2 × i - 1`개
  - 줄 끝에는 공백을 출력하지 않는다.
  - 입력 프롬프트: `높이: `

  n이 3일 때 프롬프트 다음에 출력되는 피라미드:
  ```
    *
   ***
  *****
  ```
starter: |
  n = int(input("높이: "))
solution: |
  n = int(input("높이: "))
  for i in range(1, n + 1):
      print(" " * (n - i) + "*" * (2 * i - 1))
alt_solutions:
  - |
    n = int(input("높이: "))
    for i in range(n):
        line = ""
        for j in range(n - 1 - i):
            line += " "
        for j in range(2 * i + 1):
            line += "*"
        print(line)
mutants:
  - name: 별 개수를 i개로
    code: |
      n = int(input("높이: "))
      for i in range(1, n + 1):
          print(" " * (n - i) + "*" * i)
  - name: 오른쪽에도 공백을 채움
    code: |
      n = int(input("높이: "))
      for i in range(1, n + 1):
          print(" " * (n - i) + "*" * (2 * i - 1) + " " * (n - i))
tests:
  - stdin: "3\n"
    public: true
  - stdin: "1\n"
  - stdin: "5\n"
  - stdin: "2\n"
hints:
  - "줄마다 공백은 1개씩 줄고, 별은 2개씩 늘어납니다."
  - "i번째 줄의 별 개수: 1, 3, 5, … → `2 * i - 1`"
explanation: |
  줄 번호 i로 공백 수와 별 수를 식으로 나타내는 것이 별 찍기 문제의 핵심입니다.
