id: b04-digit-sum-008
title: 자릿수의 개수와 합 (while)
unit: b04
difficulty: 2
tags: [loop.while, op.floordiv, op.mod]
statement: |
  0 이상의 정수 n을 입력받아 n의 자릿수 개수와 각 자리 숫자의 합을 출력하시오.
  문자열로 바꾸지 말고 `while`과 `//`, `%`로 구한다. (0은 한 자리 수이고 합은 0이다)

  - 입력 프롬프트: `정수: `
  - 출력 형식: `자릿수: 4`, `각 자리 합: 10`
starter: |
  n = int(input("정수: "))
solution: |
  n = int(input("정수: "))
  count = 0
  total = 0
  if n == 0:
      count = 1
  while n > 0:
      total += n % 10
      n //= 10
      count += 1
  print(f"자릿수: {count}")
  print(f"각 자리 합: {total}")
alt_solutions:
  - |
    s = input("정수: ")
    print("자릿수:", len(s))
    total = 0
    for ch in s:
        total += int(ch)
    print("각 자리 합:", total)
mutants:
  - name: 0을 0자리로 셈
    code: |
      n = int(input("정수: "))
      count = 0
      total = 0
      while n > 0:
          total += n % 10
          n //= 10
          count += 1
      print(f"자릿수: {count}")
      print(f"각 자리 합: {total}")
  - name: 맨 앞자리를 빠뜨림 (n >= 10)
    code: |
      n = int(input("정수: "))
      count = 0
      total = 0
      if n == 0:
          count = 1
      while n >= 10:
          total += n % 10
          n //= 10
          count += 1
      print(f"자릿수: {count}")
      print(f"각 자리 합: {total}")
tests:
  - stdin: "1234\n"
    public: true
  - stdin: "0\n"
    note: 0은 한 자리
  - stdin: "7\n"
  - stdin: "1000\n"
    note: 중간에 0이 있는 수
  - stdin: "98765\n"
hints:
  - "`n % 10`은 일의 자리, `n //= 10`은 일의 자리를 없앱니다. n이 0이 될 때까지 반복하세요."
  - "0은 반복문이 한 번도 돌지 않으므로 따로 처리해야 합니다."
explanation: |
  `n % 10`으로 끝자리를 꺼내고 `n //= 10`으로 지우는 것을 반복하면 모든 자리를 볼 수 있습니다.
