id: b04-divisors-prime-004
title: 약수 출력과 소수 판별
unit: b04
difficulty: 3
tags: [loop.for-range, op.mod, loop.count]
statement: |
  자연수 n을 입력받아 n의 약수를 작은 수부터 출력하고, n이 소수인지 판별하시오.

  - 입력 프롬프트: `자연수: `
  - 첫째 줄: `약수: ` 다음에 약수를 공백 하나로 구분해 출력 (예: `약수: 1 2 5 10`)
  - 둘째 줄: 소수이면 `소수입니다.`, 아니면 `소수가 아닙니다.`
  - 소수는 약수가 1과 자기 자신뿐인 수이며, 1은 소수가 아니다.
starter: |
  n = int(input("자연수: "))
solution: |
  n = int(input("자연수: "))
  divisors = ""
  count = 0
  for i in range(1, n + 1):
      if n % i == 0:
          divisors += " " + str(i)
          count += 1
  print("약수:" + divisors)
  if count == 2:
      print("소수입니다.")
  else:
      print("소수가 아닙니다.")
alt_solutions:
  - |
    n = int(input("자연수: "))
    ds = [i for i in range(1, n + 1) if n % i == 0]
    print("약수:", " ".join(map(str, ds)))
    if len(ds) == 2:
        print("소수입니다.")
    else:
        print("소수가 아닙니다.")
mutants:
  - name: 1을 소수로 판단
    code: |
      n = int(input("자연수: "))
      divisors = ""
      count = 0
      for i in range(1, n + 1):
          if n % i == 0:
              divisors += " " + str(i)
              count += 1
      print("약수:" + divisors)
      if count <= 2:
          print("소수입니다.")
      else:
          print("소수가 아닙니다.")
  - name: 자기 자신을 빠뜨림 (range 끝값)
    code: |
      n = int(input("자연수: "))
      divisors = ""
      count = 0
      for i in range(1, n):
          if n % i == 0:
              divisors += " " + str(i)
              count += 1
      print("약수:" + divisors)
      if count == 1:
          print("소수입니다.")
      else:
          print("소수가 아닙니다.")
tests:
  - stdin: "10\n"
    public: true
  - stdin: "1\n"
    note: 1은 소수가 아니다
  - stdin: "2\n"
    note: 가장 작은 소수
  - stdin: "13\n"
  - stdin: "36\n"
    note: 제곱수
  - stdin: "97\n"
hints:
  - "`n % i == 0`이면 i는 n의 약수입니다. 1부터 n까지 확인하세요 (`range(1, n + 1)`)."
  - "약수의 개수가 정확히 2개이면 소수입니다."
explanation: |
  약수를 세면서 문자열에 이어 붙이고, 개수가 2이면 소수로 판단합니다. 1은 약수가 1개라서 소수가 아닙니다.
