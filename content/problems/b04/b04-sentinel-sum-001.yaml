id: b04-sentinel-sum-001
title: "'종료'가 나올 때까지 합계와 평균"
unit: b04
difficulty: 3
tags: [loop.while-sentinel, io.input-cast, io.fstring-format]
format: write
style: elice-main
statement: |
  정수를 한 줄에 하나씩 입력받다가 `종료`가 입력되면 멈추고, 입력된 정수의 개수·합계·평균을 출력하시오.

  - 입력 프롬프트: `숫자 또는 종료: ` (매번 같은 프롬프트)
  - `종료`는 개수에 포함하지 않는다.
  - 출력 형식
    - `개수: n`
    - `합계: s`
    - `평균: x` (소수점 첫째 자리까지, 예: `20.0`)
  - 정수를 하나도 입력하지 않고 `종료`하면 `입력된 숫자가 없습니다.` 한 줄만 출력한다.
starter: |
  # while True와 break를 사용해 보세요
solution: |
  count = 0
  total = 0
  while True:
      data = input("숫자 또는 종료: ")
      if data == "종료":
          break
      total += int(data)
      count += 1
  if count == 0:
      print("입력된 숫자가 없습니다.")
  else:
      print(f"개수: {count}")
      print(f"합계: {total}")
      print(f"평균: {total / count:.1f}")
alt_solutions:
  - |
    nums = []
    data = input("숫자 또는 종료: ")
    while data != "종료":
        nums.append(int(data))
        data = input("숫자 또는 종료: ")
    if len(nums) == 0:
        print("입력된 숫자가 없습니다.")
    else:
        print("개수:", len(nums))
        print("합계:", sum(nums))
        print("평균:", format(sum(nums) / len(nums), ".1f"))
mutants:
  - name: 숫자가 없을 때 처리 누락 (0으로 나누기)
    code: |
      count = 0
      total = 0
      while True:
          data = input("숫자 또는 종료: ")
          if data == "종료":
              break
          total += int(data)
          count += 1
      print(f"개수: {count}")
      print(f"합계: {total}")
      print(f"평균: {total / count:.1f}")
  - name: 평균을 몫(//)으로 계산
    code: |
      count = 0
      total = 0
      while True:
          data = input("숫자 또는 종료: ")
          if data == "종료":
              break
          total += int(data)
          count += 1
      if count == 0:
          print("입력된 숫자가 없습니다.")
      else:
          print(f"개수: {count}")
          print(f"합계: {total}")
          print(f"평균: {total // count:.1f}")
tests:
  - stdin: "10\n20\n30\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 숫자 없이 바로 종료
  - stdin: "1\n2\n3\n4\n종료\n"
    note: 평균 2.5
  - stdin: "-5\n6\n종료\n"
    note: 음수 포함, 평균 0.5
  - stdin: "7\n종료\n"
hints:
  - 몇 번 입력받을지 모르므로 `while True:`로 반복하고 `종료`가 들어오면 `break` 합니다.
  - "`종료`인지 먼저 확인한 다음에 `int()`로 바꾸세요. 순서가 바뀌면 ValueError가 납니다."
  - "소수점 첫째 자리까지는 f-string의 `:.1f`를 씁니다."
explanation: |
  `while True` + `break` 패턴으로 센티넬(`종료`)이 나올 때까지 입력을 받습니다.
  숫자를 하나도 받지 못했을 때 평균을 계산하면 0으로 나누게 되므로 먼저 개수를 확인합니다.
