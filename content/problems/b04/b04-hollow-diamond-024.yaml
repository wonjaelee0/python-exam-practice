id: b04-hollow-diamond-024
title: 속이 빈 다이아몬드
unit: b04
difficulty: 4
tags: [loop.nested, str.repeat, cond.if-else]
statement: |
  1 이상의 정수 n을 입력받아 2n-1줄짜리 **속이 빈** 다이아몬드를 출력하시오.

  - 가운데 줄(n번째 줄)이 가장 넓고, 너비는 위아래로 2씩 줄어든다 (꽉 찬 다이아몬드와 같은 모양).
  - 각 줄에는 테두리의 별만 찍는다. 너비가 1인 줄은 별 하나, 그 외에는 `*` + 공백 + `*`
  - 줄 끝에는 공백이 없어야 한다.
  - 입력 프롬프트: `크기: `

  n이 3일 때 프롬프트 다음에 출력되는 다이아몬드:
  ```
    *
   * *
  *   *
   * *
    *
  ```
starter: |
  n = int(input("크기: "))
solution: |
  n = int(input("크기: "))
  for k in range(2 * n - 1):
      d = n - 1 - k
      if d < 0:
          d = -d
      width = 2 * (n - d) - 1
      if width == 1:
          print(" " * d + "*")
      else:
          print(" " * d + "*" + " " * (width - 2) + "*")
alt_solutions:
  - |
    n = int(input("크기: "))
    rows = []
    for i in range(1, n + 1):
        if i == 1:
            rows.append(" " * (n - 1) + "*")
        else:
            rows.append(" " * (n - i) + "*" + " " * (2 * i - 3) + "*")
    for row in rows:
        print(row)
    for row in rows[-2::-1]:
        print(row)
mutants:
  - name: 꽉 찬 다이아몬드
    code: |
      n = int(input("크기: "))
      for i in range(1, n + 1):
          print(" " * (n - i) + "*" * (2 * i - 1))
      for i in range(n - 1, 0, -1):
          print(" " * (n - i) + "*" * (2 * i - 1))
  - name: 오른쪽 별 뒤에 공백을 채움
    code: |
      n = int(input("크기: "))
      for k in range(2 * n - 1):
          d = abs(n - 1 - k)
          width = 2 * (n - d) - 1
          if width == 1:
              print(" " * d + "*" + " " * d)
          else:
              print(" " * d + "*" + " " * (width - 2) + "*" + " " * d)
tests:
  - stdin: "3\n"
    public: true
  - stdin: "1\n"
  - stdin: "2\n"
  - stdin: "5\n"
hints:
  - "k번째 줄(0부터)의 왼쪽 공백은 가운데 줄과의 거리 `|n - 1 - k|`입니다."
  - "너비가 w인 줄의 가운데 공백은 `w - 2`칸입니다."
explanation: |
  위·아래를 따로 만들어도 되지만, '가운데 줄과의 거리'로 공백과 너비를 한 식으로 표현하면 반복문 하나로 끝납니다.
