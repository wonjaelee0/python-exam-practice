id: b04-sentinel-maxmin-019
title: "'종료'까지 입력받아 최댓값과 최솟값"
unit: b04
difficulty: 3
tags: [loop.while-sentinel, loop.max-min]
statement: |
  정수를 한 줄에 하나씩 입력받다가 `종료`가 입력되면 멈추고, 입력된 정수 중 최댓값과 최솟값을 출력하시오.
  리스트를 쓰지 않고 변수만으로 구해 보자.

  - 입력 프롬프트: `정수 또는 종료: `
  - 출력 형식: `최댓값: 9`, `최솟값: -2`
  - 정수가 하나도 없으면 `입력된 정수가 없습니다` 한 줄만 출력한다.
starter: |
  # 첫 번째 정수를 최댓값·최솟값의 시작값으로 쓰세요
solution: |
  largest = None
  smallest = None
  while True:
      data = input("정수 또는 종료: ")
      if data == "종료":
          break
      n = int(data)
      if largest is None or n > largest:
          largest = n
      if smallest is None or n < smallest:
          smallest = n
  if largest is None:
      print("입력된 정수가 없습니다")
  else:
      print(f"최댓값: {largest}")
      print(f"최솟값: {smallest}")
alt_solutions:
  - |
    nums = []
    while True:
        data = input("정수 또는 종료: ")
        if data == "종료":
            break
        nums.append(int(data))
    if len(nums) == 0:
        print("입력된 정수가 없습니다")
    else:
        print("최댓값:", max(nums))
        print("최솟값:", min(nums))
mutants:
  - name: 최댓값 시작값을 0으로 (음수만 입력되면 틀림)
    code: |
      largest = 0
      smallest = 0
      count = 0
      while True:
          data = input("정수 또는 종료: ")
          if data == "종료":
              break
          n = int(data)
          count += 1
          if n > largest:
              largest = n
          if n < smallest:
              smallest = n
      if count == 0:
          print("입력된 정수가 없습니다")
      else:
          print(f"최댓값: {largest}")
          print(f"최솟값: {smallest}")
  - name: 문자열 그대로 비교
    code: |
      largest = None
      smallest = None
      while True:
          data = input("정수 또는 종료: ")
          if data == "종료":
              break
          if largest is None or data > largest:
              largest = data
          if smallest is None or data < smallest:
              smallest = data
      if largest is None:
          print("입력된 정수가 없습니다")
      else:
          print(f"최댓값: {largest}")
          print(f"최솟값: {smallest}")
tests:
  - stdin: "3\n9\n-2\n5\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "-7\n-3\n-9\n종료\n"
    note: 음수만
  - stdin: "42\n종료\n"
  - stdin: "10\n9\n100\n종료\n"
    note: 문자열로 비교하면 '9'가 가장 큼
hints:
  - "첫 번째 값을 받기 전에는 비교할 값이 없습니다. `None`으로 시작하거나, 첫 값으로 최댓값·최솟값을 초기화하세요."
  - "최댓값을 0으로 시작하면 음수만 입력될 때 틀립니다."
explanation: |
  최댓값·최솟값의 시작값은 '첫 번째 입력값'이어야 안전합니다. `None`과 `is None` 검사로 첫 값을 구별할 수 있습니다.
