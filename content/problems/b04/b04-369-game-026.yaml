id: b04-369-game-026
title: 369 게임
unit: b04
difficulty: 3
tags: [loop.nested, op.mod, str.repeat]
statement: |
  1부터 n까지 369 게임을 진행하시오. 숫자에 3, 6, 9가 들어 있으면 그 **개수만큼** `짝`을 붙여 출력하고 (예: 13 → `짝`, 33 → `짝짝`, 369 → `짝짝짝`),
  하나도 없으면 숫자를 그대로 출력한다. 한 줄에 하나씩 출력한다.

  - 마지막 줄: `박수 횟수: 4` (출력한 `짝`의 총 개수)
  - 문자열로 바꾸지 말고 `% 10`, `// 10`으로 각 자리를 확인해 보자.
  - 입력 프롬프트: `n: `
starter: |
  n = int(input("n: "))
solution: |
  n = int(input("n: "))
  claps = 0
  for k in range(1, n + 1):
      count = 0
      x = k
      while x > 0:
          digit = x % 10
          if digit == 3 or digit == 6 or digit == 9:
              count += 1
          x = x // 10
      if count > 0:
          print("짝" * count)
          claps += count
      else:
          print(k)
  print(f"박수 횟수: {claps}")
alt_solutions:
  - |
    n = int(input("n: "))
    total = 0
    for k in range(1, n + 1):
        s = str(k)
        c = s.count("3") + s.count("6") + s.count("9")
        total += c
        if c:
            print("짝" * c)
        else:
            print(k)
    print("박수 횟수:", total)
mutants:
  - name: 3의 배수 자릿수로 판단 (0도 포함)
    code: |
      n = int(input("n: "))
      claps = 0
      for k in range(1, n + 1):
          count = 0
          x = k
          while x > 0:
              if x % 10 % 3 == 0:
                  count += 1
              x = x // 10
          if count > 0:
              print("짝" * count)
              claps += count
          else:
              print(k)
      print(f"박수 횟수: {claps}")
  - name: 일의 자리만 확인
    code: |
      n = int(input("n: "))
      claps = 0
      for k in range(1, n + 1):
          d = k % 10
          if d == 3 or d == 6 or d == 9:
              print("짝")
              claps += 1
          else:
              print(k)
      print(f"박수 횟수: {claps}")
tests:
  - stdin: "10\n"
    public: true
  - stdin: "1\n"
  - stdin: "36\n"
    note: 33, 36은 짝짝
  - stdin: "40\n"
    note: 30~39는 모두 짝이 하나 이상
hints:
  - "`x % 10`으로 일의 자리를 보고 `x //= 10`으로 지우는 것을 x가 0이 될 때까지 반복합니다."
  - "`\"짝\" * 2`는 `\"짝짝\"`입니다."
explanation: |
  자릿수 검사는 '끝자리 확인 → 끝자리 지우기' 반복이 기본입니다. 0도 3으로 나누어떨어지므로 `% 3 == 0`으로 검사하면 10, 20이 짝이 되는 실수가 납니다.
