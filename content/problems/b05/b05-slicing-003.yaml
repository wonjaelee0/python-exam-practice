id: b05-slicing-003
title: 슬라이싱 네 가지
unit: b05
difficulty: 2
tags: [list.slice, io.split-map]
statement: |
  공백으로 구분된 정수(3개 이상)를 입력받아 리스트로 만든 뒤, **슬라이싱**으로 다음을 출력하시오. 리스트는 그대로 출력한다.

  - 입력 프롬프트: `정수들: `
  - 출력 형식 (네 줄)
    - `앞 3개: [1, 2, 3]`
    - `뒤 2개: [5, 6]`
    - `거꾸로: [6, 5, 4, 3, 2, 1]`
    - `짝수 인덱스: [1, 3, 5]` (인덱스 0, 2, 4, …의 원소)
starter: |
  nums = list(map(int, input("정수들: ").split()))
solution: |
  nums = list(map(int, input("정수들: ").split()))
  print(f"앞 3개: {nums[:3]}")
  print(f"뒤 2개: {nums[-2:]}")
  print(f"거꾸로: {nums[::-1]}")
  print(f"짝수 인덱스: {nums[::2]}")
alt_solutions:
  - |
    nums = [int(x) for x in input("정수들: ").split()]
    n = len(nums)
    rev = []
    even = []
    for i in range(n):
        rev.append(nums[n - 1 - i])
        if i % 2 == 0:
            even.append(nums[i])
    print("앞 3개:", nums[0:3])
    print("뒤 2개:", nums[n - 2:n])
    print("거꾸로:", rev)
    print("짝수 인덱스:", even)
mutants:
  - name: 앞 3개를 [1:4]로
    code: |
      nums = list(map(int, input("정수들: ").split()))
      print(f"앞 3개: {nums[1:4]}")
      print(f"뒤 2개: {nums[-2:]}")
      print(f"거꾸로: {nums[::-1]}")
      print(f"짝수 인덱스: {nums[::2]}")
  - name: 홀수 인덱스를 고름
    code: |
      nums = list(map(int, input("정수들: ").split()))
      print(f"앞 3개: {nums[:3]}")
      print(f"뒤 2개: {nums[-2:]}")
      print(f"거꾸로: {nums[::-1]}")
      print(f"짝수 인덱스: {nums[1::2]}")
tests:
  - stdin: "1 2 3 4 5 6\n"
    public: true
  - stdin: "10 20 30\n"
    note: 원소가 3개
  - stdin: "5 4 3 2 1 0 -1\n"
  - stdin: "7 7 8 9\n"
hints:
  - "`리스트[시작:끝:간격]` — 시작·끝을 생략하면 처음·끝까지입니다."
  - "`[::-1]`은 거꾸로, `[::2]`는 하나 건너 하나, `[-2:]`는 뒤에서 두 개입니다."
explanation: |
  슬라이싱은 새 리스트를 만듭니다. 음수 인덱스는 뒤에서부터 셉니다 (`-1`이 마지막 원소).
