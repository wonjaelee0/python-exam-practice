id: b05-pascal-024
title: 파스칼의 삼각형
unit: b05
difficulty: 4
tags: [list.2d, list.append, str.join]
statement: |
  1 이상 15 이하의 정수 n을 입력받아 파스칼의 삼각형을 n줄 출력하시오.

  - 첫 줄은 `1`, 각 줄의 양 끝은 1이고, 가운데 수는 바로 위 줄에서 왼쪽 위와 오른쪽 위의 두 수를 더한 값이다.
  - 수는 공백 하나로 구분하고 왼쪽에 붙여 출력한다 (줄 끝 공백 없음).
  - 입력 프롬프트: `줄 수: `

  n이 5일 때 프롬프트 다음 출력:
  ```
  1
  1 1
  1 2 1
  1 3 3 1
  1 4 6 4 1
  ```
starter: |
  n = int(input("줄 수: "))
  row = [1]
solution: |
  n = int(input("줄 수: "))
  row = [1]
  for i in range(n):
      print(" ".join([str(x) for x in row]))
      nxt = [1]
      for k in range(len(row) - 1):
          nxt.append(row[k] + row[k + 1])
      nxt.append(1)
      row = nxt
alt_solutions:
  - |
    n = int(input("줄 수: "))
    for i in range(n):
        value = 1
        parts = []
        for k in range(i + 1):
            parts.append(str(value))
            value = value * (i - k) // (k + 1)
        print(" ".join(parts))
mutants:
  - name: 마지막 1을 붙이지 않음
    code: |
      n = int(input("줄 수: "))
      row = [1]
      for i in range(n):
          print(" ".join([str(x) for x in row]))
          nxt = [1]
          for k in range(len(row) - 1):
              nxt.append(row[k] + row[k + 1])
          row = nxt
  - name: 리스트 모양 그대로 출력
    code: |
      n = int(input("줄 수: "))
      row = [1]
      for i in range(n):
          print(row)
          row = [1] + [row[k] + row[k + 1] for k in range(len(row) - 1)] + [1]
tests:
  - stdin: "5\n"
    public: true
  - stdin: "1\n"
  - stdin: "2\n"
  - stdin: "10\n"
  - stdin: "15\n"
hints:
  - "다음 줄 = `[1]` + (이웃한 두 수의 합들) + `[1]`"
explanation: |
  지난 줄 리스트로 다음 줄 리스트를 만드는 점화식 문제입니다. `" ".join(...)`은 문자열 리스트에만 쓸 수 있으니 `str()`로 바꿔야 합니다.
