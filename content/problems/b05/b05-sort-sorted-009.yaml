id: b05-sort-sorted-009
title: sorted와 sort의 차이
unit: b05
difficulty: 2
tags: [list.sort, list.sorted]
statement: |
  공백으로 구분된 정수들을 입력받아 다음 네 줄을 출력하시오.

  - `오름차순: [...]` — `sorted()`로 만든 새 리스트
  - `내림차순: [...]` — `sorted(..., reverse=True)`
  - `원래 리스트: [...]` — 위 두 작업 뒤에도 바뀌지 않은 원래 리스트
  - `sort() 후: [...]` — 원래 리스트에 `sort()`를 호출한 뒤의 리스트
  - 입력 프롬프트: `정수들: `
starter: |
  nums = list(map(int, input("정수들: ").split()))
solution: |
  nums = list(map(int, input("정수들: ").split()))
  print(f"오름차순: {sorted(nums)}")
  print(f"내림차순: {sorted(nums, reverse=True)}")
  print(f"원래 리스트: {nums}")
  nums.sort()
  print(f"sort() 후: {nums}")
alt_solutions:
  - |
    nums = list(map(int, input("정수들: ").split()))
    original = nums.copy()
    asc = nums.copy()
    asc.sort()
    desc = asc[::-1]
    print("오름차순:", asc)
    print("내림차순:", desc)
    print("원래 리스트:", original)
    print("sort() 후:", asc)
mutants:
  - name: sort()의 반환값을 출력 (None)
    code: |
      nums = list(map(int, input("정수들: ").split()))
      print(f"오름차순: {sorted(nums)}")
      print(f"내림차순: {sorted(nums, reverse=True)}")
      print(f"원래 리스트: {nums}")
      print(f"sort() 후: {nums.sort()}")
  - name: 먼저 sort()해서 원래 리스트가 바뀜
    code: |
      nums = list(map(int, input("정수들: ").split()))
      nums.sort()
      print(f"오름차순: {nums}")
      print(f"내림차순: {sorted(nums, reverse=True)}")
      print(f"원래 리스트: {nums}")
      print(f"sort() 후: {nums}")
tests:
  - stdin: "5 3 9 1\n"
    public: true
  - stdin: "1 2 3\n"
    note: 이미 정렬됨
  - stdin: "4 4 -1 0\n"
    note: 중복과 음수
  - stdin: "7\n"
hints:
  - "`sorted(리스트)`는 새 리스트를 돌려주고 원래 리스트는 그대로입니다."
  - "`리스트.sort()`는 원래 리스트를 바꾸고 `None`을 돌려줍니다. `print(nums.sort())`는 None이 출력돼요."
explanation: |
  `sorted()`는 원본 보존, `sort()`는 원본 변경입니다. 시험에서 `x = nums.sort()`처럼 쓰면 x가 None이 되는 실수가 잦습니다.
