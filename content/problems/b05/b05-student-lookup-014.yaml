id: b05-student-lookup-014
title: 2차원 리스트에서 학생 성적 찾기
unit: b05
difficulty: 3
tags: [list.2d, loop.for-each, io.fstring-format]
statement: |
  학생 성적이 2차원 리스트로 주어진다. 각 행은 `[이름, 국어, 영어, 수학]`이다.

  ```python
  students = [
      ["지민", 90, 85, 77],
      ["서준", 72, 95, 88],
      ["하은", 100, 64, 91],
      ["도윤", 58, 70, 66],
  ]
  ```

  이름을 입력받아 그 학생의 총점과 평균, 가장 높은 과목을 출력하시오. 가장 높은 점수가 여러 과목이면 국어, 영어, 수학 순서로 앞선 과목을 고른다.

  - 입력 프롬프트: `이름: `
  - 출력 형식: `총점: 252`, `평균: 84.00` (소수점 둘째 자리), `최고 과목: 국어`
  - 없는 이름이면 `없는 학생입니다`를 출력한다.
starter: |
  students = [
      ["지민", 90, 85, 77],
      ["서준", 72, 95, 88],
      ["하은", 100, 64, 91],
      ["도윤", 58, 70, 66],
  ]
  ##############################
solution: |
  students = [
      ["지민", 90, 85, 77],
      ["서준", 72, 95, 88],
      ["하은", 100, 64, 91],
      ["도윤", 58, 70, 66],
  ]
  ##############################
  name = input("이름: ")
  subjects = ["국어", "영어", "수학"]
  found = False
  for row in students:
      if row[0] == name:
          found = True
          scores = row[1:]
          total = sum(scores)
          best = 0
          for i in range(1, 3):
              if scores[i] > scores[best]:
                  best = i
          print(f"총점: {total}")
          print(f"평균: {total / 3:.2f}")
          print(f"최고 과목: {subjects[best]}")
  if not found:
      print("없는 학생입니다")
alt_solutions:
  - |
    students = [["지민", 90, 85, 77], ["서준", 72, 95, 88], ["하은", 100, 64, 91], ["도윤", 58, 70, 66]]
    name = input("이름: ")
    names = [s[0] for s in students]
    if name not in names:
        print("없는 학생입니다")
    else:
        kor, eng, math = students[names.index(name)][1:]
        total = kor + eng + math
        print("총점:", total)
        print("평균:", format(total / 3, ".2f"))
        top = max(kor, eng, math)
        if kor == top:
            print("최고 과목: 국어")
        elif eng == top:
            print("최고 과목: 영어")
        else:
            print("최고 과목: 수학")
mutants:
  - name: 이름까지 합산하려다 인덱스 실수 (row[0:3])
    code: |
      students = [["지민", 90, 85, 77], ["서준", 72, 95, 88], ["하은", 100, 64, 91], ["도윤", 58, 70, 66]]
      name = input("이름: ")
      found = False
      for row in students:
          if row[0] == name:
              found = True
              scores = row[1:3]
              total = sum(scores)
              print(f"총점: {total}")
              print(f"평균: {total / 3:.2f}")
              print(f"최고 과목: 국어")
      if not found:
          print("없는 학생입니다")
  - name: 없는 학생 메시지를 행마다 출력
    code: |
      students = [["지민", 90, 85, 77], ["서준", 72, 95, 88], ["하은", 100, 64, 91], ["도윤", 58, 70, 66]]
      subjects = ["국어", "영어", "수학"]
      name = input("이름: ")
      for row in students:
          if row[0] == name:
              scores = row[1:]
              total = sum(scores)
              best = scores.index(max(scores))
              print(f"총점: {total}")
              print(f"평균: {total / 3:.2f}")
              print(f"최고 과목: {subjects[best]}")
          else:
              print("없는 학생입니다")
tests:
  - stdin: "지민\n"
    public: true
  - stdin: "서준\n"
  - stdin: "하은\n"
  - stdin: "도윤\n"
  - stdin: "민수\n"
    note: 없는 학생
hints:
  - "`for row in students:`로 한 행씩 꺼내고 `row[0]`이 이름인지 확인합니다."
  - "찾았는지 기억할 변수(`found`)를 두고, 반복이 **끝난 뒤** 한 번만 '없는 학생'을 출력하세요."
explanation: |
  2차원 리스트의 행은 `[이름, 점수, 점수, 점수]`입니다. `row[1:]`처럼 슬라이싱으로 점수만 꺼낼 수 있습니다.
