tests:
  - stdin: "5 1 3 5 2 4 6 8 1\n"
    public: true
  - stdin: "3 3 3\n"
    note: 같은 수는 증가가 아님
  - stdin: "1 2 0 5\n"
    note: 같은 길이 [1, 2]와 [0, 5] → 앞의 구간
  - stdin: "9\n"
  - stdin: "1 2 3 4\n"
  - stdin: "1 1 2 3 0\n"
hints:
  - "현재 구간의 시작 위치(`start`)를 기억하다가, 증가가 끊기면 그 자리에서 새로 시작합니다."
  - "길이가 **더 길 때만**(`>`) 최고 기록을 바꾸면 앞의 구간이 남습니다."
explanation: |
  한 번 훑으면서 '현재 구간 시작'과 '지금까지 최고 구간'을 갱신하는 방법입니다. 슬라이싱 `nums[s:s + 길이]`로 구간을 꺼냅니다.
