id: b05-longest-run-022
title: 가장 긴 연속 증가 구간
unit: b05
difficulty: 4
tags: [list.slice, loop.range-len, loop.max-min]
statement: |
  공백으로 구분된 정수들을 입력받아, 바로 앞의 수보다 **큰** 수가 연속으로 이어지는 구간 중 가장 긴 것을 찾으시오.

  - 같은 길이의 구간이 여러 개면 가장 앞의 구간을 고른다.
  - 같은 수는 증가가 아니다 (구간이 끊긴다). 원소가 하나뿐이면 그 원소 하나가 구간이다.
  - 입력 프롬프트: `정수들: `
  - 출력 형식: `가장 긴 증가 구간: [2, 4, 6, 8]`, `길이: 4`
starter: |
  nums = list(map(int, input("정수들: ").split()))
solution: |
  nums = list(map(int, input("정수들: ").split()))
  best_start = 0
  best_len = 1
  start = 0
  for i in range(1, len(nums)):
      if nums[i] <= nums[i - 1]:
          start = i
      if i - start + 1 > best_len:
          best_start = start
          best_len = i - start + 1
  print(f"가장 긴 증가 구간: {nums[best_start:best_start + best_len]}")
  print(f"길이: {best_len}")
alt_solutions:
  - |
    nums = list(map(int, input("정수들: ").split()))
    runs = [[nums[0]]]
    for x in nums[1:]:
        if x > runs[-1][-1]:
            runs[-1].append(x)
        else:
            runs.append([x])
    best = runs[0]
    for r in runs:
        if len(r) > len(best):
            best = r
    print("가장 긴 증가 구간:", best)
    print("길이:", len(best))
mutants:
  - name: 같은 수도 증가로 봄
    code: |
