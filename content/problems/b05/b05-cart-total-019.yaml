tests:
  - stdin: "사과 1000 3\n우유 2500 2\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "펜 500 4\n공책 1000 2\n종료\n"
    note: 소계가 같으면 먼저 담은 상품
  - stdin: "노트북 1200000 1\n종료\n"
  - stdin: "a 1 1\nb 2 2\nc 3 1\n종료\n"
hints:
  - "`name, price, qty = line.split()`처럼 언패킹하면 세 값을 한 번에 받을 수 있습니다. 숫자는 `int()`로 바꾸세요."
  - "최댓값 항목은 `>`로 비교해야 같은 값일 때 먼저 담은 상품이 남습니다."
explanation: |
  `[상품명, 소계]`를 원소로 갖는 2차원 리스트를 만들면 출력·합계·최댓값 찾기를 한 번의 반복으로 처리할 수 있습니다.
