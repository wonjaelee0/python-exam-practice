id: b05-even-squares-011
title: 리스트 컴프리헨션으로 짝수의 제곱
unit: b05
difficulty: 2
tags: [list.comprehension, io.split-map]
statement: |
  공백으로 구분된 정수들을 입력받아, 그중 **짝수만** 골라 제곱한 리스트와 **홀수만** 골라 10을 곱한 리스트를 출력하시오.
  리스트 컴프리헨션(`[식 for 변수 in 리스트 if 조건]`)을 사용해 보자.

  - 입력 프롬프트: `정수들: `
  - 출력 형식: `짝수의 제곱: [4, 16]`, `홀수 × 10: [10, 30, 50]`
starter: |
  nums = list(map(int, input("정수들: ").split()))
solution: |
  nums = list(map(int, input("정수들: ").split()))
  even_sq = [n * n for n in nums if n % 2 == 0]
  odd_10 = [n * 10 for n in nums if n % 2 == 1]
  print(f"짝수의 제곱: {even_sq}")
  print(f"홀수 × 10: {odd_10}")
alt_solutions:
  - |
    nums = list(map(int, input("정수들: ").split()))
    a = []
    b = []
    for n in nums:
        if n % 2 == 0:
            a.append(n ** 2)
        else:
            b.append(n * 10)
    print("짝수의 제곱:", a)
    print("홀수 × 10:", b)
mutants:
  - name: 조건을 빠뜨려 모두 제곱
    code: |
      nums = list(map(int, input("정수들: ").split()))
      print(f"짝수의 제곱: {[n * n for n in nums]}")
      print(f"홀수 × 10: {[n * 10 for n in nums if n % 2 == 1]}")
  - name: 짝수 '인덱스'를 고름
    code: |
      nums = list(map(int, input("정수들: ").split()))
      print(f"짝수의 제곱: {[nums[i] * nums[i] for i in range(len(nums)) if i % 2 == 0]}")
      print(f"홀수 × 10: {[nums[i] * 10 for i in range(len(nums)) if i % 2 == 1]}")
tests:
  - stdin: "1 2 3 4 5\n"
    public: true
  - stdin: "2 4 6\n"
    note: 홀수 없음 → 빈 리스트
  - stdin: "-3 -2 0 7\n"
    note: 음수와 0 (0은 짝수)
  - stdin: "9\n"
hints:
  - "`[n * n for n in nums if n % 2 == 0]` — 뒤의 `if`가 고르는 조건입니다."
explanation: |
  컴프리헨션은 '반복 + 조건 + append'를 한 줄로 줄인 표현입니다. 파이썬에서는 음수도 `-3 % 2 == 1`이라 홀수로 판정됩니다.
