tests:
  - stdin: "Was it a car or a cat I saw?\n"
    public: true
  - stdin: "hello\n"
  - stdin: "Never odd or even\n"
  - stdin: "a\n"
  - stdin: "다시 합창합시다!\n"
  - stdin: "Ab, cBA?\n"
hints:
  - "한 번의 호출에서는 양 끝 글자만 처리하고, 나머지 가운데 부분은 다음 호출에 맡깁니다."
  - "양 끝이 문장부호면 비교하지 말고 그 글자를 뺀 문자열로 다시 호출합니다."
explanation: |
  재귀의 각 단계에서 '건너뛰기', '다르면 즉시 False', '같으면 가운데로 진행' 중 하나를 고릅니다. 다른 글자를 만나면 더 볼 필요가 없으므로 바로 `False`를 반환합니다.
