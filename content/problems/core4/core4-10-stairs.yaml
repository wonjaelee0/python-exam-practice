hints:
- 마지막 한 걸음은 n-1번 칸이나 n-2번 칸에서 옵니다. 두 경우의 방법 수를 더합니다.
- 고장 난 칸까지 가는 방법을 0으로 두면 그 칸을 거치는 모든 경로가 빠집니다.
explanation: |
  `ways(n) = ways(n-1) + ways(n-2)`는 피보나치와 같은 구조입니다. 종료 조건(음수 → 0, 바닥 → 1)이 결과 전체를 좌우하므로, 가장 작은 경우를 직접 따져 보고 정하세요.
