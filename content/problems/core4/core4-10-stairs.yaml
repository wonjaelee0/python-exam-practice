id: core4-10-stairs
title: '[4주차 응용5] 고장 난 칸을 피해 계단 오르기'
unit: core4
difficulty: 4
tags:
- core.w4
- recursion.count
statement: |
  > 컴퓨팅 핵심 4주차 도전문제 4(체험용 리본 나누기)를 응용한 문제입니다. 두 갈래로 재귀 호출하고 결과를 더합니다.

  계단을 한 번에 **1칸 또는 2칸**씩 올라 n번째 칸에 도착하는 방법의 수를 재귀로 구하시오.
  단, 고장 난 칸이 하나 있으면 그 칸은 밟을 수 없다.

  | 함수 | 역할 |
  |---|---|
  | `ways(n, broken)` | 0번 칸(바닥)에서 n번 칸까지 가는 방법의 수를 반환 |

  - 규칙: n이 음수면 0, n이 0이면 1(바닥에 이미 있음), n이 고장 난 칸이면 0, 그 밖에는 `ways(n - 1) + ways(n - 2)`
  - 검사 순서를 위와 같이 한다 (고장 난 칸이 없으면 broken은 0이고, 0번 칸은 항상 밟을 수 있다).
  - 반복문을 쓰지 않는다.
  - 입력 프롬프트: `계단 수: `, `고장 난 칸(없으면 0): `
  - 출력: `오르는 방법: 8가지`
  - 조건: 계단 수는 1 이상 20 이하, 고장 난 칸은 0 또는 1 이상 계단 수 미만
starter: |
  def ways(n, broken):
      pass


  n = int(input("계단 수: "))
  broken = int(input("고장 난 칸(없으면 0): "))
solution: |
  def ways(n, broken):
      if n < 0:
          return 0
      if n == 0:
          return 1
      if n == broken:
          return 0
      return ways(n - 1, broken) + ways(n - 2, broken)


  n = int(input("계단 수: "))
  broken = int(input("고장 난 칸(없으면 0): "))
  print(f"오르는 방법: {ways(n, broken)}가지")
alt_solutions:
- |
  def ways(n, broken):
      if n == 0:
          return 1
      if n < 0 or (broken > 0 and n == broken):
          return 0
      one = ways(n - 1, broken)
      two = ways(n - 2, broken)
      return one + two


  steps = int(input("계단 수: "))
  bad = int(input("고장 난 칸(없으면 0): "))
  print("오르는 방법: " + str(ways(steps, bad)) + "가지")
