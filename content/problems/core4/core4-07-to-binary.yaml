  public: true
- stdin: "0\n"
  note: '0'
- stdin: "1\n"
- stdin: "6\n"
- stdin: "1000000\n"
- stdin: "255\n"
hints:
- '종료 조건: n이 0 또는 1이면 그 숫자 하나가 답입니다.'
- 재귀 결과 **뒤에** 마지막 자리(`n % 2`)를 붙여야 높은 자리부터 나옵니다.
explanation: |
  2로 나눈 나머지는 낮은 자리부터 나오므로, 재귀 호출 결과(높은 자리들) 뒤에 이번 나머지를 붙이면 반복문 없이 올바른 순서가 됩니다.
