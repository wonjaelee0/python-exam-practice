id: b02-float-compare-010
title: 실수 덧셈과 오차 허용 비교
unit: b02
difficulty: 2
tags: [op.float-error, io.input-cast, cond.compare]
statement: |
  세 실수 a, b, c를 입력받아 다음 세 줄을 출력하시오.

  - `a + b = 0.30000000000000004` — `a + b`의 계산 결과를 그대로 출력
  - `== 비교: False` — `a + b == c`의 결과
  - `오차 허용 비교: True` — `abs(a + b - c) < 1e-9`의 결과
  - 입력 프롬프트: `a: `, `b: `, `c: `
starter: |
  a = float(input("a: "))
  b = float(input("b: "))
  c = float(input("c: "))
solution: |
  a = float(input("a: "))
  b = float(input("b: "))
  c = float(input("c: "))
  print(f"a + b = {a + b}")
  print(f"== 비교: {a + b == c}")
  print(f"오차 허용 비교: {abs(a + b - c) < 1e-9}")
alt_solutions:
  - |
    import math
    a = float(input("a: "))
    b = float(input("b: "))
    c = float(input("c: "))
    s = a + b
    print("a + b =", s)
    print("== 비교:", s == c)
    print("오차 허용 비교:", math.fabs(s - c) < 1e-9)
mutants:
  - name: 오차 허용을 너무 크게 (0.1)
    code: |
      a = float(input("a: "))
      b = float(input("b: "))
      c = float(input("c: "))
      print(f"a + b = {a + b}")
      print(f"== 비교: {a + b == c}")
      print(f"오차 허용 비교: {abs(a + b - c) < 0.1}")
  - name: 결과를 반올림해서 출력
    code: |
      a = float(input("a: "))
      b = float(input("b: "))
      c = float(input("c: "))
      print(f"a + b = {round(a + b, 2)}")
      print(f"== 비교: {a + b == c}")
      print(f"오차 허용 비교: {abs(a + b - c) < 1e-9}")
tests:
  - stdin: "0.1\n0.2\n0.3\n"
    public: true
  - stdin: "0.5\n0.25\n0.75\n"
    note: 이진수로 정확히 표현되는 수
  - stdin: "1\n2\n3\n"
  - stdin: "0.1\n0.2\n0.35\n"
    note: 실제로 다른 값
  - stdin: "0.1\n0.7\n0.8\n"
hints:
  - "컴퓨터는 0.1을 이진수로 정확히 표현할 수 없어서 `0.1 + 0.2`가 `0.30000000000000004`가 됩니다."
  - "실수는 `==` 대신 차이의 절댓값이 아주 작은지(`< 1e-9`)로 비교합니다."
explanation: |
  부동소수점 오차 때문에 실수는 `==`로 비교하면 위험합니다. `abs(x - y) < 1e-9` 또는 `math.fabs(x - y) < 1e-9`로 비교하세요.
