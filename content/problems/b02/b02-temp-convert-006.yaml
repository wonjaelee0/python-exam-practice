id: b02-temp-convert-006
title: 섭씨를 화씨로
unit: b02
difficulty: 1
tags: [io.input-cast, io.fstring-format, op.precedence]
statement: |
  섭씨 온도(실수)를 입력받아 화씨 온도로 바꿔 소수점 첫째 자리까지 출력하시오.

  - 화씨 = 섭씨 × 9 / 5 + 32
  - 입력 프롬프트: `섭씨: `
  - 출력 형식: `화씨: 98.6`
starter: |
  c = float(input("섭씨: "))
solution: |
  c = float(input("섭씨: "))
  f = c * 9 / 5 + 32
  print(f"화씨: {f:.1f}")
alt_solutions:
  - |
    c = float(input("섭씨: "))
    print("화씨:", format(c * 9 / 5 + 32, ".1f"))
mutants:
  - name: 괄호 위치 실수 (섭씨 + 32를 먼저)
    code: |
      c = float(input("섭씨: "))
      print(f"화씨: {(c + 32) * 9 / 5:.1f}")
  - name: 몫 연산(//) 사용
    code: |
      c = float(input("섭씨: "))
      print(f"화씨: {c * 9 // 5 + 32:.1f}")
tests:
  - stdin: "37\n"
    public: true
  - stdin: "0\n"
  - stdin: "100\n"
  - stdin: "-40\n"
    note: 섭씨와 화씨가 같아지는 온도
  - stdin: "36.5\n"
hints:
  - "곱셈·나눗셈이 덧셈보다 먼저 계산되므로 `c * 9 / 5 + 32`에는 괄호가 필요 없습니다."
  - "`:.1f`로 소수점 첫째 자리까지 출력합니다."
explanation: |
  연산자 우선순위: `*`, `/`, `//`, `%`가 `+`, `-`보다 먼저입니다. 헷갈리면 괄호로 순서를 분명히 하세요.
