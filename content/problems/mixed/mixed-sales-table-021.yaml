tests:
  - stdin: "3\n강남 120 150 130 160\n홍대 200 180 170 190\n잠실 90 110 140 100\n"
    public: true
  - stdin: "2\nA 10 20 20 10\nB 15 15 15 15\n"
    note: 합계·최고 분기 동점, 성장 없음
  - stdin: "1\nC 1 2 3 4\n"
    note: 평균이 정수가 아님
  - stdin: "2\n서면 0 0 0 0\n동성로 0 0 0 2\n"
hints:
  - "`row.index(max(row))`는 최댓값이 처음 나오는 위치입니다. 분기 번호는 여기에 1을 더합니다."
  - "분기 합계는 `[0, 0, 0, 0]`에서 시작해 지점마다 같은 자리끼리 더합니다."
explanation: |
  2차원 리스트에서 **행 방향**(지점별 합계·평균·최고 분기)과 **열 방향**(분기 합계)을 모두 계산하는 문제입니다.
  '같으면 먼저 나온 것'은 `>`로 비교해 갱신하거나, 처음 위치를 돌려주는 `index()`를 쓰면 자연스럽게 됩니다.
