id: mixed-seat-reserve-010
title: 극장 좌석 예약 (2차원 리스트)
unit: mixed
difficulty: 3
tags: [list.2d, loop.while-sentinel, cond.nested-if]
statement: |
  3행 4열 좌석이 모두 빈자리(`O`)인 2차원 리스트로 시작한다. 예약 명령을 `행 열` 형식(1부터 시작하는 번호)으로 입력받다가 `종료`가 입력되면 끝내시오.

  - 행이나 열이 범위를 벗어나면 `없는 좌석입니다`
  - 이미 예약된 좌석(`X`)이면 `이미 예약된 좌석입니다`
  - 빈자리면 `X`로 바꾸고 `2행 3열 예약 완료`
  - `종료` 후 좌석표를 행마다 `OOXO`처럼 한 줄씩 출력하고, 마지막 줄에 `남은 좌석: 11`을 출력한다.
  - 입력 프롬프트: `좌석: `
starter: |
  seats = [["O"] * 4 for _ in range(3)]
solution: |
  seats = [["O"] * 4 for _ in range(3)]
  while True:
      line = input("좌석: ")
      if line == "종료":
          break
      r, c = map(int, line.split())
      if r < 1 or r > 3 or c < 1 or c > 4:
          print("없는 좌석입니다")
      elif seats[r - 1][c - 1] == "X":
          print("이미 예약된 좌석입니다")
      else:
          seats[r - 1][c - 1] = "X"
          print(f"{r}행 {c}열 예약 완료")
  empty = 0
  for row in seats:
      print("".join(row))
      empty += row.count("O")
  print(f"남은 좌석: {empty}")
alt_solutions:
  - |
    seats = []
    for i in range(3):
        seats.append(["O", "O", "O", "O"])
    line = input("좌석: ")
    while line != "종료":
        parts = line.split()
        r = int(parts[0]) - 1
        c = int(parts[1]) - 1
        if 0 <= r < 3 and 0 <= c < 4:
            if seats[r][c] == "O":
                seats[r][c] = "X"
                print(str(r + 1) + "행 " + str(c + 1) + "열 예약 완료")
            else:
                print("이미 예약된 좌석입니다")
        else:
            print("없는 좌석입니다")
        line = input("좌석: ")
    left = 0
    for row in seats:
        line_text = ""
        for s in row:
            line_text += s
            if s == "O":
                left += 1
        print(line_text)
    print("남은 좌석:", left)
mutants:
  - name: 같은 리스트를 세 번 복사한 좌석표 ([[..]] * 3)
    code: |
      seats = [["O"] * 4] * 3
      while True:
          line = input("좌석: ")
          if line == "종료":
              break
          r, c = map(int, line.split())
          if r < 1 or r > 3 or c < 1 or c > 4:
              print("없는 좌석입니다")
          elif seats[r - 1][c - 1] == "X":
              print("이미 예약된 좌석입니다")
          else:
              seats[r - 1][c - 1] = "X"
              print(f"{r}행 {c}열 예약 완료")
      empty = 0
      for row in seats:
          print("".join(row))
          empty += row.count("O")
      print(f"남은 좌석: {empty}")
  - name: 1을 빼지 않음 (인덱스 실수)
    code: |
      seats = [["O"] * 5 for _ in range(4)]
      while True:
          line = input("좌석: ")
          if line == "종료":
              break
          r, c = map(int, line.split())
          if r < 1 or r > 3 or c < 1 or c > 4:
              print("없는 좌석입니다")
          elif seats[r][c] == "X":
              print("이미 예약된 좌석입니다")
          else:
              seats[r][c] = "X"
              print(f"{r}행 {c}열 예약 완료")
      empty = 0
      for row in seats[:3]:
          print("".join(row[:4]))
          empty += row[:4].count("O")
      print(f"남은 좌석: {empty}")
tests:
  - stdin: "2 3\n2 3\n4 1\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "1 1\n3 4\n0 2\n1 5\n종료\n"
    note: 모서리 좌석과 범위 밖
  - stdin: "1 2\n2 2\n3 2\n종료\n"
    note: 같은 열을 행마다 예약
hints:
  - "좌석 번호는 1부터, 리스트 인덱스는 0부터입니다. `seats[r - 1][c - 1]`"
  - "`[[\"O\"] * 4] * 3`은 같은 행 리스트를 세 번 가리켜서 한 칸을 바꾸면 세 행이 같이 바뀝니다."
explanation: |
  2차원 리스트는 컴프리헨션 `[["O"] * 4 for _ in range(3)]`처럼 행마다 새 리스트를 만들어야 합니다 (얕은 복사 함정).
