tests:
  - stdin: "XO.\n.XO\n..X\n"
    public: true
  - stdin: "XOX\nXOO\nOXX\n"
    public: true
  - stdin: "XXX\n...\n...\n"
    note: X만 3개
  - stdin: "OOO\nXX.\nXX.\n"
    note: O가 이겼는데 X가 더 많음
  - stdin: "XXX\nOOO\n...\n"
    note: 둘 다 이김
  - stdin: "X..\n.O.\n...\n"
  - stdin: "OX.\nOXX\nO..\n"
  - stdin: "O.X\nOX.\nX..\n"
    note: 반대쪽 대각선
  - stdin: ".O.\n...\n...\n"
    note: O가 먼저 둠
hints:
  - "가로 3줄, 세로 3줄, 대각선 2줄을 문자열 8개로 만들어 두면 `\"XXX\" in lines`로 승리를 확인할 수 있습니다."
  - "X가 먼저 두므로 X의 개수는 O와 같거나 1 많습니다. 이긴 사람이 마지막에 둔 사람이어야 합니다."
explanation: |
  판정 순서가 중요합니다. 먼저 '나올 수 없는 판'을 모두 걸러 낸 뒤 승리 → 무승부 → 진행 중 순서로 확인합니다.
  X가 이겼다면 X가 마지막에 뒀으니 X가 1개 많아야 하고, O가 이겼다면 개수가 같아야 합니다.
