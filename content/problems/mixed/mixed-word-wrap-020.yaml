tests:
  - stdin: "16\nthe quick brown fox jumps over the lazy dog\n"
    public: true
  - stdin: "9\naaaa bbbb cccc\n"
    note: 폭과 딱 맞는 줄
  - stdin: "5\nhello world\n"
  - stdin: "20\n  spaced   out   words  \n"
    note: 공백이 여러 개
  - stdin: "3\na b c d e\n"
  - stdin: "10\n\n"
    note: 빈 문장
hints:
  - "지금 줄 `current`에 단어를 붙였을 때의 길이는 `len(current) + 1 + len(w)`입니다 (공백 1칸 포함)."
  - "반복이 끝나면 아직 `current`에 남아 있는 마지막 줄을 꼭 추가하세요. 채울 공백은 `\" \" * (폭 - 줄 길이)`입니다."
explanation: |
  '들어가면 붙이고, 안 들어가면 줄을 넘기는' 탐욕적 방법입니다. 폭과 **정확히 같은** 길이도 들어가므로 비교는 `<=`입니다.
  문자열 메서드 `ljust(폭)`을 쓰면 오른쪽 공백 채우기를 한 번에 할 수 있습니다.
