id: mixed-word-wrap-020
title: 단어 단위 줄바꿈 상자
unit: mixed
difficulty: 4
tags: [str.split-join, str.multiply, loop.accumulate]
statement: |
  폭과 영어 문장을 입력받아, 한 줄의 길이가 폭을 넘지 않도록 단어 단위로 줄을 나눠 상자 안에 출력하시오.

  - 입력 프롬프트: `폭: `, `문장: `
  - 앞에서부터 한 줄에 들어갈 수 있는 만큼 단어를 넣고(단어 사이는 공백 하나), 다음 단어가 들어가지 않으면 새 줄을 시작한다.
  - 각 줄은 `|`로 감싸고, 줄 길이가 폭보다 짧으면 오른쪽을 공백으로 채워 폭에 맞춘다.
  - 마지막 줄에 `줄 수: 3`을 출력한다.
  - 문장의 단어 사이에는 공백이 여러 개 있을 수 있다. 모든 단어의 길이는 폭 이하이다.

  예) 폭 16, 문장 `the quick brown fox jumps over the lazy dog`

  ```
  |the quick brown |
  |fox jumps over  |
  |the lazy dog    |
  줄 수: 3
  ```
starter: |
  width = int(input("폭: "))
  words = input("문장: ").split()
solution: |
  width = int(input("폭: "))
  words = input("문장: ").split()
  lines = []
  current = ""
  for w in words:
      if current == "":
          current = w
      elif len(current) + 1 + len(w) <= width:
          current += " " + w
      else:
          lines.append(current)
          current = w
  if current != "":
      lines.append(current)
  for line in lines:
      print("|" + line + " " * (width - len(line)) + "|")
  print(f"줄 수: {len(lines)}")
alt_solutions:
  - |
    w = int(input("폭: "))
    ws = input("문장: ").split()
    rows = []
    row = []
    for word in ws:
        if row and len(" ".join(row + [word])) > w:
            rows.append(" ".join(row))
            row = []
        row.append(word)
    if row:
        rows.append(" ".join(row))
    for r in rows:
        print("|" + r.ljust(w) + "|")
    print("줄 수:", len(rows))
