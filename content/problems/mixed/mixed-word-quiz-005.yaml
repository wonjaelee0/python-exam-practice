hints:
  - "시드를 고정하면 문제 순서가 항상 같습니다. Run으로 어떤 단어가 나오는지 확인해 보세요."
  - "프롬프트에 단어를 넣으려면 `input(f\"{eng}의 뜻: \")`처럼 f-string을 씁니다."
explanation: |
  `random.choice(리스트)`는 리스트에서 하나를 무작위로 고릅니다. `random.seed(1)` 덕분에 채점할 때도 같은 단어가 나옵니다.
