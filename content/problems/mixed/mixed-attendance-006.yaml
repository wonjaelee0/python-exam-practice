      if len(days) == 0:
          print("기록이 없습니다")
      else:
          print(f"수업 일수: {len(days)}")
          perfect = []
          for name in attend:
              print(f"{name}: {len(attend[name])}일")
              if len(attend[name]) == len(days):
                  perfect.append(name)
          print(f"개근: {perfect}")
tests:
  - stdin: "10/01 지민\n10/01 민수\n10/02 지민\n10/03 지민\n10/03 민수\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "1일 하나\n1일 하나\n2일 둘\n종료\n"
    note: 같은 날 중복 기록, 개근자 없음
  - stdin: "d1 Zoe\nd1 Amy\n종료\n"
    note: 하루뿐이면 모두 개근
hints:
  - "날짜는 집합에 모으면 중복 없이 셀 수 있습니다."
  - "사람마다 출석한 날짜의 집합을 저장하세요: `attend.setdefault(이름, set()).add(날짜)`"
explanation: |
  딕셔너리의 값으로 집합을 쓰면 '사람별 출석 날짜'를 중복 없이 모을 수 있습니다. 개근은 출석 일수가 전체 수업 일수와 같은 사람입니다.
