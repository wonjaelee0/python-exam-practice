tests:
  - stdin: "1\nHello, World 2026!\n3\n"
    public: true
  - stdin: "2\nKhoor, Zruog 5359!\n3\n"
    public: true
  - stdin: "1\nxyz XYZ 789\n3\n"
    note: 끝에서 처음으로 돌아감
  - stdin: "1\nabc\n-1\n"
    note: 음수 이동
  - stdin: "1\nPython\n29\n"
    note: 26보다 큰 이동
  - stdin: "2\nabc 123\n55\n"
  - stdin: "1\n안녕 Abc 9\n1\n"
hints:
  - "`LOWER.index(ch)`로 위치를 찾고 `(위치 + k) % 26`으로 새 위치를 구하면, 끝을 넘거나 음수가 되어도 알맞게 돌아옵니다."
  - "복호화는 `k`를 `-k`로 바꿔 암호화와 같은 코드를 쓰면 됩니다. 숫자는 `% 10`입니다."
explanation: |
  파이썬의 `%`는 음수에도 0 이상의 나머지를 돌려줍니다 (`-1 % 26 == 25`). 그래서 `(위치 + k) % 26` 한 줄로 앞뒤 이동과 큰 이동을 모두 처리할 수 있습니다.
