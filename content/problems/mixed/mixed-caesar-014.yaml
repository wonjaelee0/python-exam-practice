id: mixed-caesar-014
title: 카이사르 암호 (숫자 포함)
unit: mixed
difficulty: 4
tags: [str.index, op.modulo, str.iterate]
statement: |
  문장을 카이사르 암호로 암호화하거나 복호화하시오.

  - 입력 프롬프트: `모드(1: 암호화, 2: 복호화): `, `문장: `, `이동: `
  - **암호화**는 알파벳을 이동 칸 수만큼 뒤로 민다 (`a`를 3칸 → `d`, `z`를 1칸 → `a`). **복호화**는 반대 방향으로 민다.
  - 대문자는 대문자로, 소문자는 소문자로 유지한다.
  - 숫자도 `0`~`9` 안에서 같은 방식으로 민다 (`9`를 1칸 → `0`).
  - 그 밖의 글자(공백, 문장부호, 한글 등)는 그대로 둔다.
  - 이동 칸 수는 음수이거나 26보다 클 수 있다. 모드는 1 또는 2만 입력된다.
  - 출력 형식: `결과: Khoor, Zruog 5359!`
starter: |
  LOWER = "abcdefghijklmnopqrstuvwxyz"
  UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  DIGITS = "0123456789"
solution: |
  LOWER = "abcdefghijklmnopqrstuvwxyz"
  UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  DIGITS = "0123456789"
  mode = input("모드(1: 암호화, 2: 복호화): ")
  text = input("문장: ")
  k = int(input("이동: "))
  if mode == "2":
      k = -k
  result = ""
  for ch in text:
      if ch in LOWER:
          result += LOWER[(LOWER.index(ch) + k) % 26]
      elif ch in UPPER:
          result += UPPER[(UPPER.index(ch) + k) % 26]
      elif ch in DIGITS:
          result += DIGITS[(DIGITS.index(ch) + k) % 10]
      else:
          result += ch
  print(f"결과: {result}")
alt_solutions:
  - |
    mode = input("모드(1: 암호화, 2: 복호화): ")
    text = input("문장: ")
    shift = int(input("이동: "))
    sign = 1 if mode == "1" else -1
    out = []
    for ch in text:
        if "a" <= ch <= "z":
            out.append(chr((ord(ch) - ord("a") + sign * shift) % 26 + ord("a")))
        elif "A" <= ch <= "Z":
            out.append(chr((ord(ch) - ord("A") + sign * shift) % 26 + ord("A")))
        elif "0" <= ch <= "9":
            out.append(chr((ord(ch) - ord("0") + sign * shift) % 10 + ord("0")))
        else:
            out.append(ch)
    print("결과:", "".join(out))
