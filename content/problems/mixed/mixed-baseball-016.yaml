tests:
  - stdin: "123\n456\n325\n"
    public: true
  - stdin: "12\n1234\n102\n112\nabc\n789\n325\n"
    note: 잘못된 입력은 횟수에 넣지 않음
  - stdin: "325\n"
  - stdin: "532\n352\n325\n"
hints:
  - "입력 검사: 길이 3, 모두 숫자(`isdigit()`), `0` 없음, 서로 다름(`len(set(guess)) == 3`)."
  - "같은 자리면 스트라이크, **아니면서** 정답에 있으면 볼입니다 (`if` / `elif`)."
explanation: |
  `random.seed(1)` 덕분에 정답이 매번 같으므로 채점이 가능합니다. 정답이 궁금하면 `print(answer)`로 확인해 보세요 (제출 전에는 지울 것).
  잘못된 입력은 `continue`로 건너뛰되, 시도 횟수는 그 **뒤에서** 늘려야 합니다.
