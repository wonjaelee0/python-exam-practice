id: mixed-bank-account-004
title: 은행 계좌 명령 처리
unit: mixed
difficulty: 3
tags: [loop.while-sentinel, cond.nested-if, str.split]
statement: |
  잔액 0원에서 시작하는 계좌를 만들고, 명령을 한 줄에 하나씩 입력받아 처리하다가 `종료`가 입력되면 끝내시오.

  | 명령 | 동작 |
  |---|---|
  | `입금 x` | x가 0보다 크면 입금하고 `입금 완료: 잔액 5000원` |
  | `출금 x` | x가 잔액보다 크면 `잔액이 부족합니다`, 아니면 출금하고 `출금 완료: 잔액 2000원` |
  | `잔액` | `현재 잔액: 2000원` |

  - 입금·출금 금액이 0 이하이면 `잘못된 금액입니다`를 출력한다 (출금은 이 검사를 먼저 한다).
  - 위에 없는 명령이면 `알 수 없는 명령입니다`
  - `종료`하면 성공한 입금·출금 횟수를 `거래 횟수: 3` 형식으로 출력한다.
  - 입력 프롬프트: `명령: `
starter: |
  balance = 0
  count = 0
solution: |
  balance = 0
  count = 0
  while True:
      parts = input("명령: ").split()
      cmd = parts[0]
      if cmd == "종료":
          break
      if cmd == "잔액":
          print(f"현재 잔액: {balance}원")
      elif cmd == "입금" or cmd == "출금":
          amount = int(parts[1])
          if amount <= 0:
              print("잘못된 금액입니다")
          elif cmd == "입금":
              balance += amount
              count += 1
              print(f"입금 완료: 잔액 {balance}원")
          elif amount > balance:
              print("잔액이 부족합니다")
          else:
              balance -= amount
              count += 1
              print(f"출금 완료: 잔액 {balance}원")
      else:
          print("알 수 없는 명령입니다")
  print(f"거래 횟수: {count}")
alt_solutions:
  - |
    balance = 0
    done = 0
    line = input("명령: ")
    while line != "종료":
        words = line.split()
        if words[0] == "입금":
            x = int(words[1])
            if x > 0:
                balance = balance + x
                done += 1
                print("입금 완료: 잔액 " + str(balance) + "원")
            else:
                print("잘못된 금액입니다")
        elif words[0] == "출금":
            x = int(words[1])
            if x <= 0:
                print("잘못된 금액입니다")
            elif balance - x < 0:
                print("잔액이 부족합니다")
            else:
                balance = balance - x
                done += 1
                print("출금 완료: 잔액 " + str(balance) + "원")
        elif words[0] == "잔액":
            print("현재 잔액: " + str(balance) + "원")
        else:
            print("알 수 없는 명령입니다")
        line = input("명령: ")
    print("거래 횟수:", done)
