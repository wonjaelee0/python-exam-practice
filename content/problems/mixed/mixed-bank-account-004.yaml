tests:
  - stdin: "입금 5000\n출금 3000\n잔액\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "출금 100\n입금 0\n입금 100\n출금 100\n잔액\n종료\n"
    note: 잔액 부족, 0원 입금, 잔액과 같은 금액 출금
  - stdin: "송금 100\n입금 -5\n출금 -1\n종료\n"
    note: 잘못된 명령과 금액
hints:
  - "명령 줄을 `split()`으로 나누면 `parts[0]`이 명령, `parts[1]`이 금액입니다. `잔액`·`종료`는 금액이 없어요."
  - "거래 횟수는 실제로 입금·출금이 된 경우에만 1씩 늘립니다."
explanation: |
  명령 종류 → 금액 검사 → 잔액 검사 순서로 조건을 중첩하면 각 경우를 빠짐없이 처리할 수 있습니다.
