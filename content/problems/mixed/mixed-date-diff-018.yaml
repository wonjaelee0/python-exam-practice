tests:
  - stdin: "2024-02-28\n2024-03-01\n"
    public: true
  - stdin: "2026-10-08\n2026-10-20\n"
    public: true
  - stdin: "1900-01-01\n1900-01-01\n"
    note: 같은 날짜
  - stdin: "1999-12-31\n2000-03-01\n"
    note: 2000년은 윤년
  - stdin: "2100-02-28\n2100-03-01\n"
    note: 2100년은 평년
  - stdin: "1900-02-28\n1900-03-01\n"
  - stdin: "1900-01-01\n2100-12-31\n"
hints:
  - "각 날짜가 1900-01-01로부터 며칠째인지(0부터) 구하면, 차이는 빼기이고 요일은 `% 7`입니다 (0이면 월요일)."
  - "앞선 해들의 일수(365 또는 366) + 앞선 달들의 일수(그해가 윤년이고 2월을 지났으면 +1) + (일 - 1)"
explanation: |
  날짜 계산은 '기준일로부터 며칠째인가'라는 하나의 숫자로 바꾸면 간단해집니다. 두 날짜 모두 같은 방법으로 바꾸므로 반복문 하나로 처리했습니다.
  요일만 따로 구하는 공식(첼러의 공식)도 있지만, 일수를 이미 구했다면 `% 7`이 가장 쉽습니다.
