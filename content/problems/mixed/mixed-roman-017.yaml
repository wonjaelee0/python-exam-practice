hints:
  - "정수→로마: `[1000, 900, 500, 400, …, 1]`과 `[\"M\", \"CM\", \"D\", \"CD\", …, \"I\"]`를 나란히 두고, 큰 값부터 뺄 수 있는 만큼 빼며 기호를 붙입니다."
  - "로마→정수: 바로 오른쪽 기호가 더 크면 지금 기호의 값은 **뺍니다** (`IV` = -1 + 5)."
explanation: |
  빼기 표기 6개(900, 400, 90, 40, 9, 4)를 표에 미리 넣어 두면 정수→로마가 '큰 값부터 탐욕적으로 빼기'로 끝납니다.
  로마→정수는 왼쪽에서 오른쪽으로 보며, 다음 기호보다 작은 기호만 빼면 됩니다.
