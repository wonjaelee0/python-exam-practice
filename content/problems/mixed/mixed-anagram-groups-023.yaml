id: mixed-anagram-groups-023
title: 애너그램끼리 묶기
unit: mixed
difficulty: 5
tags: [dict.list-values, str.sorted-key, list.order]
statement: |
  단어들을 한 줄로 입력받아, 서로 애너그램(글자 구성이 같은 단어)인 단어끼리 묶어 출력하시오.

  - 입력 프롬프트: `단어들: ` (공백으로 구분)
  - 대소문자는 구분하지 않으며, 모든 단어를 소문자로 바꿔 다룬다. 같은 단어가 다시 나오면 무시한다.
  - 단어가 2개 이상인 묶음만, 묶음의 첫 단어가 나온 순서대로 `묶음 1: listen, silent, enlist` 형식으로 출력한다. 묶음 안의 단어도 나온 순서대로 쓴다.
  - 묶음이 하나도 없으면 `애너그램 묶음이 없습니다`를 출력한다.
  - 마지막 줄에 `묶음 수: 3`을 출력한다.
starter: |
  words = input("단어들: ").lower().split()
solution: |
  words = input("단어들: ").lower().split()
  groups = {}
  order = []
  for w in words:
      key = "".join(sorted(w))
      if key not in groups:
          groups[key] = []
          order.append(key)
      if w not in groups[key]:
          groups[key].append(w)
  count = 0
  for key in order:
      if len(groups[key]) >= 2:
          count += 1
          members = ", ".join(groups[key])
          print(f"묶음 {count}: {members}")
  if count == 0:
      print("애너그램 묶음이 없습니다")
  print(f"묶음 수: {count}")
alt_solutions:
  - |
    seen = []
    for w in input("단어들: ").split():
        w = w.lower()
        if w not in seen:
            seen.append(w)
    used = [False] * len(seen)
    n = 0
    for i in range(len(seen)):
        if used[i]:
            continue
        group = [seen[i]]
        for j in range(i + 1, len(seen)):
            if not used[j] and sorted(seen[j]) == sorted(seen[i]):
                group.append(seen[j])
                used[j] = True
        if len(group) > 1:
            n += 1
            print("묶음 " + str(n) + ": " + ", ".join(group))
    if n == 0:
        print("애너그램 묶음이 없습니다")
    print("묶음 수:", n)
