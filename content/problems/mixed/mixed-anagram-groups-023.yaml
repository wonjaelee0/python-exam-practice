tests:
  - stdin: "listen silent enlist google banana elgoog tinsel cat act\n"
    public: true
  - stdin: "Listen SILENT listen Enlist\n"
    note: 대소문자 무시, 같은 단어 무시
  - stdin: "apple banana cherry\n"
    note: 묶음 없음
  - stdin: "abc abc\n"
    note: 같은 단어뿐
  - stdin: "stop pots tops opts post spot\n"
  - stdin: "rat tar art star tars cheese\n"
hints:
  - "`\"\".join(sorted(단어))`는 애너그램끼리 같은 값이 됩니다 (`listen`, `silent` → `eilnst`). 이것을 딕셔너리의 키로 씁니다."
  - "딕셔너리 키가 처음 생길 때 그 키를 `order` 리스트에도 넣어 두면, 묶음이 처음 나온 순서를 확실하게 지킬 수 있습니다."
explanation: |
  '정렬한 글자'를 키로, 단어 리스트를 값으로 하는 딕셔너리가 핵심입니다.
  출력 순서는 처음 나온 순서이므로, 키를 따로 정렬하면 안 됩니다. 같은 단어가 다시 나오는 경우(대소문자만 다른 경우 포함)도 걸러야 합니다.
