          print(f"결과: {result}")
          print(f"길이: {len(result)}")
      else:
          print("잘못된 모드입니다")
tests:
  - stdin: "1\naaabccdddd\n"
    public: true
  - stdin: "2\nx12y1\n"
    public: true
  - stdin: "2\na3b1c2d4\n"
  - stdin: "2\nk10m2\n"
    note: 두 자리 개수
  - stdin: "1\nabc\n"
    note: 압축률이 100%를 넘음
  - stdin: "1\naabaa\n"
    note: 같은 글자가 떨어져서 다시 나옴
  - stdin: "3\n"
    note: 잘못된 모드
  - stdin: "1\nzzzzzzzzzzzz\n"
    note: 개수가 두 자리
hints:
  - "압축: 앞 글자와 같으면 개수를 늘리고, 다르면 지금까지의 구간을 결과에 붙입니다. 반복이 끝난 뒤 **마지막 구간**도 붙여야 합니다."
  - "해제: 숫자가 아닌 글자를 만나면 그 전까지 모은 숫자 문자열(`num`)로 앞 글자를 늘립니다."
explanation: |
  `aabaa`는 `a2b1a2`이지 `a4b1`이 아닙니다. 딕셔너리로 '전체 개수'를 세면 연속 구간이 사라집니다.
  해제할 때 개수가 `12`처럼 여러 자리일 수 있으므로 두 글자씩 끊어 읽으면 안 됩니다.
