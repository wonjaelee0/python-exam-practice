tests:
  - stdin: "지민 95\n서준 82\n하은 74\n도윤 59\n종료\n"
    public: true
  - stdin: "종료\n"
  - stdin: "가 90\n나 90\n종료\n"
    note: 최고점 동점 → 먼저 입력된 학생
  - stdin: "철수 60\n종료\n"
  - stdin: "a 100\nb 0\nc 79\nd 80\ne 69\n종료\n"
hints:
  - "학점 분포는 `{\"A\": 0, \"B\": 0, …}`처럼 0으로 미리 만들어 두면 0명도 출력됩니다."
  - "최고점은 `>`로 비교해야 동점일 때 먼저 입력된 학생이 남습니다."
explanation: |
  반복 입력으로 2차원 리스트를 만들고, 한 번의 순회로 합계·최고점·학점 분포를 모두 구합니다.
