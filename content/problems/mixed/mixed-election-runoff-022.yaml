tests:
  - stdin: "민수 지은 하늘\n민수\n지은\n민수\n하늘\n민수\n철수\n종료\n"
    public: true
  - stdin: "A B C\nA\nB\nC\nA\nB\n종료\n"
    public: true
  - stdin: "A B C\nA\nA\nB\nC\n종료\n"
    note: 정확히 절반은 과반이 아님
  - stdin: "A B\nC\nD\n종료\n"
    note: 유효표 없음
  - stdin: "하늘 나래 가람\n가람\n하늘\n나래\n하늘\n종료\n"
    note: 2위 동점 — 후보 입력 순서
  - stdin: "A\n종료\n"
  - stdin: "A B\nA\nA\nB\nX\nX\nX\n종료\n"
    note: 무효표가 많음
  - stdin: "A B C\nC\nB\nA\n종료\n"
hints:
  - "후보마다 0표로 시작하는 딕셔너리를 만들고, 없는 이름은 무효표로 셉니다. 득표율의 분모는 유효표 수입니다."
  - "`[-득표수, 입력 순서]`를 정렬하면 득표순, 같으면 입력 순서가 됩니다. 과반은 `득표 * 2 > 유효표`."
explanation: |
  '과반'은 절반을 **넘는** 것이라 4표 중 2표는 과반이 아닙니다. 분모(유효표)와 동점 규칙(입력 순서)을 지문대로 정확히 지키는 것이 핵심입니다.
