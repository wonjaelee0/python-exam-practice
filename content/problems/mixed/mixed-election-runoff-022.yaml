id: mixed-election-runoff-022
title: 개표와 결선 투표
unit: mixed
difficulty: 5
tags: [dict.count, loop.while-sentinel, list.sort]
statement: |
  후보 목록과 투표를 입력받아 개표 결과를 출력하시오.

  - 입력 프롬프트: 후보는 `후보: ` (한 줄에 공백으로 구분, 이름은 서로 다름), 투표는 `투표: ` (`종료`가 입력될 때까지 한 표씩)
  - 후보 목록에 없는 이름은 무효표이다.
  - 출력 (순서대로)
    1. 후보 입력 순서대로 `민수: 3표 (60.0%)` — 득표율은 **유효표** 대비, 소수 첫째 자리까지 (유효표가 없으면 0.0%)
    2. `무효표: 1표`
    3. 결과 한 줄
       - 유효표가 없으면 `당선자 없음`
       - 1위가 유효표의 **과반**(절반 초과)을 얻었으면 `당선: 민수`
       - 아니면 상위 두 후보로 `결선 투표: A, B` (득표순, 표가 같으면 후보 입력 순서)
starter: |
  candidates = input("후보: ").split()
solution: |
  candidates = input("후보: ").split()
  votes = {}
  for c in candidates:
      votes[c] = 0
  invalid = 0
  while True:
      v = input("투표: ")
      if v == "종료":
          break
      if v in votes:
          votes[v] += 1
      else:
          invalid += 1
  valid = sum(votes.values())
  for c in candidates:
      rate = 0
      if valid > 0:
          rate = votes[c] / valid * 100
      print(f"{c}: {votes[c]}표 ({rate:.1f}%)")
  print(f"무효표: {invalid}표")
  if valid == 0:
      print("당선자 없음")
  else:
      ranking = []
      for i in range(len(candidates)):
          ranking.append([-votes[candidates[i]], i])
      ranking.sort()
      first = candidates[ranking[0][1]]
      if votes[first] * 2 > valid:
          print(f"당선: {first}")
      else:
          second = candidates[ranking[1][1]]
          print(f"결선 투표: {first}, {second}")
alt_solutions:
  - |
    names = input("후보: ").split()
    counts = [0] * len(names)
    bad = 0
    v = input("투표: ")
    while v != "종료":
        if v in names:
            counts[names.index(v)] += 1
        else:
            bad += 1
        v = input("투표: ")
    total = sum(counts)
    for i in range(len(names)):
        pct = 0.0
        if total:
            pct = counts[i] * 100 / total
        print("{}: {}표 ({:.1f}%)".format(names[i], counts[i], pct))
    print("무효표: " + str(bad) + "표")
    if total == 0:
        print("당선자 없음")
    else:
        a = counts.index(max(counts))
        if counts[a] > total / 2:
            print("당선:", names[a])
        else:
            rest = counts[:]
            rest[a] = -1
            b = rest.index(max(rest))
            print("결선 투표: " + names[a] + ", " + names[b])
