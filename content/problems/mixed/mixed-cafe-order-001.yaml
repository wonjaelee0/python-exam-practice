tests:
  - stdin: "라떼 2\n아메리카노 1\n주문 끝\n"
    public: true
  - stdin: "주문 끝\n"
  - stdin: "케이크 3\n라떼 2\n케이크 1\n주문 끝\n"
    note: 같은 메뉴 합치기 + 할인
  - stdin: "녹차 1\n아메리카노 10\n주문 끝\n"
    note: 합계가 정확히 20000원
  - stdin: "모카 2\n주문 끝\n"
    note: 없는 메뉴만 주문
hints:
  - "`주문 끝`은 띄어쓰기가 있으므로 `split()`하기 **전에** 비교하세요."
  - "영수증은 메뉴판 순서이므로 `for name in menu:`로 돌면서 주문된 메뉴만 출력합니다."
explanation: |
  주문 수량은 딕셔너리에 누적(`get(name, 0) + 수량`)하고, 출력할 때는 메뉴판 딕셔너리의 순서를 따릅니다.
