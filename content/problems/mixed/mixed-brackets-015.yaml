tests:
  - stdin: "{a[b(c)d]e}\n"
    public: true
  - stdin: "([)]\n"
    public: true
  - stdin: "hello\n"
    note: 괄호 없음
  - stdin: "())(\n"
    note: 여는 괄호 없이 닫힘
  - stdin: "a(b[c\n"
    note: 닫히지 않은 괄호가 여러 개
  - stdin: "()[]{}\n"
  - stdin: "}\n"
  - stdin: "((()))(\n"
  - stdin: "x{(})y\n"
    note: 종류가 엇갈림
hints:
  - "여는 괄호를 만나면 `[괄호, 위치]`를 스택(리스트)에 넣고, 닫는 괄호를 만나면 맨 위(`stack[-1]`)와 짝이 맞는지 확인해 꺼냅니다."
  - "끝까지 갔는데 스택이 비어 있지 않으면, 가장 앞에서 열린 괄호는 `stack[0]`입니다."
explanation: |
  괄호 검사는 스택의 대표 예제입니다. 개수만 세면 `([)]`처럼 종류가 엇갈린 경우를 잡지 못합니다.
  최대 깊이는 괄호를 넣을 때마다 `len(stack)`의 최댓값을 갱신하면 됩니다.
