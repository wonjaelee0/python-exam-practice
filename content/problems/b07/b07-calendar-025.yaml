hints:
  - "1900-01-01부터 그 달 1일 전날까지의 날짜 수를 세면, 월요일 기준 요일은 `날짜 수 % 7`입니다. 일요일을 0으로 바꾸려면 1을 더해 7로 나눈 나머지."
  - "앞쪽 빈칸 `\"  \"`과 날짜 `f\"{d:>2}\"`를 한 리스트에 담고, 7개씩 잘라 `\" \".join(...)`으로 출력하면 줄 끝 공백이 생기지 않습니다."
explanation: |
  `first_weekday`가 `days_in_month`와 `is_leap`을 다시 사용하는 것처럼, 작은 함수를 쌓아 올려 큰 기능을 만듭니다.
  한글 요일은 터미널에서 두 칸을 차지하므로 두 칸 정렬된 날짜와 줄이 맞습니다.
