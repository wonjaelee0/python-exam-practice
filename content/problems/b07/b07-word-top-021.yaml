          return text.split()


      def count_words(words):
          counts = {}
          for w in words:
              counts[w] = counts.get(w, 0) + 1
          return counts


      def top_n(counts, n):
          items = []
          order = 0
          for word in counts:
              items.append([-counts[word], order, word])
              order += 1
          items.sort()
          result = []
          for neg, order, word in items[:n]:
              result.append((word, -neg))
          return result


