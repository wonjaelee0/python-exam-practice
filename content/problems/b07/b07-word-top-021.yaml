hints:
  - "`top_n(count_words(tokenize(text)), n)`처럼 한 함수의 반환값을 다음 함수의 인자로 바로 넘길 수 있습니다."
  - "`[-개수, 단어]` 리스트를 정렬하면 개수 내림차순, 같으면 단어 오름차순이 됩니다."
explanation: |
  하나의 큰 문제를 '정리 → 세기 → 순위'의 작은 함수로 나눈 뒤 연결했습니다. 각 함수는 자기 일만 하고 결과를 반환합니다.
  정렬 기준이 두 개일 때 `[-개수, 단어]`처럼 리스트를 만들어 정렬하는 방법은 함수 없이도 쓸 수 있는 유용한 요령입니다.
