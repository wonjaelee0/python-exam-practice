id: b07-find-index-debug-012
title: "[버그 고치기] return 위치가 잘못됐어요"
unit: b07
difficulty: 3
tags: [func.return-early, loop.for, debug]
format: debug
statement: |
  목록에서 값을 찾는 두 함수가 있다.

  - `find_index(items, target)`: `target`이 **처음** 나오는 위치(0부터)를 반환하고, 없으면 `-1`을 반환해야 한다.
  - `find_all(items, target)`: `target`이 나오는 **모든** 위치를 리스트로 반환해야 한다.

  그런데 `return`의 위치가 잘못되어 결과가 이상하다. 두 함수를 고치시오. (함수 아래의 코드는 고치지 않아도 된다)

  - 입력 프롬프트: `목록: ` (공백으로 구분), `찾을 값: `
  - 출력 형식: `처음 위치: 1`, `모든 위치: [1, 3]`. 값이 없으면 `찾는 값이 없습니다`
starter: |
  def find_index(items, target):
      for i in range(len(items)):
          if items[i] == target:
              return i
          else:
              return -1


  def find_all(items, target):
      result = []
      for i in range(len(items)):
          if items[i] == target:
              result.append(i)
              return result
      return result


  items = input("목록: ").split()
  target = input("찾을 값: ")
  first = find_index(items, target)
  if first == -1:
      print("찾는 값이 없습니다")
  else:
      print(f"처음 위치: {first}")
      print(f"모든 위치: {find_all(items, target)}")
solution: |
  def find_index(items, target):
      for i in range(len(items)):
          if items[i] == target:
              return i
      return -1


  def find_all(items, target):
      result = []
      for i in range(len(items)):
          if items[i] == target:
              result.append(i)
      return result


  items = input("목록: ").split()
  target = input("찾을 값: ")
  first = find_index(items, target)
  if first == -1:
      print("찾는 값이 없습니다")
  else:
      print(f"처음 위치: {first}")
      print(f"모든 위치: {find_all(items, target)}")
alt_solutions:
  - |
    def find_index(items, target):
        if target in items:
            return items.index(target)
        return -1


    def find_all(items, target):
        return [i for i in range(len(items)) if items[i] == target]


    items = input("목록: ").split()
    target = input("찾을 값: ")
    first = find_index(items, target)
    if first == -1:
        print("찾는 값이 없습니다")
    else:
        print("처음 위치:", first)
        print("모든 위치:", find_all(items, target))
