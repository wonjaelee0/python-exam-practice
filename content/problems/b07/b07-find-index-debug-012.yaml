    note: 마지막에 있음
hints:
  - "`return`은 만나는 즉시 함수를 끝냅니다. 반복문 안의 `else: return -1`은 첫 번째 원소만 보고 끝내 버립니다."
  - "'끝까지 다 봤는데 없다'는 반복문이 끝난 **뒤**에 판단해야 합니다."
explanation: |
  `return`은 함수의 '출구'입니다. 반복문 안에 잘못 두면 첫 번째 반복에서 함수가 끝납니다.
  '찾으면 바로 반환'은 반복문 안에, '못 찾았다'는 반복문 밖(들여쓰기 한 단계 바깥)에 둡니다.
