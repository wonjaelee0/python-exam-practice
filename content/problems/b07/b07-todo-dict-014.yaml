id: b07-todo-dict-014
title: 날짜별 할 일 딕셔너리
unit: b07
difficulty: 3
tags: [func.dict-return, dict.list-values, tuple.unpack]
statement: |
  `(날짜, 할 일)` 튜플들의 리스트를 받아, 날짜를 키로 하고 그 날의 할 일 리스트를 값으로 하는 딕셔너리를 반환하는 함수 `make_todo_dict(pairs)`를 정의하시오.

  - 입력: `일정: ` 프롬프트로 `날짜 할 일` 형식을 한 줄씩 입력받다가 `종료`가 입력되면 멈춘다. 할 일에는 공백이 있을 수 있다 (예: `4/21 친구 만나기`).
  - 입력받은 일정들을 튜플 리스트로 만들어 함수를 호출한다.
  - 출력 (순서대로)
    - 반환된 딕셔너리: `{'4/20': ['스터디', '과제'], '4/21': ['운동', '친구 만나기']}`
    - 날짜마다(처음 나온 순서) `4/20: 스터디, 과제 (2개)` 형식
  - 일정이 하나도 없으면 `{}`와 `일정이 없습니다`를 출력한다.
starter: |
  def make_todo_dict(pairs):
      pass


  todos = []
solution: |
  def make_todo_dict(pairs):
      todo_dict = {}
      for date, task in pairs:
          if date in todo_dict:
              todo_dict[date].append(task)
          else:
              todo_dict[date] = [task]
      return todo_dict


  todos = []
  while True:
      line = input("일정: ")
      if line == "종료":
          break
      date, task = line.split(" ", 1)
      todos.append((date, task))
  result = make_todo_dict(todos)
  print(result)
  if len(result) == 0:
      print("일정이 없습니다")
  for date in result:
      tasks = result[date]
      print(f"{date}: {', '.join(tasks)} ({len(tasks)}개)")
alt_solutions:
  - |
    def make_todo_dict(pairs):
        d = {}
        for p in pairs:
            d.setdefault(p[0], []).append(p[1])
        return d


    todos = []
    line = input("일정: ")
    while line != "종료":
        parts = line.split()
        todos.append((parts[0], " ".join(parts[1:])))
        line = input("일정: ")
    result = make_todo_dict(todos)
    print(result)
    if not result:
        print("일정이 없습니다")
    for date, tasks in result.items():
        print(date + ": " + ", ".join(tasks) + " (" + str(len(tasks)) + "개)")
