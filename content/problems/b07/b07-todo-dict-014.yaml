tests:
  - stdin: "4/20 스터디\n4/21 운동\n4/20 과제\n4/21 친구 만나기\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 일정 없음
  - stdin: "1/1 새해 계획 세우기\n종료\n"
  - stdin: "3/2 A\n3/1 B\n3/2 C\n3/2 D\n종료\n"
hints:
  - "날짜가 이미 키로 있으면 `todo_dict[date].append(task)`, 없으면 `todo_dict[date] = [task]`."
  - "`line.split(\" \", 1)`은 첫 공백에서 한 번만 나눠 `['4/21', '친구 만나기']`를 만듭니다."
explanation: |
  값이 리스트인 딕셔너리를 만드는 전형적인 패턴입니다. 처음 보는 키면 리스트를 새로 만들고, 이미 있으면 그 리스트에 추가합니다.
  강의의 실습 6(시험 제외 표시)을 응용한 문제이지만, 6주차 딕셔너리와 7주차 함수를 함께 연습하기에 좋습니다.
