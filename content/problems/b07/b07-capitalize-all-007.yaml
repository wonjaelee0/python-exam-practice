id: b07-capitalize-all-007
title: 리스트의 단어 첫 글자 대문자로
unit: b07
difficulty: 2
tags: [func.list-arg, func.list-return, str.capitalize]
statement: |
  단어 리스트를 받아, 각 단어의 첫 글자는 대문자로, 나머지는 소문자로 바꾼 **새 리스트를 반환**하는 함수 `upper_all(words)`를 정의하시오.

  - 입력 프롬프트: `단어들: ` (공백으로 구분)
  - 출력 (순서대로)
    - 함수가 반환한 리스트: `['Apple', 'Banana', 'Cherry']`
    - `가장 긴 단어: Banana` (반환된 리스트에서 가장 긴 단어, 길이가 같으면 앞의 단어)
  - 참고: `str.capitalize()`는 첫 글자를 대문자로, 나머지를 소문자로 바꾼 새 문자열을 돌려준다.
starter: |
  def upper_all(words):
      pass


  data = input("단어들: ").split()
solution: |
  def upper_all(words):
      result = []
      for w in words:
          result.append(w.capitalize())
      return result


  data = input("단어들: ").split()
  caps = upper_all(data)
  print(caps)
  longest = caps[0]
  for w in caps:
      if len(w) > len(longest):
          longest = w
  print(f"가장 긴 단어: {longest}")
alt_solutions:
  - |
    def upper_all(words):
        return [w[0].upper() + w[1:].lower() for w in words]


    data = input("단어들: ").split()
    caps = upper_all(data)
    print(caps)
    lengths = [len(w) for w in caps]
    print("가장 긴 단어:", caps[lengths.index(max(lengths))])
mutants:
