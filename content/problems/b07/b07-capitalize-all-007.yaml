      for w in caps:
          if len(w) > len(longest):
              longest = w
      print(f"가장 긴 단어: {longest}")
  - name: 첫 글자만 바꾸고 나머지는 그대로 둠
    code: |
      def upper_all(words):
          result = []
          for w in words:
              result.append(w[0].upper() + w[1:])
          return result


      data = input("단어들: ").split()
      caps = upper_all(data)
      print(caps)
      longest = caps[0]
      for w in caps:
          if len(w) > len(longest):
              longest = w
      print(f"가장 긴 단어: {longest}")
  - name: 길이가 같으면 뒤의 단어를 고름
    code: |
      def upper_all(words):
          result = []
          for w in words:
              result.append(w.capitalize())
          return result


      data = input("단어들: ").split()
      caps = upper_all(data)
      print(caps)
      longest = caps[0]
      for w in caps:
          if len(w) >= len(longest):
