      print(f"가장 긴 단어: {longest}")
tests:
  - stdin: "apple banana cherry\n"
    public: true
  - stdin: "pYTHON jAVA c\n"
    note: 나머지 글자는 소문자로
  - stdin: "hello\n"
  - stdin: "a bb cc\n"
    note: 길이가 같은 단어
hints:
  - "빈 리스트 `result = []`를 만들고, 반복하며 `result.append(w.capitalize())`한 뒤 `return result`."
  - "반환된 리스트를 변수에 받아 두면 출력과 '가장 긴 단어' 찾기에 모두 쓸 수 있습니다."
explanation: |
  함수가 리스트를 '반환'하면 호출한 쪽에서 그 리스트를 다시 활용할 수 있습니다.
  `capitalize()`는 나머지 글자를 소문자로 바꾸므로 `pYTHON` → `Python`이 됩니다. 첫 글자만 `upper()`하면 `PYTHON`이 되어 다릅니다.
