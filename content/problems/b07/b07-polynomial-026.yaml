    note: 합이 0
  - stdin: "5\n2 0\n-1\n"
    note: 차수가 다름
  - stdin: "0 0 3\n1 -1\n0\n"
    note: 앞의 계수가 0
  - stdin: "-1 1\n-1 -1\n10\n"
hints:
  - "곱셈: `p[i]`와 `q[j]`를 곱한 값은 결과의 `i + j`번 칸에 더해집니다 (차수가 높은 항부터 쓰는 표현에서도 그대로 성립)."
  - "덧셈: 짧은 쪽 앞에 0을 채워 길이를 맞추면 같은 차수끼리 같은 위치에 옵니다."
  - "대입은 호너의 방법 `value = value * x + c`를 쓰면 거듭제곱 없이 계산됩니다."
explanation: |
  리스트를 받아 새 리스트를 반환하는 함수(`poly_add`, `poly_mul`)와 문자열을 만드는 함수(`poly_str`)를 나누면,
  `poly_str(poly_add(p, q))`처럼 조합해서 쓸 수 있습니다. 문자열 규칙(부호, 계수 1, 0인 항)은 경우를 하나씩 나눠 처리하세요.
