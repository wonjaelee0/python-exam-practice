id: b07-polynomial-026
title: 다항식 계산기
unit: b07
difficulty: 5
tags: [func.compose, func.list-return, str.build]
statement: |
  다항식을 **계수 리스트**(차수가 높은 항부터)로 나타낸다. 예: `[1, -3, 2]`는 x² - 3x + 2.
  다음 함수들을 정의하고 활용하시오.

  - `poly_add(p, q)`: 두 다항식의 합 (차수가 다르면 **낮은 차수 쪽**을 맞춰 더한다)
  - `poly_mul(p, q)`: 두 다항식의 곱
  - `poly_eval(p, x)`: x를 대입한 값
  - `poly_str(p)`: 다항식을 문자열로 반환. 규칙:
    - 계수가 0인 항은 쓰지 않는다. 모든 계수가 0이면 `0`
    - 지수는 `x^2`처럼, 1차는 `x`, 상수항은 숫자만
    - 계수가 1 또는 -1이면 숫자 1을 쓰지 않는다 (상수항 제외): `x^2`, `-x`
    - 항 사이는 ` + ` 또는 ` - `, 첫 항이 음수면 앞에 `-`를 붙인다: `-x^2 + 2x - 1`

  - 입력 프롬프트: `첫 다항식 계수: `, `둘째 다항식 계수: ` (공백으로 구분된 정수), `x 값: `
  - 출력 형식 (입력 `1 -3 2`, `1 1`, `2`의 예)

  ```
  P(x) = x^2 - 3x + 2
  Q(x) = x + 1
  P + Q = x^2 - 2x + 3
  P × Q = x^3 - 2x^2 - x + 2
  (P × Q)(2) = 0
  ```
starter: |
  def poly_add(p, q):
      pass


  def poly_mul(p, q):
      pass


  def poly_eval(p, x):
      pass


  def poly_str(p):
      pass


  p = [int(c) for c in input("첫 다항식 계수: ").split()]
  q = [int(c) for c in input("둘째 다항식 계수: ").split()]
  x = int(input("x 값: "))
solution: |
  def poly_add(p, q):
      n = max(len(p), len(q))
      p2 = [0] * (n - len(p)) + p
      q2 = [0] * (n - len(q)) + q
      result = []
      for i in range(n):
          result.append(p2[i] + q2[i])
      return result


  def poly_mul(p, q):
      result = [0] * (len(p) + len(q) - 1)
      for i in range(len(p)):
          for j in range(len(q)):
              result[i + j] += p[i] * q[j]
      return result


  def poly_eval(p, x):
      value = 0
      for c in p:
          value = value * x + c
      return value


  def poly_str(p):
      deg = len(p) - 1
      text = ""
      for k in range(len(p)):
          c = p[k]
          e = deg - k
          if c == 0:
              continue
          if e == 0:
              body = str(abs(c))
          else:
              coef = "" if abs(c) == 1 else str(abs(c))
              body = coef + ("x" if e == 1 else "x^" + str(e))
          if text == "":
              text = ("-" if c < 0 else "") + body
          else:
              text += (" - " if c < 0 else " + ") + body
      if text == "":
          return "0"
      return text


  p = [int(c) for c in input("첫 다항식 계수: ").split()]
  q = [int(c) for c in input("둘째 다항식 계수: ").split()]
  x = int(input("x 값: "))
  prod = poly_mul(p, q)
  print(f"P(x) = {poly_str(p)}")
  print(f"Q(x) = {poly_str(q)}")
  print(f"P + Q = {poly_str(poly_add(p, q))}")
  print(f"P × Q = {poly_str(prod)}")
  print(f"(P × Q)({x}) = {poly_eval(prod, x)}")
alt_solutions:
  - |
    def to_dict(p):
        d = {}
        for k in range(len(p)):
            e = len(p) - 1 - k
            d[e] = d.get(e, 0) + p[k]
        return d


    def to_list(d):
        top = max(d.keys())
        return [d.get(e, 0) for e in range(top, -1, -1)]


    def poly_add(p, q):
        a = to_dict(p)
        for e, c in to_dict(q).items():
            a[e] = a.get(e, 0) + c
        return to_list(a)


    def poly_mul(p, q):
        out = {}
        for e1, c1 in to_dict(p).items():
            for e2, c2 in to_dict(q).items():
                out[e1 + e2] = out.get(e1 + e2, 0) + c1 * c2
        return to_list(out)


    def poly_eval(p, x):
        return sum([c * x ** e for e, c in to_dict(p).items()])


    def poly_str(p):
        terms = []
        for e, c in sorted(to_dict(p).items(), reverse=True):
            if c == 0:
                continue
            if e == 0:
                t = str(abs(c))
            elif e == 1:
                t = ("" if abs(c) == 1 else str(abs(c))) + "x"
            else:
                t = ("" if abs(c) == 1 else str(abs(c))) + "x^" + str(e)
            terms.append(("-" if c < 0 else "+", t))
        if not terms:
            return "0"
        s = ("-" if terms[0][0] == "-" else "") + terms[0][1]
        for sign, t in terms[1:]:
            s += " " + sign + " " + t
        return s


    p = [int(c) for c in input("첫 다항식 계수: ").split()]
    q = [int(c) for c in input("둘째 다항식 계수: ").split()]
    x = int(input("x 값: "))
    prod = poly_mul(p, q)
    print("P(x) = " + poly_str(p))
    print("Q(x) = " + poly_str(q))
    print("P + Q = " + poly_str(poly_add(p, q)))
    print("P × Q = " + poly_str(prod))
    print("(P × Q)(" + str(x) + ") = " + str(poly_eval(prod, x)))
