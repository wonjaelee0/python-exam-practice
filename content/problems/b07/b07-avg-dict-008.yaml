          print(f"{name}의 평균 점수는 {avg:.1f}점입니다.")
          print(f"최고 점수: {max(scores)}점")


      name = input("이름: ")
      scores = [int(x) for x in input("점수들: ").split()]
      s = {"name": name, "scores": scores}
      print_avg_score(s)
  - name: 과목 수를 3으로 고정
    code: |
      def print_avg_score(student):
          name = student["name"]
          scores = student["scores"]
          avg = sum(scores) / 3
          print(f"{name}의 평균 점수는 {avg:.1f}점입니다.")
          print(f"최고 점수: {max(scores)}점")


      name = input("이름: ")
      scores = [int(x) for x in input("점수들: ").split()]
      s = {"name": name, "scores": scores}
      print_avg_score(s)
tests:
  - stdin: "Jisoo\n85 90 100\n"
    public: true
  - stdin: "민수\n70\n"
  - stdin: "Kim\n0 100 55 61\n"
  - stdin: "A\n99 98\n"
hints:
  - "딕셔너리 값은 `student[\"name\"]`, `student[\"scores\"]`로 꺼냅니다."
  - "평균은 `sum(scores) / len(scores)`, 출력은 `{avg:.1f}`."
explanation: |
  딕셔너리 하나로 여러 정보를 묶어 함수에 넘기면, 매개변수를 여러 개 두지 않아도 됩니다.
  점수 개수는 학생마다 다를 수 있으니 `len()`으로 구해야 합니다.
