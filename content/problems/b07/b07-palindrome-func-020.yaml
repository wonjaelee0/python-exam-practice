  - name: 공백만 지우고 문장부호는 남김
    code: |
      def clean(s):
          return s.replace(" ", "").lower()


      def is_palindrome(s):
          c = clean(s)
          return c == c[::-1]


      total = 0
      found = 0
      while True:
          s = input("문장: ")
          if s == "종료":
              break
          total += 1
          if is_palindrome(s):
              found += 1
              print("회문입니다")
          else:
              print("회문이 아닙니다")
      print(f"회문 개수: {found}/{total}")
tests:
  - stdin: "Was it a car or a cat I saw?\nhello\n다시 합창합시다\n종료\n"
    public: true
  - stdin: "A man, a plan, a canal: Panama\n종료\n"
  - stdin: "종료\n"
    note: 문장 없음
  - stdin: "ab\nAbBa\n12321\n종료\n"
hints:
  - "`ch.isalnum()`은 영문자, 숫자, 한글이면 `True`입니다. 공백과 문장부호는 `False`."
  - "문자열을 뒤집는 가장 쉬운 방법은 슬라이싱 `c[::-1]`입니다."
explanation: |
  `is_palindrome` 안에서 `clean`을 호출해 '정리'와 '판별'을 나눴습니다. 이렇게 역할을 나누면 각 함수를 따로 확인하고 고치기 쉽습니다.
  `return c == c[::-1]`처럼 비교식의 결과(`True`/`False`)를 바로 반환할 수 있습니다.
