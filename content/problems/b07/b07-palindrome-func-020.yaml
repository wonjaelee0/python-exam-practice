id: b07-palindrome-func-020
title: 문장 정리 함수로 회문 판별
unit: b07
difficulty: 3
tags: [func.compose, func.bool-return, str.isalnum]
statement: |
  두 함수를 정의하시오.

  - `clean(s)`: 문자열에서 글자와 숫자(`isalnum()`이 참인 문자)만 남기고 모두 소문자로 바꾼 문자열을 반환
  - `is_palindrome(s)`: `clean`으로 정리한 문자열이 앞뒤로 읽어도 같으면 `True`를 반환

  문장을 `종료`가 입력될 때까지 입력받으며 판별 결과를 출력하시오.

  - 입력 프롬프트: `문장: `
  - 문장마다 `회문입니다` 또는 `회문이 아닙니다`
  - 마지막 줄: `회문 개수: 2/3` (회문 수 / 입력한 문장 수)
starter: |
  def clean(s):
      pass


  def is_palindrome(s):
      pass
solution: |
  def clean(s):
      result = ""
      for ch in s:
          if ch.isalnum():
              result += ch.lower()
      return result


  def is_palindrome(s):
      c = clean(s)
      return c == c[::-1]


  total = 0
  found = 0
  while True:
      s = input("문장: ")
      if s == "종료":
          break
      total += 1
      if is_palindrome(s):
          found += 1
          print("회문입니다")
      else:
          print("회문이 아닙니다")
  print(f"회문 개수: {found}/{total}")
alt_solutions:
  - |
    def clean(s):
        return "".join([ch for ch in s.lower() if ch.isalnum()])


    def is_palindrome(s):
        c = clean(s)
        for i in range(len(c) // 2):
            if c[i] != c[len(c) - 1 - i]:
                return False
        return True


    results = []
    s = input("문장: ")
    while s != "종료":
        results.append(is_palindrome(s))
        print("회문입니다" if results[-1] else "회문이 아닙니다")
        s = input("문장: ")
    print("회문 개수: " + str(results.count(True)) + "/" + str(len(results)))
