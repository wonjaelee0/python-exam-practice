tests:
  - stdin: "abc\nPassw0rd!\nhello world\n종료\n"
    public: true
  - stdin: "Abcdefg1\n종료\n"
    note: 정확히 8자, 특수문자 없음
  - stdin: "A1!aaaaa\nZZZZ9999#\n종료\n"
  - stdin: "종료\n"
  - stdin: "Good Pass1\n종료\n"
    note: 공백은 특수문자가 아님
hints:
  - "문자 하나씩 보며 `isupper()`, `islower()`, `isdigit()`으로 종류를 확인하고, 있었는지를 `True`/`False` 변수에 기록합니다."
  - "어긴 규칙을 리스트에 담아 반환하면, 받는 쪽에서 `\", \".join(problems)`로 바로 출력할 수 있습니다."
explanation: |
  여러 조건을 검사해 '어긴 것 목록'을 리스트로 반환하면, 결과가 비었는지(`len == 0`)로 통과 여부까지 알 수 있습니다.
  특수문자의 정의(글자·숫자·공백이 아님)를 정확히 지키는 것이 핵심입니다. `isalpha()`만 쓰면 숫자도 특수문자가 됩니다.
