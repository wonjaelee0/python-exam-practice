id: b07-password-024
title: 비밀번호 규칙 검사 함수
unit: b07
difficulty: 4
tags: [func.list-return, str.isupper-isdigit, loop.while-sentinel]
statement: |
  비밀번호를 받아 **어긴 규칙 목록**을 리스트로 반환하는 함수 `check_password(pw)`를 정의하시오. 규칙은 아래 순서대로 검사해, 어긴 것을 이 순서대로 담는다.

  1. 8자 이상 → 어기면 `8자 미만`
  2. 공백이 없어야 함 → `공백 포함`
  3. 대문자가 있어야 함 → `대문자 없음`
  4. 소문자가 있어야 함 → `소문자 없음`
  5. 숫자가 있어야 함 → `숫자 없음`
  6. 특수문자(글자·숫자·공백이 아닌 문자)가 있어야 함 → `특수문자 없음`

  비밀번호를 `종료`가 입력될 때까지 입력받아 검사하시오.

  - 입력 프롬프트: `비밀번호: `
  - 비밀번호마다: 어긴 규칙이 없으면 `사용 가능`, 있으면 `사용 불가: 대문자 없음, 숫자 없음`
  - 마지막 줄: `사용 가능: 1개` (사용 가능한 비밀번호 수)
starter: |
  def check_password(pw):
      problems = []

      return problems
solution: |
  def check_password(pw):
      problems = []
      upper = False
      lower = False
      digit = False
      special = False
      for ch in pw:
          if ch.isupper():
              upper = True
          elif ch.islower():
              lower = True
          elif ch.isdigit():
              digit = True
          elif not ch.isalnum() and ch != " ":
              special = True
      if len(pw) < 8:
          problems.append("8자 미만")
      if " " in pw:
          problems.append("공백 포함")
      if not upper:
          problems.append("대문자 없음")
      if not lower:
          problems.append("소문자 없음")
      if not digit:
          problems.append("숫자 없음")
      if not special:
          problems.append("특수문자 없음")
      return problems


  ok_count = 0
  while True:
      pw = input("비밀번호: ")
      if pw == "종료":
          break
      problems = check_password(pw)
      if len(problems) == 0:
          ok_count += 1
          print("사용 가능")
      else:
          print("사용 불가: " + ", ".join(problems))
  print(f"사용 가능: {ok_count}개")
alt_solutions:
  - |
    def has(pw, test):
        for ch in pw:
            if test(ch):
                return True
        return False


    def is_special(ch):
        return not ch.isalnum() and ch != " "


    def check_password(pw):
        rules = [
            (len(pw) >= 8, "8자 미만"),
            (" " not in pw, "공백 포함"),
            (has(pw, str.isupper), "대문자 없음"),
            (has(pw, str.islower), "소문자 없음"),
            (has(pw, str.isdigit), "숫자 없음"),
            (has(pw, is_special), "특수문자 없음"),
        ]
        return [msg for ok, msg in rules if not ok]


    count = 0
    pw = input("비밀번호: ")
    while pw != "종료":
        bad = check_password(pw)
        if bad:
            print("사용 불가:", ", ".join(bad))
        else:
            print("사용 가능")
            count += 1
        pw = input("비밀번호: ")
    print("사용 가능: " + str(count) + "개")
