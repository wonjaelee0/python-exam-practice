tests:
  - stdin: "김밥 떡볶이 김밥 라면 김밥 라면\n"
    public: true
  - stdin: "라면 김밥 김밥 라면\n"
    note: 동점 — 먼저 주문된 음식
  - stdin: "치킨\n"
  - stdin: "피자 콜라 피자 콜라 콜라 피자 샐러드\n"
hints:
  - "`if item in order_dict:`이면 1 더하고, 아니면 `order_dict[item] = 1`로 새로 만듭니다."
  - "`return best, best_count`로 두 값을 함께 돌려주고 `food, n = most_ordered(counts)`로 받습니다."
explanation: |
  집계 결과를 딕셔너리로 반환하면 그 결과를 다른 함수(`most_ordered`)에 다시 넘겨 활용할 수 있습니다.
  '같으면 먼저 나온 것'은 `>`로 비교해야 합니다. `>=`이면 뒤에 나온 같은 값으로 바뀝니다.
