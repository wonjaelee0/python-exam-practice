id: b07-count-orders-010
title: 주문 수량 딕셔너리 반환
unit: b07
difficulty: 3
tags: [func.dict-return, dict.count, func.multi-return]
statement: |
  두 함수를 정의하시오.

  - `count_orders(order_list)`: 주문 리스트를 받아 `{음식: 주문 수}` 딕셔너리를 반환한다 (처음 주문된 순서대로).
  - `most_ordered(order_dict)`: 위 딕셔너리를 받아 가장 많이 주문된 음식과 그 수를 **함께 반환**한다. 수가 같으면 먼저 주문된 음식.

  주문을 입력받아 두 함수를 차례로 호출하고 결과를 출력하시오.

  - 입력 프롬프트: `주문: ` (공백으로 구분, 1개 이상)
  - 출력 형식
    - 반환된 딕셔너리: `{'김밥': 3, '떡볶이': 1, '라면': 2}`
    - `가장 많이 주문된 음식: 김밥 (3개)`
starter: |
  def count_orders(order_list):
      pass


  def most_ordered(order_dict):
      pass


  orders = input("주문: ").split()
solution: |
  def count_orders(order_list):
      order_dict = {}
      for item in order_list:
          if item in order_dict:
              order_dict[item] += 1
          else:
              order_dict[item] = 1
      return order_dict


  def most_ordered(order_dict):
      best = ""
      best_count = 0
      for item in order_dict:
          if order_dict[item] > best_count:
              best = item
              best_count = order_dict[item]
      return best, best_count


  orders = input("주문: ").split()
  counts = count_orders(orders)
  print(counts)
  food, n = most_ordered(counts)
  print(f"가장 많이 주문된 음식: {food} ({n}개)")
alt_solutions:
  - |
    def count_orders(order_list):
        d = {}
        for item in order_list:
            d[item] = d.get(item, 0) + 1
        return d


    def most_ordered(order_dict):
        m = max(order_dict.values())
        for k, v in order_dict.items():
            if v == m:
                return k, v


    orders = input("주문: ").split()
    counts = count_orders(orders)
    print(counts)
    result = most_ordered(counts)
    print("가장 많이 주문된 음식: " + result[0] + " (" + str(result[1]) + "개)")
