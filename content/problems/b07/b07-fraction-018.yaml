tests:
  - stdin: "12/18\n1/2\n"
    public: true
  - stdin: "4/2\n3/6\n"
    note: 정수가 되는 분수
  - stdin: "5/7\n2/7\n"
    note: 합이 1
  - stdin: "100/75\n1/3\n"
hints:
  - "`reduce`는 `gcd`를, `add`는 `reduce`를 불러 씁니다. 함수가 함수를 부를 수 있습니다."
  - "a/b + c/d = (a×d + c×b) / (b×d)를 계산한 뒤 `reduce`로 약분합니다."
explanation: |
  작은 함수(`gcd`)를 여러 곳에서 재사용하는 연습입니다. 분자와 분모처럼 늘 함께 다니는 두 값은 튜플로 함께 반환하면 편합니다.
