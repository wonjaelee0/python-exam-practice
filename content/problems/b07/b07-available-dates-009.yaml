      my_busy_dates = input("내 바쁜 날짜: ").split()
      result = get_available_dates(friend_dates, my_busy_dates)
      if len(result) == 0:
          print("가능한 날짜가 없습니다")
      else:
          print(f"가능한 날짜: {result}")
  - name: 빈 결과를 따로 처리하지 않음
    code: |
      def get_available_dates(friend_dates, my_busy_dates):
          days = []
          for d in friend_dates:
              if d not in my_busy_dates:
                  days.append(d)
          return days


      friend_dates = input("친구 가능 날짜: ").split()
