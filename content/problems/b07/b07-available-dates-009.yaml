tests:
  - stdin: "4/20 4/21 4/22 4/23\n4/21 4/23\n"
    public: true
  - stdin: "4/1 4/2\n4/1 4/2\n"
    note: 가능한 날이 없음
  - stdin: "5/5\n\n"
    note: 바쁜 날이 없음
  - stdin: "1/3 1/1 1/2\n1/9\n"
hints:
  - "`for d in friend_dates:` 안에서 `if d not in my_busy_dates:`이면 `days.append(d)`."
  - "빈 리스트는 `len(result) == 0`으로 확인합니다."
explanation: |
  리스트를 받아 조건에 맞는 것만 골라 새 리스트로 돌려주는 '필터' 함수입니다. 원래 리스트는 바뀌지 않습니다.
