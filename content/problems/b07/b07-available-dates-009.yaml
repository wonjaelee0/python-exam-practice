id: b07-available-dates-009
title: 약속 가능한 날짜 찾기
unit: b07
difficulty: 2
tags: [func.list-arg, func.list-return, list.in]
statement: |
  친구가 가능한 날짜 리스트와 내가 바쁜 날짜 리스트를 받아, **친구가 가능하면서 내가 바쁘지 않은 날짜**만 담은 리스트를 반환하는 함수
  `get_available_dates(friend_dates, my_busy_dates)`를 정의하시오. 날짜 순서는 친구 리스트의 순서를 따른다.

  - 입력 프롬프트: `친구 가능 날짜: `, `내 바쁜 날짜: ` (각각 공백으로 구분, 바쁜 날짜는 없을 수도 있다)
  - 출력 형식: `가능한 날짜: ['4/20', '4/22']`
  - 가능한 날짜가 하나도 없으면 `가능한 날짜가 없습니다`를 출력한다.
starter: |
  def get_available_dates(friend_dates, my_busy_dates):
      days = []

      return days


  friend_dates = input("친구 가능 날짜: ").split()
  my_busy_dates = input("내 바쁜 날짜: ").split()
solution: |
  def get_available_dates(friend_dates, my_busy_dates):
      days = []
      for d in friend_dates:
          if d not in my_busy_dates:
              days.append(d)
      return days


  friend_dates = input("친구 가능 날짜: ").split()
  my_busy_dates = input("내 바쁜 날짜: ").split()
  result = get_available_dates(friend_dates, my_busy_dates)
  if len(result) == 0:
      print("가능한 날짜가 없습니다")
  else:
      print(f"가능한 날짜: {result}")
alt_solutions:
  - |
    def get_available_dates(friend_dates, my_busy_dates):
        return [d for d in friend_dates if d not in my_busy_dates]


    friend_dates = input("친구 가능 날짜: ").split()
    my_busy_dates = input("내 바쁜 날짜: ").split()
    result = get_available_dates(friend_dates, my_busy_dates)
    if result:
        print("가능한 날짜:", result)
    else:
        print("가능한 날짜가 없습니다")
mutants:
  - name: 조건을 반대로 (겹치는 날짜를 고름)
    code: |
