  - name: 집합으로 중복을 지워 순서가 바뀜 (정렬)
    code: |
      def filter_menu(requests, available):
          result = []
          for item in sorted(set(requests)):
              if item in available:
                  result.append(item)
          return result


      def unavailable(requests, available):
          result = []
          for item in sorted(set(requests)):
              if item not in available:
                  result.append(item)
          return result


      requests = input("요청: ").split()
      available = input("판매 메뉴: ").split()
      menu = filter_menu(requests, available)
      print(f"주문 메뉴: {menu}")
      print(f"제외: {unavailable(requests, available)}")
      print(f"주문 수: {len(menu)}개")
tests:
  - stdin: "떡볶이 김밥 짜장면 김밥 치킨 초밥\n김밥 떡볶이 치킨 라면\n"
    public: true
  - stdin: "라면 라면\n라면\n"
  - stdin: "피자\n김밥\n"
    note: 주문할 수 있는 메뉴가 없음
  - stdin: "치킨 김밥 치킨 피자 피자\n김밥 치킨\n"
hints:
  - "결과 리스트에 넣기 전에 `item not in result`로 이미 넣었는지 확인하면 순서를 지키며 중복을 없앨 수 있습니다."
  - "`set()`으로 중복을 없애면 순서가 보장되지 않습니다."
explanation: |
  강의 예제처럼 `list(set(requests))`를 쓰면 중복은 사라지지만 **순서가 매번 달라질 수 있어** 정확한 출력이 필요한 문제에서는 위험합니다.
  순서를 지키려면 '처음 보는 것만 추가'하는 방식이 안전합니다.
