tests:
  - stdin: "담기 사과 3\n담기 우유 1\n빼기 사과 1\n계산\n종료\n"
    public: true
  - stdin: "담기 사과 1\n빼기 사과 1\n계산\n종료\n"
    note: 다 빼면 장바구니가 빔
  - stdin: "담기 수박 1\n빼기 빵 1\n담기 빵 2\n담기 빵 1\n계산\n종료\n"
  - stdin: "계산\n종료\n"
  - stdin: "담기 바나나 4\n빼기 바나나 5\n빼기 바나나 2\n담기 사과 2\n계산\n종료\n"
hints:
  - "딕셔너리를 인자로 받은 함수가 `cart[name] = …`처럼 바꾸면, 호출한 쪽의 `cart`도 바뀝니다. 그래서 `add_item`은 반환값이 없어도 됩니다."
  - "딕셔너리에서 키를 지우려면 `del cart[name]`."
explanation: |
  리스트·딕셔너리는 함수에 넘겨도 복사되지 않으므로 함수 안에서 바로 고칠 수 있습니다 (앞의 행렬 문제와 반대로, 여기서는 그것이 목적입니다).
  수량이 0인 상품을 지우지 않으면 `계산`에 `사과 x0 = 0원`이 남고, 장바구니가 빈 것도 알아채지 못합니다.
