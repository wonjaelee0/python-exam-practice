id: b07-cart-023
title: 장바구니 딕셔너리를 바꾸는 함수
unit: b07
difficulty: 4
tags: [func.dict-arg, func.mutation, func.bool-return]
statement: |
  상품 가격표 `PRICES`가 주어진다 (시작 코드). 장바구니 딕셔너리 `cart`(`{상품: 수량}`)를 다루는 함수들을 정의하시오.

  - `add_item(cart, name, qty)`: 장바구니에 상품을 qty개 더한다 (반환값 없음, `cart`를 직접 바꾼다)
  - `remove_item(cart, name, qty)`: 담긴 수량이 qty보다 적으면 아무것도 바꾸지 않고 `False`. 아니면 빼고 `True`. 수량이 0이 되면 장바구니에서 그 상품을 지운다
  - `total_price(cart)`: 총액을 반환

  `명령: ` 프롬프트로 `종료`가 입력될 때까지 명령을 처리하시오.

  | 명령 | 출력 |
  |---|---|
  | `담기 사과 3` | `담기 완료: 사과 3개` (가격표에 없는 상품이면 `없는 상품입니다`) |
  | `빼기 사과 1` | `빼기 완료: 사과 1개` (수량이 모자라면 `수량이 부족합니다`) |
  | `계산` | 담긴 순서대로 `사과 x2 = 2000원`, 마지막에 `총액: 4500원` (비었으면 `장바구니가 비었습니다`) |
starter: |
  PRICES = {"사과": 1000, "바나나": 500, "우유": 2500, "빵": 3000}


  def add_item(cart, name, qty):
      pass


  def remove_item(cart, name, qty):
      pass


  def total_price(cart):
      pass


  cart = {}
solution: |
  PRICES = {"사과": 1000, "바나나": 500, "우유": 2500, "빵": 3000}


  def add_item(cart, name, qty):
      cart[name] = cart.get(name, 0) + qty


  def remove_item(cart, name, qty):
      if cart.get(name, 0) < qty:
          return False
      cart[name] -= qty
      if cart[name] == 0:
          del cart[name]
      return True


  def total_price(cart):
      total = 0
      for name in cart:
          total += PRICES[name] * cart[name]
      return total


  cart = {}
  while True:
      parts = input("명령: ").split()
      if parts[0] == "종료":
          break
      if parts[0] == "담기":
          name = parts[1]
          qty = int(parts[2])
          if name not in PRICES:
              print("없는 상품입니다")
          else:
              add_item(cart, name, qty)
              print(f"담기 완료: {name} {qty}개")
      elif parts[0] == "빼기":
          name = parts[1]
          qty = int(parts[2])
          if remove_item(cart, name, qty):
              print(f"빼기 완료: {name} {qty}개")
          else:
              print("수량이 부족합니다")
      elif parts[0] == "계산":
          if len(cart) == 0:
              print("장바구니가 비었습니다")
          else:
              for name in cart:
                  print(f"{name} x{cart[name]} = {PRICES[name] * cart[name]}원")
              print(f"총액: {total_price(cart)}원")
alt_solutions:
  - |
    PRICES = {"사과": 1000, "바나나": 500, "우유": 2500, "빵": 3000}


    def add_item(cart, name, qty):
        if name in cart:
            cart[name] += qty
        else:
            cart[name] = qty


    def remove_item(cart, name, qty):
        have = cart[name] if name in cart else 0
        if have >= qty:
            if have == qty:
                cart.pop(name)
            else:
                cart[name] = have - qty
            return True
        return False


    def total_price(cart):
        return sum([PRICES[k] * v for k, v in cart.items()])


    cart = {}
    cmd = input("명령: ").split()
    while cmd[0] != "종료":
        if cmd[0] == "담기":
            if cmd[1] in PRICES:
                add_item(cart, cmd[1], int(cmd[2]))
                print("담기 완료: " + cmd[1] + " " + cmd[2] + "개")
            else:
                print("없는 상품입니다")
        elif cmd[0] == "빼기":
            if remove_item(cart, cmd[1], int(cmd[2])):
                print("빼기 완료: " + cmd[1] + " " + cmd[2] + "개")
            else:
                print("수량이 부족합니다")
        elif cmd[0] == "계산":
            if not cart:
                print("장바구니가 비었습니다")
            else:
                for k, v in cart.items():
                    print(k + " x" + str(v) + " = " + str(PRICES[k] * v) + "원")
                print("총액: " + str(total_price(cart)) + "원")
        cmd = input("명령: ").split()
