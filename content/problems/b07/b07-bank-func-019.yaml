  - stdin: "출금 10\n입금 300\n출금 301\n출금 299\n조회\n종료\n"
hints:
  - "`withdraw`는 `return True, balance - amount` 또는 `return False, balance`. 받는 쪽은 `ok, balance = withdraw(balance, amount)`."
  - "함수 안에서 `balance`를 바꿔도 바깥 `balance`는 그대로입니다. 반환값을 다시 대입해야 합니다."
explanation: |
  '성공 여부 + 결과값'을 튜플로 함께 반환하는 것은 자주 쓰는 패턴입니다. 바깥의 잔액은 반환값을 대입해야만 바뀝니다.
  '금액 이하이면 가능'이므로 잔액 전부를 출금하는 경우(`amount == balance`)도 성공해야 합니다.
