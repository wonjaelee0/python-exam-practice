  - stdin: "입금 5000\n출금 3000\n출금 5000\n조회\n종료\n"
    public: true
  - stdin: "입금 1000\n출금 1000\n조회\n종료\n"
    note: 잔액 전부 출금
  - stdin: "종료\n"
  - stdin: "입금 -5\n출금 0\n송금 100\n조회\n종료\n"
