id: b07-bank-func-019
title: 입출금 함수로 만드는 통장
unit: b07
difficulty: 4
tags: [func.multi-return, func.bool-return, loop.while-sentinel]
statement: |
  잔액과 금액을 받아 처리하는 두 함수를 정의하시오.

  - `deposit(balance, amount)`: 입금 후 잔액을 반환
  - `withdraw(balance, amount)`: 잔액이 충분하면(금액 이하이면 가능) `(True, 출금 후 잔액)`, 부족하면 `(False, 원래 잔액)`을 반환

  잔액 0원에서 시작해, `명령: ` 프롬프트로 명령을 `종료`가 입력될 때까지 처리하시오.

  | 명령 | 출력 |
  |---|---|
  | `입금 5000` | `입금 완료: 잔액 5000원` |
  | `출금 3000` | `출금 완료: 잔액 2000원`, 잔액이 부족하면 `잔액 부족: 잔액 2000원` |
  | `조회` | `잔액: 2000원` |
  | 그 밖의 명령 | `알 수 없는 명령` |

  - 입금·출금 금액이 0 이하이면 처리하지 않고 `금액 오류`를 출력한다.
  - `종료`가 입력되면 `거래 횟수: 2`를 출력한다 (성공한 입금·출금 횟수).
starter: |
  def deposit(balance, amount):
      pass


  def withdraw(balance, amount):
      pass


  balance = 0
  count = 0
solution: |
  def deposit(balance, amount):
      return balance + amount


  def withdraw(balance, amount):
      if amount <= balance:
          return True, balance - amount
      return False, balance


  balance = 0
  count = 0
  while True:
      parts = input("명령: ").split()
      cmd = parts[0]
      if cmd == "종료":
          print(f"거래 횟수: {count}")
          break
      if cmd == "조회":
          print(f"잔액: {balance}원")
      elif cmd == "입금" or cmd == "출금":
          amount = int(parts[1])
          if amount <= 0:
              print("금액 오류")
          elif cmd == "입금":
              balance = deposit(balance, amount)
              count += 1
              print(f"입금 완료: 잔액 {balance}원")
          else:
              ok, balance = withdraw(balance, amount)
              if ok:
                  count += 1
                  print(f"출금 완료: 잔액 {balance}원")
              else:
                  print(f"잔액 부족: 잔액 {balance}원")
      else:
          print("알 수 없는 명령")
alt_solutions:
  - |
    def deposit(balance, amount):
        balance += amount
        return balance


    def withdraw(balance, amount):
        if balance - amount >= 0:
            return (True, balance - amount)
        else:
            return (False, balance)


    balance = 0
    count = 0
    line = input("명령: ")
    while line != "종료":
        words = line.split()
        if words[0] == "조회":
            print("잔액: " + str(balance) + "원")
        elif words[0] in ["입금", "출금"]:
            amount = int(words[1])
            if amount <= 0:
                print("금액 오류")
            elif words[0] == "입금":
                balance = deposit(balance, amount)
                count += 1
                print("입금 완료: 잔액 " + str(balance) + "원")
            else:
                result = withdraw(balance, amount)
                balance = result[1]
                if result[0]:
                    count += 1
                    print("출금 완료: 잔액 " + str(balance) + "원")
                else:
                    print("잔액 부족: 잔액 " + str(balance) + "원")
        else:
            print("알 수 없는 명령")
        line = input("명령: ")
    print("거래 횟수:", count)
