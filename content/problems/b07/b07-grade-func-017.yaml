  - name: 나온 등급만 분포에 넣음
    code: |
      def to_grade(score):
          if score >= 90:
              return "A"
          if score >= 80:
              return "B"
          if score >= 70:
              return "C"
          if score >= 60:
              return "D"
          return "F"


      dist = {}
      while True:
          line = input("이름 점수: ")
          if line == "종료":
              break
          name, score = line.split()
          score = int(score)
          grade = to_grade(score)
          dist[grade] = dist.get(grade, 0) + 1
          print(f"{name}: {score}점 → {grade}")
      print(f"등급 분포: {dist}")
tests:
  - stdin: "민수 87\n지은 90\n하늘 59\n도윤 80\n종료\n"
    public: true
  - stdin: "종료\n"
    note: 학생 없음
  - stdin: "가람 100\n나래 70\n다온 60\n라희 69\n종료\n"
  - stdin: "서준 0\n종료\n"
hints:
  - "높은 등급부터 `if score >= 90: return \"A\"`처럼 검사하면, 위에서 반환된 경우는 아래로 내려오지 않으므로 `elif` 없이도 됩니다."
  - "분포 딕셔너리를 처음부터 `{\"A\": 0, \"B\": 0, \"C\": 0, \"D\": 0, \"F\": 0}`으로 만들어 두면 순서와 0인 등급이 모두 지켜집니다."
explanation: |
  `return`이 함수를 끝내므로, 조건을 위에서부터 차례로 검사해 맞으면 바로 반환하는 구조가 깔끔합니다.
  경계값(90, 80, …)은 '이상'이므로 `>=`입니다.
