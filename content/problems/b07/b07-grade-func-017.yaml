id: b07-grade-func-017
title: 등급 함수와 등급 분포
unit: b07
difficulty: 3
tags: [func.return-early, dict.count, loop.while-sentinel]
statement: |
  점수를 받아 등급 문자를 반환하는 함수 `to_grade(score)`를 정의하시오.
  90점 이상 `A`, 80점 이상 `B`, 70점 이상 `C`, 60점 이상 `D`, 나머지 `F`.

  그다음 `이름 점수`를 `종료`가 입력될 때까지 입력받으며 각 학생의 등급을 출력하고, 마지막에 등급 분포를 출력하시오.

  - 입력 프롬프트: `이름 점수: `
  - 학생마다: `민수: 87점 → B`
  - 마지막 줄: `등급 분포: {'A': 1, 'B': 2, 'C': 0, 'D': 0, 'F': 1}` (A부터 F까지 모든 등급을 이 순서로, 없는 등급은 0)
starter: |
  def to_grade(score):
      pass
solution: |
  def to_grade(score):
      if score >= 90:
          return "A"
      if score >= 80:
          return "B"
      if score >= 70:
          return "C"
      if score >= 60:
          return "D"
      return "F"


  dist = {"A": 0, "B": 0, "C": 0, "D": 0, "F": 0}
  while True:
      line = input("이름 점수: ")
      if line == "종료":
          break
      name, score = line.split()
      score = int(score)
      grade = to_grade(score)
      dist[grade] += 1
      print(f"{name}: {score}점 → {grade}")
  print(f"등급 분포: {dist}")
alt_solutions:
  - |
    def to_grade(score):
        cuts = [90, 80, 70, 60]
        letters = ["A", "B", "C", "D"]
        for i in range(4):
            if score >= cuts[i]:
                return letters[i]
        return "F"


    dist = {}
    for g in "ABCDF":
        dist[g] = 0
    line = input("이름 점수: ")
    while line != "종료":
        parts = line.split()
        g = to_grade(int(parts[1]))
        dist[g] = dist[g] + 1
        print(parts[0] + ": " + parts[1] + "점 → " + g)
        line = input("이름 점수: ")
    print("등급 분포:", dist)
mutants:
  - name: 경계 점수를 놓침 (> 사용)
