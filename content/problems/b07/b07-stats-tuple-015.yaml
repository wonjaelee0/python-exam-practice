      nums = [int(x) for x in input("수들: ").split()]
      lo, hi, avg = stats(nums)
      print(f"최솟값: {lo}, 최댓값: {hi}, 평균: {avg:.1f}")
      print(f"범위: {hi - lo}")
  - name: 평균을 몫(//)으로 계산
    code: |
      def stats(nums):
          lo = nums[0]
          hi = nums[0]
          total = 0
          for n in nums:
              if n < lo:
                  lo = n
              if n > hi:
                  hi = n
              total += n
          return lo, hi, total // len(nums)


      nums = [int(x) for x in input("수들: ").split()]
      lo, hi, avg = stats(nums)
      print(f"최솟값: {lo}, 최댓값: {hi}, 평균: {avg:.1f}")
      print(f"범위: {hi - lo}")
tests:
  - stdin: "3 9 1 7 5\n"
    public: true
  - stdin: "-5 -2 -9\n"
    note: 모두 음수
  - stdin: "4\n"
  - stdin: "1 2\n"
hints:
  - "최솟값·최댓값의 시작값은 0이 아니라 **첫 번째 원소** `nums[0]`으로 두어야 음수만 있을 때도 맞습니다."
  - "`return lo, hi, avg`로 반환하고 `lo, hi, avg = stats(nums)`로 받습니다."
explanation: |
  최댓값을 0에서 시작하면 모든 수가 음수일 때 틀립니다. 첫 원소에서 시작하는 습관을 들이세요.
  값 3개를 튜플로 반환하고 언패킹으로 받으면 함수 하나로 여러 결과를 얻을 수 있습니다.
