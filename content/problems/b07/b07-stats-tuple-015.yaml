id: b07-stats-tuple-015
title: 최솟값·최댓값·평균을 한 번에
unit: b07
difficulty: 2
tags: [func.multi-return, func.list-arg, loop.min-max]
statement: |
  정수 리스트를 받아 최솟값, 최댓값, 평균을 **차례로 함께 반환**하는 함수 `stats(nums)`를 정의하시오.
  (연습을 위해 `min()`, `max()`, `sum()`을 쓰지 말고 반복문으로 구해 보자.)

  - 입력 프롬프트: `수들: ` (공백으로 구분된 정수, 1개 이상)
  - 출력 형식
    - `최솟값: 1, 최댓값: 9, 평균: 5.0` (평균은 소수 첫째 자리까지)
    - `범위: 8` (최댓값 - 최솟값)
starter: |
  def stats(nums):
      pass


  nums = [int(x) for x in input("수들: ").split()]
solution: |
  def stats(nums):
      lo = nums[0]
      hi = nums[0]
      total = 0
      for n in nums:
          if n < lo:
              lo = n
          if n > hi:
              hi = n
          total += n
      return lo, hi, total / len(nums)


  nums = [int(x) for x in input("수들: ").split()]
  lo, hi, avg = stats(nums)
  print(f"최솟값: {lo}, 최댓값: {hi}, 평균: {avg:.1f}")
  print(f"범위: {hi - lo}")
alt_solutions:
  - |
    def stats(nums):
        return min(nums), max(nums), sum(nums) / len(nums)


    nums = [int(x) for x in input("수들: ").split()]
    result = stats(nums)
    print("최솟값: {}, 최댓값: {}, 평균: {:.1f}".format(result[0], result[1], result[2]))
    print("범위:", result[1] - result[0])
