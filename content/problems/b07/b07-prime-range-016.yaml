tests:
  - stdin: "1 10\n"
    public: true
  - stdin: "20 2\n"
    note: 앞의 수가 더 큼
  - stdin: "14 16\n"
    note: 소수 없음
  - stdin: "2 2\n"
  - stdin: "90 113\n"
  - stdin: "0 3\n"
    note: 0과 1은 소수가 아님
hints:
  - "`is_prime`에서 나누어떨어지는 수를 찾으면 바로 `return False`. 반복이 끝까지 가면 `return True`."
  - "`primes_between`은 `if is_prime(n):`처럼 다른 함수를 불러 씁니다. b도 포함하려면 `range(a, b + 1)`."
explanation: |
  큰 일을 작은 함수로 나누고(`is_prime`), 그 함수를 다른 함수(`primes_between`)에서 재사용하는 것이 함수의 핵심 활용법입니다.
  `return`이 반복을 바로 끝내 주므로, 나누어떨어지는 수를 하나라도 찾으면 더 볼 필요가 없습니다.
