id: b07-prime-range-016
title: 소수 판별 함수로 범위 안의 소수 찾기
unit: b07
difficulty: 3
tags: [func.bool-return, func.compose, loop.for]
statement: |
  두 함수를 정의하시오.

  - `is_prime(n)`: n이 소수이면 `True`, 아니면 `False`를 반환한다. (소수: 1과 자기 자신만으로 나누어떨어지는 2 이상의 정수)
  - `primes_between(a, b)`: `is_prime`을 이용해 a 이상 b 이하의 소수를 리스트로 반환한다. a가 b보다 크면 두 값을 바꿔서 구한다.

  - 입력 프롬프트: `범위: ` (두 정수, 예: `1 10`)
  - 출력 형식: `소수: [2, 3, 5, 7]`, `개수: 4`
starter: |
  def is_prime(n):
      pass


  def primes_between(a, b):
      pass


  a, b = input("범위: ").split()
  a = int(a)
  b = int(b)
solution: |
  def is_prime(n):
      if n < 2:
          return False
      for d in range(2, n):
          if d * d > n:
              break
          if n % d == 0:
              return False
      return True


  def primes_between(a, b):
      if a > b:
          a, b = b, a
      result = []
      for n in range(a, b + 1):
          if is_prime(n):
              result.append(n)
      return result


  a, b = input("범위: ").split()
  a = int(a)
  b = int(b)
  primes = primes_between(a, b)
  print(f"소수: {primes}")
  print(f"개수: {len(primes)}")
alt_solutions:
  - |
    def is_prime(n):
        if n <= 1:
            return False
        count = 0
        for d in range(1, n + 1):
            if n % d == 0:
                count += 1
        return count == 2


    def primes_between(a, b):
        lo = min(a, b)
        hi = max(a, b)
        return [n for n in range(lo, hi + 1) if is_prime(n)]


    a, b = input("범위: ").split()
    a = int(a)
    b = int(b)
    primes = primes_between(a, b)
    print("소수:", primes)
    print("개수:", len(primes))
