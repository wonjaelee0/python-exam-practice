id: core6-03-stable-books
title: "[6주차 도전3] 안정 삽입 정렬로 책 정리 (내림차순)"
unit: core6
difficulty: 4
tags: [core.w6, sort.insertion, sort.stable]
statement: |
  > 컴퓨팅 핵심 6주차 도전문제 3(달리기 기록표 정리)과 같은 유형입니다.

  책장에 **두꺼운 책부터** 꽂으려고 한다. (제목, 쪽수) 기록을 쪽수 내림차순으로 삽입 정렬하고, 이동 횟수를 출력하시오.
  쪽수가 같으면 **먼저 입력된 책이 앞**에 있어야 한다 (안정 정렬).

  | 항목 | 역할 |
  |---|---|
  | `books` | (제목, 쪽수) 튜플의 리스트 |
  | `insertion_sort(books)` | 쪽수 내림차순으로 리스트 자체를 정렬하고, 항목을 오른쪽으로 한 칸 옮긴 **이동 횟수**를 반환 |

  - 두 번째 항목부터 `key`에 보관하고, 정렬된 앞부분에서 **key보다 쪽수가 작은** 항목만 한 칸씩 오른쪽으로 옮긴 뒤 빈 자리에 key를 놓는다.
  - `books[j + 1] = books[j]` 한 번이 이동 1회이다.
  - 제목은 정렬 기준이 아니다. `sort()`, `sorted()`, `insert()`를 쓰지 않는다.
  - 입력: `책 수: `, 책마다 `제목과 쪽수: ` (제목은 공백 없음, 서로 다름)
  - 출력: 정렬된 순서로 `제목 쪽수`를 한 줄씩, 마지막 줄 `이동 횟수: 3회`
  - 조건: 책은 1권 이상 8권 이하, 쪽수는 1 이상 2000 이하의 정수이다.
starter: |
  def insertion_sort(books):
      pass


  n = int(input("책 수: "))
  books = []
  for _ in range(n):
      title, pages = input("제목과 쪽수: ").split()
      books.append((title, int(pages)))
  moves = insertion_sort(books)
  for title, pages in books:
      print(title, pages)
  print(f"이동 횟수: {moves}회")
solution: |
  def insertion_sort(books):
      moves = 0
      for i in range(1, len(books)):
          key = books[i]
          j = i - 1
          while j >= 0 and books[j][1] < key[1]:
              books[j + 1] = books[j]
              moves += 1
              j -= 1
          books[j + 1] = key
      return moves


  n = int(input("책 수: "))
  books = []
  for _ in range(n):
      title, pages = input("제목과 쪽수: ").split()
      books.append((title, int(pages)))
  moves = insertion_sort(books)
  for title, pages in books:
      print(title, pages)
  print(f"이동 횟수: {moves}회")
alt_solutions:
  - |
    def insertion_sort(books):
        moves = 0
        for i in range(1, len(books)):
            key = books[i]
            j = i
            while j > 0:
                if books[j - 1][1] >= key[1]:
                    break
                books[j] = books[j - 1]
                moves += 1
                j -= 1
            books[j] = key
        return moves


    n = int(input("책 수: "))
    books = []
    for _ in range(n):
        line = input("제목과 쪽수: ").split()
        books.append((line[0], int(line[1])))
    moves = insertion_sort(books)
    for book in books:
        print(book[0] + " " + str(book[1]))
    print("이동 횟수: " + str(moves) + "회")
