hints:
  - "내림차순이므로 앞 항목의 쪽수가 key보다 **작을 때만** 옮깁니다. 같을 때 멈춰야 먼저 입력된 책이 앞에 남습니다."
  - "`books[j][1]`이 쪽수입니다. 튜플끼리 바로 비교하면 제목이 먼저 비교됩니다."
explanation: |
  삽입 정렬은 '엄격한 비교(<, >)'로 옮길 때만 안정 정렬이 됩니다. 같은 값을 만나면 멈추므로 기존 순서가 유지됩니다.
  이동 횟수는 입력이 이미 내림차순이면 0회, 오름차순이면 최대 n(n-1)/2회입니다.
