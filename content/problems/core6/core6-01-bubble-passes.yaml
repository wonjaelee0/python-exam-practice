tests:
  - stdin: "3 8 5 8 1\n"
    public: true
  - stdin: "7\n"
    note: 원소 1개
  - stdin: "1 2 3 4\n"
  - stdin: "9 7 7 2\n"
    note: 이미 내림차순이어도 n - 1회차 모두 출력
  - stdin: "10 20\n"
hints:
  - "내림차순이므로 왼쪽 값이 **더 작을 때** 교환합니다 (`scores[j] < scores[j + 1]`)."
  - "회차 출력은 안쪽 반복이 끝난 뒤, 바깥 반복 안에 둡니다."
explanation: |
  버블 정렬은 한 차례마다 남은 부분의 가장 작은 값(내림차순일 때)을 오른쪽 끝으로 밀어냅니다. 그래서 i회차가 끝나면 오른쪽 i칸이 확정되어 안쪽 반복 범위가 `n - 1 - i`로 줄어듭니다.
  회차를 n - 2번만 돌리면 앞의 두 값이 정리되지 않은 채 끝날 수 있습니다.
