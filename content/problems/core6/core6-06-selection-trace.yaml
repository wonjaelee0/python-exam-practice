- 문자열도 `<`로 비교할 수 있습니다 (사전 순서).
explanation: |
  선택 정렬은 회차마다 최대 한 번 교환합니다. `<=`로 비교하면 같은 값 중 뒤의 것을 골라 같은 이름끼리 쓸데없이 교환하게 됩니다.
