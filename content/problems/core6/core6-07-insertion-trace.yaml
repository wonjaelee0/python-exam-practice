hints:
- while이 끝났을 때 `j`는 key보다 작거나 같은 값의 위치(또는 -1)이므로, key의 자리는 `j + 1`입니다.
explanation: |
  삽입 정렬은 앞부분이 늘 정렬된 상태를 유지하며 한 칸씩 넓혀 갑니다. 같은 값은 옮기지 않아야(`>`) 안정 정렬이 되고, 같은 값 뒤에 새 값이 놓입니다.
