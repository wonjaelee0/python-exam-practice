id: core6-08-two-key-insertion
title: '[6주차 응용3] 두 기준 삽입 정렬 (학과 → 점수)'
unit: core6
difficulty: 4
tags:
- core.w6
- sort.insertion
- sort.stable
- sort.multikey
statement: |
  > 컴퓨팅 핵심 6주차 도전문제 3(달리기 기록표 정리)과 추가문제 1(사진 공모전 전시작 선정)을 응용한 문제입니다.

  (이름, 학과, 점수) 기록을 **학과 오름차순**, 같은 학과 안에서는 **점수 내림차순**으로 삽입 정렬하시오. 학과와 점수가 모두 같으면 입력 순서를 유지한다.

  | 함수 | 역할 |
  |---|---|
  | `comes_before(a, b)` | 기록 a가 b보다 **반드시 앞에** 와야 하면 `True` (학과가 다르면 학과 비교, 같으면 점수 비교. 완전히 같은 순위면 `False`) |
  | `insertion_sort(records)` | `comes_before(key, 앞 기록)`이 참인 동안만 앞 기록을 옮겨 리스트 자체를 정렬 |

  - `sort()`, `sorted()`, `insert()`를 쓰지 않는다.
  - 입력 프롬프트: `학생 수: `, 학생마다 `이름 학과 점수: `
  - 출력: 정렬된 순서로 `경영 지우 88점` (학과 이름 점수) 형식
  - 조건: 학생은 1명 이상 8명 이하, 이름과 학과에는 공백이 없다. 점수는 0 이상 100 이하의 정수
starter: |
  def comes_before(a, b):
      pass


  def insertion_sort(records):
      pass


  n = int(input("학생 수: "))
  records = []
  for _ in range(n):
      name, dept, score = input("이름 학과 점수: ").split()
      records.append((name, dept, int(score)))
solution: |
  def comes_before(a, b):
      if a[1] != b[1]:
          return a[1] < b[1]
      return a[2] > b[2]


  def insertion_sort(records):
      for i in range(1, len(records)):
          key = records[i]
          j = i - 1
          while j >= 0 and comes_before(key, records[j]):
              records[j + 1] = records[j]
              j -= 1
          records[j + 1] = key


  n = int(input("학생 수: "))
  records = []
  for _ in range(n):
      name, dept, score = input("이름 학과 점수: ").split()
      records.append((name, dept, int(score)))
  insertion_sort(records)
  for name, dept, score in records:
      print(f"{dept} {name} {score}점")
alt_solutions:
- |
  def comes_before(a, b):
      return (a[1], -a[2]) < (b[1], -b[2])


  def insertion_sort(records):
      for i in range(1, len(records)):
          j = i
          while j > 0 and comes_before(records[j], records[j - 1]):
              records[j], records[j - 1] = records[j - 1], records[j]
              j -= 1


  records = []
  for _ in range(int(input("학생 수: "))):
      p = input("이름 학과 점수: ").split()
      records.append((p[0], p[1], int(p[2])))
  insertion_sort(records)
  for r in records:
      print(r[1] + " " + r[0] + " " + str(r[2]) + "점")
