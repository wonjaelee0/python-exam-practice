explanation: |
  여러 기준 정렬은 '첫 기준이 다르면 첫 기준으로, 같으면 다음 기준으로' 비교합니다. `sorted(key=lambda r: (r[1], -r[2]))`와 같은 결과를 삽입 정렬로 직접 만든 것입니다.
