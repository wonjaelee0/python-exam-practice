tests:
  - stdin: "5 2 9 1 7\n"
    public: true
  - stdin: "1 2 3\n"
    note: 교환 0회
  - stdin: "2 1 1\n"
  - stdin: "5 5\n"
  - stdin: "8\n"
  - stdin: "4 3 2 1\n"
hints:
  - "`min_index = i`로 시작해 `j`를 i + 1부터 끝까지 보며 더 작은 값을 만나면 `min_index = j`."
  - "교환은 안쪽 반복이 끝난 뒤 한 번만, `min_index != i`일 때만 합니다."
explanation: |
  선택 정렬은 한 자리를 확정할 때 최대 한 번만 교환합니다. 그래서 전체 교환 횟수는 최대 n - 1회로, 교환 비용이 큰 상황에서 유리합니다.
  `<=`로 비교하면 같은 값 중 뒤쪽을 골라 불필요한 교환이 생길 수 있습니다.
