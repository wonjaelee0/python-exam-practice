hints:
- 바깥 반복의 횟수만 `n - 1`에서 `k`로 바꾸면 됩니다.
explanation: |
  선택 정렬의 i회차는 i번째로 작은 값을 제자리에 놓습니다. 그래서 k회차만 하면 전체를 정렬하지 않고도 k번째로 작은 값을 알 수 있습니다.
