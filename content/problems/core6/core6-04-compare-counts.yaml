tests:
  - stdin: "3 1 2 5 4\n"
    public: true
  - stdin: "1 2 3 4\n"
    note: 이미 정렬됨
  - stdin: "\n"
    note: 빈 리스트
  - stdin: "7\n"
  - stdin: "4 3 2 1\n"
  - stdin: "2 2 1 2\n"
hints:
  - "버블: 차례마다 `swapped = False`로 시작하고, 교환이 있으면 True. 차례가 끝났을 때 False면 `break`."
  - "삽입: `while j >= 0:` 안에서 먼저 `count += 1`을 한 뒤 비교 결과에 따라 옮기거나 `break`하면 거짓인 비교도 셀 수 있습니다."
explanation: |
  이미 정렬된 입력이면 조기 종료 버블은 한 차례(n - 1회 비교) 만에, 삽입 정렬도 원소마다 1회씩(n - 1회) 비교하고 끝납니다.
  역순 입력이면 두 방법 모두 n(n-1)/2회가 됩니다. 입력 상태에 따라 비교 횟수가 크게 달라지는 것이 핵심입니다.
