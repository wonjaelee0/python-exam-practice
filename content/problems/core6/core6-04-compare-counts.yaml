id: core6-04-compare-counts
title: "[6주차 도전4] 버블 vs 삽입 정렬 비교 횟수"
unit: core6
difficulty: 4
tags: [core.w6, sort.bubble, sort.insertion, sort.count]
statement: |
  > 컴퓨팅 핵심 6주차 도전문제 4(정렬 방법의 비교 횟수 조사)와 같은 유형입니다.

  같은 데이터를 **조기 종료 버블 정렬**과 **삽입 정렬**로 각각 오름차순 정렬하고, 원소 비교 횟수를 세어 비교하시오.

  | 함수 | 역할 |
  |---|---|
  | `bubble_count(values)` | 리스트 자체를 조기 종료 버블 정렬하고 비교 횟수를 반환 |
  | `insertion_count(values)` | 리스트 자체를 삽입 정렬하고 비교 횟수를 반환 |

  비교 횟수의 기준:

  - 원소 값 두 개를 비교할 때마다 1회로 센다. 조건이 거짓이어도 1회이다. 인덱스 검사(`j >= 0` 등)와 교환·대입은 세지 않는다.
  - 버블: 각 차례마다 왼쪽부터 인접한 값을 비교(`values[j] > values[j + 1]`)하고, 끝나면 오른쪽 범위를 하나 줄인다. 한 차례 동안 교환이 없었으면 그 차례의 비교까지 센 뒤 종료한다.
  - 삽입: 두 번째 원소부터 key로 두고, 앞 원소와 `values[j] > key`를 비교해 참이면 한 칸 옮기고 계속, **거짓이면 그 비교까지 1회로 센 뒤** 멈춘다. j가 맨 앞을 지나면(-1) 비교 없이 멈춘다.
  - 원소가 2개 미만이면 둘 다 0회이다.

  - 두 함수에는 같은 원본의 서로 다른 복사본을 넘긴다. `sort()`, `sorted()`를 쓰지 않는다.
  - 입력 프롬프트: `정수 목록(공백 구분): ` (빈 줄이면 빈 리스트)
  - 출력 (네 줄): `버블 결과: [...]`, `버블 비교: 7회`, `삽입 결과: [...]`, `삽입 비교: 6회`
starter: |
  def bubble_count(values):
      pass


  def insertion_count(values):
      pass


  numbers = list(map(int, input("정수 목록(공백 구분): ").split()))
  a = numbers[:]
  b = numbers[:]
solution: |
  def bubble_count(values):
      count = 0
      n = len(values)
      for i in range(n - 1):
          swapped = False
          for j in range(n - 1 - i):
              count += 1
              if values[j] > values[j + 1]:
                  values[j], values[j + 1] = values[j + 1], values[j]
                  swapped = True
          if not swapped:
              break
      return count


  def insertion_count(values):
      count = 0
      for i in range(1, len(values)):
          key = values[i]
          j = i - 1
          while j >= 0:
              count += 1
              if values[j] > key:
                  values[j + 1] = values[j]
                  j -= 1
              else:
                  break
          values[j + 1] = key
      return count


  numbers = list(map(int, input("정수 목록(공백 구분): ").split()))
  a = numbers[:]
  b = numbers[:]
  bubble = bubble_count(a)
  insertion = insertion_count(b)
  print(f"버블 결과: {a}")
  print(f"버블 비교: {bubble}회")
  print(f"삽입 결과: {b}")
  print(f"삽입 비교: {insertion}회")
alt_solutions:
  - |
    def bubble_count(values):
        count = 0
        end = len(values) - 1
        swapped = True
        while swapped and end > 0:
            swapped = False
            for j in range(end):
                count += 1
                if values[j + 1] < values[j]:
                    values[j], values[j + 1] = values[j + 1], values[j]
                    swapped = True
            end -= 1
        return count


    def insertion_count(values):
        count = 0
        for i in range(1, len(values)):
            j = i
            while j > 0:
                count += 1
                if values[j - 1] <= values[j]:
                    break
                values[j - 1], values[j] = values[j], values[j - 1]
                j -= 1
        return count


    numbers = [int(x) for x in input("정수 목록(공백 구분): ").split()]
    a = list(numbers)
    b = list(numbers)
    c1 = bubble_count(a)
    c2 = insertion_count(b)
    print("버블 결과:", a)
    print("버블 비교: " + str(c1) + "회")
    print("삽입 결과:", b)
    print("삽입 비교: " + str(c2) + "회")
