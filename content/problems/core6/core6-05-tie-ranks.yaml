hints:
  - "정렬 후 k번째 사람의 점수(`entries[k - 1][1]`)를 기준선으로 두고, 그 이상인 사람을 모두 선발합니다."
  - "순위는 '바로 앞 사람과 점수가 다를 때만' `i + 1`로 바꿉니다."
explanation: |
  안정 정렬 덕분에 같은 점수끼리는 접수 순서가 유지됩니다. 동점자를 함께 선발하면 인원이 k명보다 많아질 수 있으므로, 실제 선발 인원을 따로 세어 출력합니다.
  공동 순위(1, 1, 3)는 '정렬된 위치 + 1'을 쓰되 앞 사람과 점수가 같으면 앞 사람의 순위를 그대로 이어받는 방식으로 구합니다.
