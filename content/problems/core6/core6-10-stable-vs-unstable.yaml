hints:
- 선택 정렬은 멀리 떨어진 두 기록을 교환하므로, 같은 점수끼리의 순서가 바뀔 수 있습니다.
explanation: |
  삽입 정렬(엄격 비교)은 안정 정렬이고, 교환을 하는 선택 정렬은 안정 정렬이 아닙니다. 첫 예시에서 맨 뒤의 95점을 맨 앞과 교환하면서 민수가 지우 뒤로 밀려납니다.
  동점자의 순서가 중요할 때(먼저 접수한 사람 우선 등)는 안정 정렬을 골라야 합니다.
