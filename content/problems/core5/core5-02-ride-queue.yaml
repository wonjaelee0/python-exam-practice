solution: |
  class Queue:
      def __init__(self):
          self.queue = []

      def enqueue(self, value):
          self.queue.append(value)

      def dequeue(self):
          if self.isEmpty():
              return None
          return self.queue.pop(0)

      def peek(self):
          if self.isEmpty():
              return None
          return self.queue[0]

      def isEmpty(self):
          return len(self.queue) == 0

      def size(self):
          return len(self.queue)


  line = Queue()
  n = int(input("명령 수: "))
  for _ in range(n):
      parts = input("명령: ").split()
      if parts[0] == "줄서기":
          line.enqueue(parts[1])
      elif parts[0] == "탑승":
          seats = int(parts[1])
          riders = []
          while len(riders) < seats and not line.isEmpty():
              riders.append(line.dequeue())
          if riders:
              print("탑승: " + ", ".join(riders))
          else:
              print("대기 인원이 없습니다.")
      elif parts[0] == "다음":
          person = line.peek()
          if person is None:
              print("대기 인원이 없습니다.")
          else:
              print(f"다음 차례: {person}")
      else:
          print(f"대기 인원: {line.size()}명")
alt_solutions:
  - |
    class Queue:
        def __init__(self):
            self.queue = []

        def enqueue(self, value):
            self.queue.append(value)

        def dequeue(self):
            return self.queue.pop(0) if self.queue else None

        def peek(self):
            return self.queue[0] if self.queue else None

        def isEmpty(self):
            return self.queue == []

        def size(self):
            return len(self.queue)


    line = Queue()
    n = int(input("명령 수: "))
    for _ in range(n):
        parts = input("명령: ").split()
        cmd = parts[0]
        if cmd == "줄서기":
            line.enqueue(parts[1])
        elif cmd == "탑승":
            count = min(int(parts[1]), line.size())
            if count == 0:
                print("대기 인원이 없습니다.")
            else:
                names = [line.dequeue() for _ in range(count)]
                print("탑승:", ", ".join(names))
        elif cmd == "다음":
            if line.isEmpty():
                print("대기 인원이 없습니다.")
            else:
                print("다음 차례:", line.peek())
        else:
            print("대기 인원: " + str(line.size()) + "명")
