  - "`\", \".join(리스트)`로 이름 사이에 쉼표와 공백을 넣을 수 있습니다."
explanation: |
  큐는 먼저 들어온 것이 먼저 나가는(FIFO) 구조라 `pop(0)`으로 앞에서 꺼냅니다. `pop()`을 쓰면 나중에 온 사람이 먼저 타는 스택이 됩니다.
  반복 조건에 `not line.isEmpty()`를 함께 두면 남은 인원이 K보다 적을 때도 안전하게 처리됩니다.
