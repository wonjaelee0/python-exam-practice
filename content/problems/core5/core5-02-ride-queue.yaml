id: core5-02-ride-queue
title: "[5주차 도전2] 놀이기구 대기줄 큐"
unit: core5
difficulty: 3
tags: [core.w5, queue.class]
statement: |
  > 컴퓨팅 핵심 5주차 도전문제 2(도서관 프린터 대기열)와 같은 유형입니다.

  놀이기구 대기줄을 리스트 기반 `Queue` 클래스로 관리하시오. 리스트의 앞이 큐의 앞이며, 뒤로 줄을 서고 앞에서 탑승한다.

  | 메서드 | 역할 |
  |---|---|
  | `Queue()` | 빈 리스트를 `self.queue`에 저장 |
  | `enqueue(value)` | 맨 뒤에 추가 |
  | `dequeue()` | 맨 앞을 제거하고 반환 (`pop(0)` 사용). 비어 있으면 `None` |
  | `peek()` | 맨 앞을 제거하지 않고 반환. 비어 있으면 `None` |
  | `isEmpty()` | 비어 있으면 `True` |
  | `size()` | 대기 인원 수를 반환 |

  명령 (첫 줄에 명령 수, 다음 줄부터 한 줄씩):

  - `줄서기 이름`: 맨 뒤에 선다(출력 없음).
  - `탑승 K`: 앞에서부터 **최대 K명**이 탑승한다. 탑승한 사람이 있으면 `탑승: 민수, 지우`처럼 `, `로 이어 출력하고, 대기 인원이 없으면 `대기 인원이 없습니다.`를 출력한다. K보다 적게 기다리면 있는 사람만 탑승한다.
  - `다음`: `다음 차례: 이름`, 비어 있으면 `대기 인원이 없습니다.`
  - `인원`: `대기 인원: 3명`

  - 입력 프롬프트: `명령 수: `, 명령마다 `명령: `
  - 조건: K는 1 이상 10 이하. `collections.deque`는 쓰지 않는다. 클래스 밖에서는 `line`의 메서드만 사용한다.
