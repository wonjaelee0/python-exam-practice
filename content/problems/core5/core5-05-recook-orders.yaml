  - stdin: "9\n주문 a\n주문 b\n주문 c\n완료\n완료\n재조리\n재조리\n현황\n완료\n"
  - stdin: "8\n주문 x\n완료\n주문 y\n재조리\n완료\n완료\n완료\n현황\n"
hints:
  - "대기열은 `append`(뒤에 넣기)와 `popleft`(앞에서 꺼내기), 완료 기록은 `append`와 `pop`(최근 것 꺼내기)만 씁니다."
  - "`\", \".join(orders)`는 deque에도 쓸 수 있습니다."
explanation: |
  한 문제 안에서 큐(먼저 온 주문 먼저)와 스택(최근 완료 먼저)을 함께 쓰는 구조입니다.
  어느 자료구조의 **어느 끝**에서 넣고 빼는지가 결과를 정합니다. 재조리를 맨 앞으로 넣으면 곧바로 다시 조리되고, 맨 뒤로 넣으면 기존 대기 주문 뒤로 밀립니다.
