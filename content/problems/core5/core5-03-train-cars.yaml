hints:
  - "빈 덱은 거짓으로 취급되므로 `if train:`으로 칸이 있는지 확인할 수 있습니다."
  - "순환은 `train.append(train.popleft())` 한 줄로 쓸 수 있습니다."
explanation: |
  덱(deque)은 양쪽 끝 모두에서 넣고 빼는 연산이 빠른 자료구조입니다. 리스트의 `pop(0)`이나 `insert(0, x)`와 달리 남은 원소를 옮기지 않습니다.
  `"-".join(train)`처럼 덱도 리스트와 같이 반복·join에 쓸 수 있습니다.
