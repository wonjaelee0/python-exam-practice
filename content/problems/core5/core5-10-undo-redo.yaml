- name: 다시 하기를 가장 오래된 취소부터
  code: |
    done = []
    undone = []
    n = int(input("명령 수: "))
    for _ in range(n):
        parts = input("명령: ").split()
        cmd = parts[0]
        if cmd == "입력":
            done.append(parts[1])
            undone.clear()
        elif cmd == "취소":
            if done:
                word = done.pop()
                undone.append(word)
                print(f"취소: {word}")
            else:
