  note: 새 입력 뒤 다시 하기
hints:
- 취소와 다시는 서로 반대 방향으로 맨 위 원소를 옮기는 연산입니다.
- 새 입력이 들어오면 `undone.clear()`로 다시 하기 기록을 지웁니다.
explanation: |
  되돌리기와 다시 하기는 둘 다 '가장 최근 것부터'이므로 스택 두 개로 구현합니다. 새 작업이 생기면 이전에 취소한 작업으로 돌아갈 수 없으므로 취소 스택을 비우는 것이 일반적인 편집기의 규칙입니다.
