id: core5-01-browser-back
title: "[5주차 도전1] 스택으로 만드는 뒤로 가기"
unit: core5
difficulty: 3
tags: [core.w5, stack.class]
statement: |
  > 컴퓨팅 핵심 5주차 도전문제 1(포스터 편집 작업 되돌리기)과 같은 유형입니다.

  웹 브라우저의 방문 기록을 스택으로 관리하시오. 스택의 맨 위(리스트의 마지막 원소)가 **현재 보고 있는 페이지**이다.

  | 메서드 | 역할 |
  |---|---|
  | `Stack()` | 빈 리스트를 `self.items`에 저장 |
  | `push(item)` | 맨 위에 추가 |
  | `pop()` | 맨 위를 제거하고 반환. 비어 있으면 `None` |
  | `peek()` | 맨 위를 제거하지 않고 반환. 비어 있으면 `None` |
  | `isEmpty()` | 비어 있으면 `True` |
  | `size()` | 저장된 페이지 수를 반환 |

  명령 (첫 줄에 명령 수, 다음 줄부터 한 줄씩):

  - `방문 페이지명`: 새 페이지로 이동한다(출력 없음). 단, **현재 페이지와 같은 이름이면 새로고침으로 보고 기록에 추가하지 않는다.**
  - `뒤로`: 기록이 2개 이상이면 현재 페이지를 버리고 `현재 페이지: 이전페이지`를 출력한다. 1개 이하이면 기록을 바꾸지 않고 `뒤로 갈 수 없습니다.`를 출력한다.
  - `현재`: `현재 페이지: 페이지명`, 기록이 비어 있으면 `열린 페이지가 없습니다.`

  - 입력 프롬프트: `명령 수: `, 명령마다 `명령: `
  - 메서드 안에서는 출력하지 않고, 클래스 밖에서는 `history`의 메서드만 사용한다(`history.items`를 직접 다루지 않음).
