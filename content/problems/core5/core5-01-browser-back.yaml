solution: |
  class Stack:
      def __init__(self):
          self.items = []

      def push(self, item):
          self.items.append(item)

      def pop(self):
          if self.isEmpty():
              return None
          return self.items.pop()

      def peek(self):
          if self.isEmpty():
              return None
          return self.items[-1]

      def isEmpty(self):
          return len(self.items) == 0

      def size(self):
          return len(self.items)


  history = Stack()
  n = int(input("명령 수: "))
  for _ in range(n):
      parts = input("명령: ").split()
      if parts[0] == "방문":
          if history.peek() != parts[1]:
              history.push(parts[1])
      elif parts[0] == "뒤로":
          if history.size() >= 2:
              history.pop()
              print(f"현재 페이지: {history.peek()}")
          else:
              print("뒤로 갈 수 없습니다.")
      else:
          page = history.peek()
          if page is None:
              print("열린 페이지가 없습니다.")
          else:
              print(f"현재 페이지: {page}")
alt_solutions:
  - |
    class Stack:
        def __init__(self):
            self.items = []

        def push(self, item):
            self.items = self.items + [item]

        def pop(self):
            if not self.items:
                return None
            top = self.items[-1]
            del self.items[-1]
            return top

        def peek(self):
            return self.items[-1] if self.items else None

        def isEmpty(self):
            return not self.items

        def size(self):
            return len(self.items)


    history = Stack()
    for _ in range(int(input("명령 수: "))):
        line = input("명령: ")
        if line.startswith("방문"):
            page = line.split()[1]
            if history.isEmpty() or history.peek() != page:
                history.push(page)
        elif line == "뒤로":
            if history.size() < 2:
                print("뒤로 갈 수 없습니다.")
                continue
            history.pop()
            print("현재 페이지:", history.peek())
        elif history.isEmpty():
            print("열린 페이지가 없습니다.")
        else:
            print("현재 페이지:", history.peek())
