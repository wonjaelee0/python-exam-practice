tests:
  - stdin: "6\n방문 메인\n방문 공지\n방문 성적\n뒤로\n현재\n뒤로\n"
    public: true
  - stdin: "5\n현재\n뒤로\n방문 메인\n뒤로\n현재\n"
    note: 빈 기록과 기록 1개
  - stdin: "6\n방문 a\n방문 a\n방문 b\n방문 b\n뒤로\n뒤로\n"
    note: 새로고침
  - stdin: "8\n방문 a\n방문 b\n뒤로\n방문 a\n방문 c\n뒤로\n뒤로\n현재\n"
hints:
  - "`뒤로`는 pop 한 번 + peek 한 번입니다. 버린 페이지가 아니라 **새 맨 위**를 출력합니다."
  - "새로고침 판정은 `history.peek() != 페이지명`으로 할 수 있습니다. 빈 스택의 peek는 `None`이라 첫 방문도 자연스럽게 추가됩니다."
explanation: |
  뒤로 가기는 '가장 최근 것부터 되돌린다'는 점에서 되돌리기(undo)와 같은 스택 구조입니다.
  클래스 밖에서는 `items`를 직접 보지 않고 `size()`, `peek()` 같은 메서드로만 판단하는 것이 추상자료형의 약속입니다.
