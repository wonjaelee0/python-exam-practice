id: core5-08-recent-views
title: '[5주차 응용3] 최근 본 상품 목록'
unit: core5
difficulty: 3
tags:
- core.w5
- deque
statement: |
  > 컴퓨팅 핵심 5주차 도전문제 3(양쪽 출입구의 물품 보관대)을 응용한 문제입니다.

  쇼핑몰의 '최근 본 상품' 목록을 `deque`로 관리하시오. 목록의 **왼쪽 끝이 가장 최근**에 본 상품이다.

  - `보기 상품명`: 이미 목록에 있으면 그 상품을 빼고, 왼쪽 끝에 넣는다. 그 결과 개수가 최대 보관 개수보다 많으면 **가장 오래된 상품(오른쪽 끝)** 을 버린다. 출력 없음.
  - `목록`: `최근 본 상품: 양말, 모자, 셔츠`(왼쪽부터), 비어 있으면 `최근 본 상품: 없음`

  - 입력 프롬프트: `최대 보관 개수: `, `명령 수: `, 명령마다 `명령: `
  - 사용할 연산: `appendleft`, `pop`, `remove`, `in`
  - 조건: 최대 보관 개수는 1 이상 10 이하, 상품명에는 공백이 없다.
starter: |
  from collections import deque

  k = int(input("최대 보관 개수: "))
  n = int(input("명령 수: "))
  recent = deque()
solution: |
  from collections import deque

  k = int(input("최대 보관 개수: "))
  n = int(input("명령 수: "))
  recent = deque()
  for _ in range(n):
      parts = input("명령: ").split()
      if parts[0] == "보기":
          item = parts[1]
          if item in recent:
              recent.remove(item)
          recent.appendleft(item)
          if len(recent) > k:
              recent.pop()
      else:
          if recent:
              print("최근 본 상품: " + ", ".join(recent))
          else:
              print("최근 본 상품: 없음")
alt_solutions:
- |
  from collections import deque

  k = int(input("최대 보관 개수: "))
  recent = deque()
  for _ in range(int(input("명령 수: "))):
      parts = input("명령: ").split()
      if parts[0] == "목록":
          print("최근 본 상품:", ", ".join(recent) if len(recent) > 0 else "없음")
          continue
      kept = deque()
      for x in recent:
          if x != parts[1]:
              kept.append(x)
      kept.appendleft(parts[1])
      while len(kept) > k:
          kept.pop()
      recent = kept
