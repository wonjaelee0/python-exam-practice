explanation: |
  최근 순서를 유지하는 목록은 '앞에 넣고 뒤에서 버리는' 덱 구조가 자연스럽습니다. 이미 본 상품을 다시 보면 맨 앞으로 옮겨야 같은 상품이 두 번 나오지 않습니다.
