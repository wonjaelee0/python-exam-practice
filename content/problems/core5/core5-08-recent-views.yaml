- name: 가장 최근 상품을 버림
  code: |
    from collections import deque

    k = int(input("최대 보관 개수: "))
    n = int(input("명령 수: "))
    recent = deque()
    for _ in range(n):
        parts = input("명령: ").split()
        if parts[0] == "보기":
            item = parts[1]
            if item in recent:
                recent.remove(item)
            recent.appendleft(item)
            if len(recent) > k:
                recent.popleft()
        else:
            if recent:
                print("최근 본 상품: " + ", ".join(recent))
            else:
                print("최근 본 상품: 없음")
