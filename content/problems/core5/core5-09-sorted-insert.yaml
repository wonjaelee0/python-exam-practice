hints:
- '`current.next.data <= value`인 동안 앞으로 가면 같은 값들 뒤에 자리를 잡습니다.'
- 새 노드를 연결할 때는 `new_node.next = current.next`를 **먼저** 해야 뒤쪽을 잃어버리지 않습니다.
explanation: |
  연결 순서가 중요합니다. `current.next = new_node`를 먼저 하면 원래 뒤에 있던 노드들의 위치를 잃어버립니다.
  head 앞에 넣는 경우에는 반환한 새 head를 받아 다시 저장해야 합니다 (`head = insert_sorted(head, value)`).
