- name: 탈락자를 맨 뒤에서 뺌
  code: |
    from collections import deque

    names = input("참가자(공백 구분): ").split()
    k = int(input("넘기는 횟수: "))
    circle = deque(names)
    while len(circle) > 1:
        for _ in range(k - 1):
            circle.append(circle.popleft())
        print(f"탈락: {circle.pop()}")
    print(f"우승: {circle[0]}")
tests:
- stdin: "가온 나래 다온 라온 마루\n2\n"
  public: true
- stdin: "a b c\n1\n"
- stdin: "혼자\n3\n"
  note: 한 명
- stdin: "a b c\n5\n"
- stdin: "p q r s t u v\n3\n"
hints:
- k번째를 맨 앞으로 오게 하려면 앞사람을 k − 1번 맨 뒤로 보냅니다.
explanation: |
  덱의 `popleft()`와 `append()`를 함께 쓰면 원을 한 칸씩 돌릴 수 있습니다. 리스트의 `pop(0)`과 달리 덱은 앞에서 꺼내도 남은 원소를 옮기지 않아 빠릅니다.
