hints:
  - "삭제할 노드의 **바로 앞 노드**에서 `앞노드.next = 삭제노드.next`로 건너뛰게 연결합니다."
  - "첫 노드는 앞 노드가 없으므로 따로 처리해 `head.next`를 새 head로 반환합니다."
explanation: |
  연결 리스트의 삭제는 노드를 지우는 것이 아니라 **연결을 건너뛰게 바꾸는 것**입니다. 앞 노드의 next를 삭제 노드의 next로 바꾸면 뒤쪽 노드들은 그대로 이어집니다.
  head가 바뀔 수 있는 연산은 새 head를 반환받아 다시 저장해야 합니다 (`head, found = delete_stop(head, target)`).
