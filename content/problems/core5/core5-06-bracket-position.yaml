tests:
- stdin: "(a+b)*[c-{d/e}]\n"
  public: true
- stdin: "x{(})y\n"
- stdin: "((1+2)\n"
- stdin: "\n"
  note: 빈 수식
- stdin: "]\n"
- stdin: "{[()()]}(\n"
- stdin: "abc)\n"
hints:
- '`enumerate(text, 1)`을 쓰면 위치를 1부터 셀 수 있습니다.'
- 닫는 괄호에 맞는 여는 괄호는 딕셔너리 `pairs[ch]`로 찾습니다.
explanation: |
  가장 최근에 연 괄호가 가장 먼저 닫혀야 하므로 스택이 알맞습니다. 오류가 나는 순간 멈춰야 정확한 위치를 알릴 수 있습니다.
